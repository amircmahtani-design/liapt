  "Mountain Climber":"Slow Mountain Climber","Kettlebell Swing":"Cable Pull-Through",
  "Skater":"Lateral Step","Deadlift":"DB Romanian Deadlift"
};
function hasTag(ex,tag){ const e=EX(ex); return !!(e&&e.tags&&e.tags.includes(tag)); }

/* ---------- session building ---------- */
function newItem(src){
  const e=EX(src.ex)||{};
  const it={id:uid(), ex:src.ex, reps:src.reps!=null?src.reps:null, time:src.time||null,
            side:!!src.side, load:e.load||"bw", weight:null, note:src.note||""};
  const s=suggestLoad(src.ex);
  if(s) it.weight=s.kg;
  return it;
}
function estimateMinutes(w){
  let sec=0;
  (w.prep||[]).forEach(p=>{ sec += (p.time? p.time*(p.side?2:1) : (p.reps||10)*4) + 10; });
  (w.blocks||[]).forEach(b=>{
    const n=b.items.length;
    let round=0;
    b.items.forEach(it=>{
      round += (it.time? it.time*(it.side?2:1) : (typeof it.reps==="number"? it.reps*3.6 : 30)) + 10;
    });
    const change = b.flow? 0 : restFor(w,b,"superset")*(n-1);
    const rounds = b.rounds||1;
    sec += (round+change)*rounds + restFor(w,b,"round")*Math.max(0,rounds-1);
    sec += b.flow?0:restFor(w,b,"block");
  });
  (w.cooldown||[]).forEach(c=>{ sec += (c.time||40)*(c.side?2:1) + 8; });
  return Math.max(1,Math.round(sec/60));
}
/* ---------- the rest system ----------
   Four different transitions, four different defaults, each overridable. */
function restDefaults(){
  const d={superset:20,round:75,block:100,straight:75};
  return {...d,...((DB.prefs&&DB.prefs.rest)||{})};
}
function restFor(w,b,kind,item){
  const d=restDefaults();
  if(!b) return d[kind]||0;
  if(b.flow) return 0;
  if(kind==="superset"){
    if(b.items.length<2) return 0;                 /* straight sets have no changeover */
    if(item && item.rest!=null) return Math.max(0,item.rest);
    return Math.max(0,d.superset);
  }
  if(kind==="round"){
    if(b.items.length<2) return Math.max(0, b.rest!=null? b.rest : d.straight);
    return Math.max(0, b.rest!=null? b.rest : d.round);
  }
  if(kind==="block") return Math.max(0,d.block);
  return 0;
}
/* ---------- preparing for, and unwinding from, THIS session ----------
   The warm-up used to prepare for the day's label and the cool-down used to
   stretch it. Now that the movements rotate, the label is not the session:
   both are built from the movements actually chosen. */
const PREP_BY_PATTERN = {
  squat:[{ex:"90/90 Hip Switch",time:45},{ex:"Bodyweight Squat",reps:10}],
  hinge:[{ex:"Hamstring Sweep",time:30,side:true},{ex:"Glute Bridge",reps:12}],
  lunge:[{ex:"Half-kneeling Hip Flexor Stretch",time:30,side:true},{ex:"World's Greatest Stretch",time:40,side:true}],
  thrust:[{ex:"Glute Bridge",reps:12},{ex:"Clamshell",reps:12,side:true}],
  abduction:[{ex:"Clamshell",reps:12,side:true}],
  "push-h":[{ex:"Scapular Push-up",reps:10}],
  "push-v":[{ex:"Wall Slide",reps:8},{ex:"Band Pass-through",time:40}],
  "pull-h":[{ex:"Band Pull-Apart",reps:12},{ex:"Scapular Pull",reps:8}],
  "pull-v":[{ex:"Scapular Pull",reps:8},{ex:"Band Pull-Apart",reps:12}],
  carry:[{ex:"Dead Bug",reps:6,side:true}],
  calf:[{ex:"Downward Dog",time:40}],
  curl:[{ex:"Band Pass-through",time:30}],
  extension:[{ex:"Band Pass-through",time:30}],
  cardio:[{ex:"March in Place",time:45},{ex:"90/90 Hip Switch",time:40}],
  "core-anti-ext":[{ex:"Dead Bug",reps:6,side:true}],
  "core-anti-rot":[{ex:"Dead Bug",reps:6,side:true}],
  "core-anti-lat":[{ex:"Connection Breath",time:45}],
  "core-flex":[{ex:"Connection Breath",time:45}],
  "core-ext":[{ex:"Cat-Cow",time:40}],
  breath:[{ex:"Connection Breath",time:45}]
};
/* Stretch what she actually worked, hardest-worked first. */
const COOLDOWN_BY_MUSCLE = {
  glutes:["Glute Stretch","Pigeon Pose","Figure Four (seated)"],
  hamstrings:["Hamstring Sweep","Seated Hamstring Stretch","Downward Dog"],
  quads:["Half-kneeling Hip Flexor Stretch","World's Greatest Stretch"],
  calves:["Downward Dog"],
  back:["Child's Pose","Sphinx Pose","Cat-Cow"],
  lats:["Puppy Pose","Child's Pose","Thread the Needle"],
  "upper-back":["Thread the Needle","Open Book","Thoracic Extension"],
  shoulders:["Band Pass-through","Wall Angel","Puppy Pose"],
  chest:["Open Book","Band Pass-through","Thread the Needle"],
  arms:["Band Pass-through","Child's Pose"],
  "deep-core":["Sphinx Pose","90/90 Breathing","Child's Pose"],
  obliques:["Thread the Needle","Sphinx Pose"],
  neck:["Upper Trap Stretch","Levator Scapulae Stretch","Neck Rotation"],
  cardio:["Downward Dog","90/90 Breathing"],
  mobility:["Child's Pose","90/90 Breathing"]
};
/* How much of the session each muscle actually took, rounds included. */
function sessionMuscleScore(blocks){
  const score={};
  (blocks||[]).forEach(b=>{
    const rounds=b.rounds||1;
    (b.items||[]).forEach(it=>{
      ((EX(it.ex)||{}).m||[]).forEach((mus,i)=>{
        score[mus]=(score[mus]||0)+rounds*(i===0?2:1);
      });
    });
  });
  return score;
}
function topMuscles(blocks,n){
  const sc=sessionMuscleScore(blocks);
  return Object.keys(sc).filter(m=>m!=="mobility")
    .sort((a,b)=>sc[b]-sc[a]).slice(0,n||4);
}
function sessionPatterns(blocks){
  const out=[];
  (blocks||[]).forEach(b=>(b.items||[]).forEach(it=>{
    const p=(EX(it.ex)||{}).pat;
    if(p && !out.includes(p)) out.push(p);
  }));
  return out;
}

/* A movement she has told us she does not like, or that hurt, never appears
   again — in the working sets, the warm-up or the cool-down. */
function movementAllowed(ex){
  if(!EX(ex)) return false;
  if((DB.exPrefs||{})[ex] && DB.exPrefs[ex].avoid) return false;
  if((coach().blocked||{})[ex]) return false;
  return true;
}
function buildPrep(focus,neck,blocks){
  const ok=p=>movementAllowed(p.ex);
  /* the neck and rib work is the point of this app — it is in every session */
  const out=PREP_BASE.filter(ok).map(newItem);
  const add=p=>{ if(ok(p) && !out.some(o=>o.ex===p.ex)) out.push(newItem(p)); };
  /* then rehearse the patterns today actually contains, in the order they
     come up, rather than the patterns the day is named after */
  const pats=sessionPatterns(blocks);
  if(pats.length){
    /* one move per pattern first, so every pattern in the session is
       rehearsed before any of them gets a second move */
    pats.forEach(pt=>{ const l=PREP_BY_PATTERN[pt]||[]; if(l[0]) add(l[0]); });
    pats.forEach(pt=>(PREP_BY_PATTERN[pt]||[]).slice(1).forEach(add));
  }
  else (focus||[]).forEach(f=>(PREP_BY_FOCUS[f]||[]).forEach(add));
  if(neck>=4) PREP_NECK_EXTRA.filter(ok).forEach(p=>{ if(!out.some(o=>o.ex===p.ex)) out.splice(2,0,newItem(p)); });
  /* if her avoid list has thinned it out, top it up from the mobility pool */
  if(out.length<4){
    EX_NAMES.filter(n=>catOf(n)==="mobility" && movementAllowed(n) && !out.some(o=>o.ex===n))
      .slice(0,4-out.length)
      .forEach(n=>out.push(newItem({ex:n,time:40})));
  }
  /* Eight is already a long warm-up to read on a phone. */
  return out.slice(0,8);
}
function buildCooldown(focus){
  const names=[];
  (focus||[]).forEach(f=>{ (COOLDOWN_BY_FOCUS[f]||[]).forEach(n=>{ if(!names.includes(n)) names.push(n); }); });
  if(!names.length) names.push("Child's Pose","90/90 Breathing");
  const secs=(DB.prefs.cooldownSec||40);
  return names.slice(0,4).map(n=>{ const e=EX(n)||{};
    return newItem({ex:n,time:secs,side:(e.tags||[]).includes("unilateral")|| /Stretch|Open Book|Thread/.test(n)}); });
}
/* ---------- how long is this session? ----------
   A shorter session is a designed session, not a truncated one. The rules,
   in order: the warm-up and the neck prep always survive; block A (the day's
   compound work) is never dropped; rounds come off the back before a block
   does; a block is only dropped once its rounds are at the floor; and the
   cool-down always survives, shortened if it must be. */
const DURATION_PRESETS = ["quick","standard","full"];
function durationMins(key){
  const d=(DB.prefs&&DB.prefs.durations)||{quick:20,standard:40,full:60};
  if(key==="custom") return DB.prefs.customMins||45;
  return d[key]||d.full||60;
}
function durationLabel(key){
  return key==="quick"?"Quick":key==="standard"?"Standard":key==="full"?"Full":"Custom";
}
function nearestPreset(mins){
  let best="full",gap=1e9;
  DURATION_PRESETS.forEach(k=>{ const g=Math.abs(durationMins(k)-mins); if(g<gap){gap=g;best=k;} });
  return gap<=4? best : "custom";
}
/* Fit the day's template to a target number of minutes. */
function fitToTime(w, targetMins){
  const floorRounds=b=>b.flow?1:2;
  let guard=0;
  /* too long: trim from the back */
  while(estimateMinutes(w) > targetMins+3 && guard++<60){
    const trimmable=w.blocks.filter((b,i)=>i>0 && !b.flow && b.rounds>floorRounds(b));
    if(trimmable.length){ trimmable[trimmable.length-1].rounds--; continue; }
    if(w.blocks.length>1){ w.blocks.pop(); continue; }
    if(w.blocks[0].rounds>2){ w.blocks[0].rounds--; continue; }
    if((w.cooldown||[]).length>2){ w.cooldown.pop(); continue; }
    if((w.prep||[]).length>5){ w.prep.pop(); continue; }
    break;
  }
  /* room to spare: put rounds back, up to four, and then to five if the
     session is still well short of what she asked for — which happens when
     the kit she has today leaves fewer blocks to fill the hour */
  [4,5].forEach(ceiling=>{
    let g=0;
    while(estimateMinutes(w) < targetMins-6 && g++<40){
      const growable=w.blocks.filter(b=>!b.flow && b.rounds<ceiling);
      if(!growable.length) break;
      growable[0].rounds++;
    }
  });
  w.mins=estimateMinutes(w);
  return w;
}
/* Anchors are held for a block, then released so the next block can choose
   again. Pain, an avoid flag or a disappearance from the catalogue releases
   one early. */
function refreshAnchors(dateISO,ctx){
  const c=coach();
  Object.keys(c.anchors||{}).forEach(k=>{
    const a=c.anchors[k];
    if(!a || !a.ex) { delete c.anchors[k]; return; }
    if(!EX(a.ex) || ctx.blocked[a.ex] || (ctx.prefs[a.ex]||{}).avoid){ delete c.anchors[k]; return; }
    if(daysBetween(a.since,dateISO) >= buildMode().holdDays) delete c.anchors[k];
  });
}

/* mode: "full" | "short" | a preset key | a number of minutes */
function buildSession(dateISO,mode){
  const date=dateISO||today();
  const ci=checkinOn(date);
  const plan=planForDay(date,ci);
  if(!plan) return restSession(date);
  const neck=ci? (+ci.neck||0) : 0;

  let targetMins, durKey;
  if(typeof mode==="number"){ targetMins=mode; durKey=nearestPreset(mode); }
  else if(mode==="short"){ durKey="quick"; targetMins=durationMins("quick"); }
  else if(mode==="full"||mode==null){ durKey=DB.prefs.lastDuration||"full"; targetMins=durationMins(durKey); }
  else { durKey=mode; targetMins=durationMins(mode); }

  /* Under half an hour, start from the purpose-built short template so the
     session is coherent rather than a squeezed version of the long one. */
  const variant = targetMins<=26 ? "short" : "full";
  if(plan.kind==="mobility") targetMins=Math.min(targetMins,32);
  const ctx = buildContext(date,ci);
  refreshAnchors(date,ctx);
  const c=coach();
  const taken=new Set();
  const kept=[], rotated=[];

  /* She gave this day a thumbs up, so it comes back — same session, heavier.
     Only until the block turns over, and only while nothing else has ruled a
     movement out. */
  const fav = (ci && ci.focus && ci.focus!=="auto")? null : favouriteFor(date,plan);
  if(fav && durKey===fav.duration){
    const r=replayFavourite(fav,date);
    const w={
      date, dayKey:plan.key, title:fav.title, tag:fav.tag, kind:fav.kind, focus:fav.focus,
      mode:fav.mode, duration:durKey, targetMins:fav.targetMins||targetMins,
      blockWeek:ctx.week, replay:true, replayRun:(fav.runs||1)+1,
      prep:buildPrep(plan.focus,neck,r.blocks),
      blocks:r.blocks,
      cooldown:buildCooldownV(plan.focus,date,ctx.nonce,r.blocks),
      adjustments:[], analysis:null, generatedAt:Date.now(), edited:false,
      state:freshState(), log:{}
    };
    w.mins=estimateMinutes(w);
    /* pain, kit and the neck still get the last word on a repeat */
    w.issues=repairSession(w,ctx,{replay:true});
    w.mins=estimateMinutes(w);
    rememberSignature(w);
    const lift=r.lifted[0];
    w.why=[
      "You gave this one a thumbs up, so it's back.",
      lift? ("Heavier where it counts — "+lift.ex+" "+kgTxt(lift.from)+" to "+kgTxt(lift.to)+".")
          : "Same session, same numbers — nothing here loads up.",
      BLOCK_NOTE[ctx.week]
    ].filter(Boolean).slice(0,3);
    return w;
  }

  const blocks = slotsFor(plan,variant).map(sb=>({
    label:sb.label, rounds:sb.rounds, rest:sb.rest, flow:sb.flow, straight:sb.straight,
    items: sb.items.map(slot=>{
      const ex = pickForSlot(slot,ctx,taken);
      if(!ex || !EX(ex)) return null;   /* nothing fits today — drop the slot */
      taken.add(ex);
      const prog = progressionFor(ex,slot,ctx);
      const it = newItem({ex, reps:prog.reps, time:prog.time, side:slot.side});
      it.slot = {key:slot.key, cat:slot.cat, pat:slot.pat, seed:slot.seed,
                 loaded:slot.loaded, timed:slot.timed, role:slot.role,
                 reps:slot.reps, time:slot.time, side:slot.side};
      it.role = slot.role;
      it.cat  = slot.cat;
      if(prog.why)  it.progressWhy  = prog.why;
      if(prog.kind) it.progressKind = prog.kind;
      if(slot.role==="anchor"){
        const a=c.anchors[slot.key];
        if(a && a.ex===ex && a.since<date) kept.push({ex, why:prog.why});
        if(!a || a.ex!==ex) c.anchors[slot.key]={ex, since:date};
      } else if(ex!==slot.seed){ rotated.push(ex); }
      return it;
    }).filter(Boolean)
  })).filter(b=>b.items.length);

  /* ---- the balance slot ----
     Leaning a slot toward a missing category only works if a slot of that
     category exists. On the last training day of the week it does not, so one
     accessory slot is re-pointed at whatever the week never got to. Never an
     anchor, never more than one, and only when the week is actually short. */
  const gaps=ctx.weekGaps||[];
  if(ctx.daysLeft===0 && gaps.length && blocks.length){
    const lastBlock=blocks[blocks.length-1];
    const idx=lastBlock.items.map((it,i)=>({it,i})).filter(x=>x.it.role!=="anchor").pop();
    if(idx){
      const taken2=new Set(exercisesIn({blocks}));
      taken2.delete(idx.it.ex);
      for(const gap of gaps){
        const slot={...(idx.it.slot||{}), cat:gap, loaded:false, timed:false,
                    role:"accessory", key:(plan.key||"day")+"/balance"};
        const pick=pickForSlot(slot,ctx,taken2);
        if(pick && pick!==idx.it.ex){
          const it=newItem({ex:pick, reps:idx.it.reps!=null?idx.it.reps:10,
                            time:idx.it.time, side:idx.it.side});
          it.slot=slot; it.role="accessory"; it.cat=gap; it.balance=true;
          lastBlock.items[idx.i]=it;
          break;
        }
      }
    }
  }

  /* week four is the lighter week — the volume comes off here, not the reps */
  if(ctx.week===4) blocks.forEach(b=>{ if(!b.flow) b.rounds=Math.max(2,(b.rounds||3)-1); });

  const w={
    date, dayKey:plan.key, title:plan.title, tag:plan.tag, kind:plan.kind, focus:plan.focus,
    mode: variant, duration:durKey, targetMins,
    blockWeek: ctx.week,
    prep:buildPrep(plan.focus,neck,blocks),
    blocks,
    cooldown:buildCooldownV(plan.focus,date,ctx.nonce,blocks),
    adjustments:[], analysis:null, generatedAt:Date.now(), edited:false,
    state:freshState(), log:{}
  };
  fitToTime(w,targetMins);
  w.issues = repairSession(w,ctx);
  fitToTime(w,targetMins);
  rememberSignature(w);
  w.why = buildWhy(w,ctx,kept,rotated);
  w.mins = estimateMinutes(w);
  return w;
}

function freshState(){
  return { b:0, i:0, r:1, done:{}, phase:"ready",
           prepDone:{}, coolDone:{},
           clock:{ startedAt:null, pausedMs:0, pausedAt:null },
           rest:null, work:null, finished:false };
}
function restSession(date){
  return {date, dayKey:"rest", title:"Rest day", kind:"rest", focus:["mobility"], mode:"full",
    prep:[], blocks:[], cooldown:[], adjustments:[], rest:true, mins:0,
    state:freshState(), log:{}};
}
function sessionFor(date,create){
  const d=date||today();
  let w=(DB.sessions||{})[d];
  if(!w && create!==false){ w=buildSession(d); DB.sessions[d]=w; save(); }
  return w||null;
}
function regenerate(date,mode){
  const d=date||today();
  const prev=DB.sessions[d];
  const w=buildSession(d, mode!=null? mode : (prev&&prev.duration)||"full");
  /* Rebuilding keeps the clock running if she is already training. */
  if(prev&&prev.state&&prev.state.clock&&prev.state.clock.startedAt){
    w.state.clock={...prev.state.clock};
    w.state.phase = prev.state.phase==="ready"?"ready":"work";
  }
  DB.sessions[d]=w; save(); return w;
}
/* Change the length of a session, before or during. Completed work is kept:
   sets are logged against the exercise name and the date, not the position. */
function setDuration(date,key){
  const d=date||today();
  const prev=DB.sessions[d];
  DB.prefs.lastDuration = key==="custom"? "custom" : key;
  const w=buildSession(d,key);
  if(prev&&prev.state){
    w.state.clock={...(prev.state.clock||w.state.clock)};
    w.state.prepDone=prev.state.prepDone||{};
    w.state.phase= prev.state.phase==="ready"?"ready":(prev.state.phase||"ready");
    if(prev.state.clock&&prev.state.clock.startedAt && w.state.phase==="ready") w.state.phase="work";
  }
  if(prev&&prev.analysis) w.analysis=prev.analysis;
  const ci=checkinOn(d);
  if(ci&&ci.analysed) applyCheckin(w,ci);
  DB.sessions[d]=w; save();
  return w;
}

/* ---------- swap helpers ---------- */
function swapItem(w,itemId,newEx,why){
  if(!EX(newEx) || UNAVAILABLE.test(newEx)) return null;
  for(const b of w.blocks){
    const i=b.items.findIndex(x=>x.id===itemId);
    if(i>=0){
      const old=b.items[i];
      const it=newItem({ex:newEx,reps:old.reps,time:old.time,side:old.side});
      it.id=old.id; it.swappedFrom=old.ex; if(why) it.why=why;
      it.slot=old.slot; it.role=old.role; it.cat=old.cat;
      b.items[i]=it; w.edited=true;
      /* she chose this one over the one on the screen — remember both */
      if(why!=="neck" && why!=="pelvic"){ exStat(newEx).chosen=(exStat(newEx).chosen||0)+1;
        exStat(old.ex).swappedOut=(exStat(old.ex).swappedOut||0)+1; }
      return it;
    }
  }
  return null;
}
function findItem(w,id){
  for(const b of w.blocks){ const it=b.items.find(x=>x.id===id); if(it) return {item:it,block:b}; }
  return null;
}
/* A warm-up move and a working set are both movements she might not fancy,
   so everything that can be swapped is found the same way. */
function findAnyItem(w,id){
  const inBlock=findItem(w,id);
  if(inBlock) return {...inBlock, where:"block"};
  let it=(w.prep||[]).find(x=>x.id===id);
  if(it) return {item:it, block:null, list:w.prep, where:"prep"};
  it=(w.cooldown||[]).find(x=>x.id===id);
  if(it) return {item:it, block:null, list:w.cooldown, where:"cool"};
  return null;
}
function swapAnyItem(w,id,newEx,why){
  const f=findAnyItem(w,id); if(!f||!EX(newEx)||UNAVAILABLE.test(newEx)) return null;
  if(f.where==="block") return swapItem(w,id,newEx,why);
  const old=f.item, i=f.list.indexOf(old);
  const it=newItem({ex:newEx,reps:old.reps,time:old.time,side:old.side});
  it.id=old.id; it.swappedFrom=old.ex; if(why) it.why=why;
  f.list[i]=it; w.edited=true;
  if(why!=="neck"&&why!=="pelvic"){ exStat(newEx).chosen=(exStat(newEx).chosen||0)+1;
    exStat(old.ex).swappedOut=(exStat(old.ex).swappedOut||0)+1; }
  w.mins=estimateMinutes(w);
  return it;
}

/* ---------- the adjustment engine ----------
   Deterministic. Runs whether or not an API key is present. The model is
   asked afterwards only to write the sentence Lia reads. */
function applyCheckin(w,ci){
  const ch=[];
  if(!w||w.rest) return ch;
  const neck=+ci.neck||0, pain=+ci.pain||0, energy=+ci.energy||5, sleep=+ci.sleep||5,
        sore=+ci.soreness||0, stress=+ci.stress||0;
  const r=readiness(ci);
  const cyc=cycleInfo(w.date);
  const pelvic = Array.isArray(ci.pelvic)? ci.pelvic : [];

  /* 1. time budget */
  if(ci.time==="short" && w.mode!=="short"){
    const nw=buildSession(w.date,"quick");
    w.blocks=nw.blocks; w.mode="short"; w.duration="quick"; w.targetMins=nw.targetMins;
    w.prep=nw.prep; w.cooldown=nw.cooldown;
    ch.push("Short session — "+plural(nw.blocks.length,"block")+" instead of three.");
  }

  /* 2. neck */
  if(neck>=4){
    let swapped=0;
    w.blocks.forEach(b=>b.items.forEach(it=>{
      const alt=NECK_SWAPS[it.ex];
      const risky = alt && (hasTag(it.ex,"overhead") || hasTag(it.ex,"neck-sensitive") || neck>=6);
      if(risky && EX(alt)){ swapItem(w,it.id,alt,"neck"); swapped++; }
    }));
    if(swapped) ch.push(neck>=6
      ? "Neck is loud today — overhead and neck-loading work is out, "+plural(swapped,"movement")+" swapped for supported versions."
      : "Overhead loading removed, "+plural(swapped,"movement")+" swapped for neck-friendlier options.");
    const extra=PREP_NECK_EXTRA.filter(p=>!w.prep.some(o=>o.ex===p.ex)).map(newItem);
    if(extra.length){ w.prep.splice(2,0,...extra); ch.push("Extra neck and thoracic preparation added."); }
  }
  if(neck>=8){
    w.blocks.forEach(b=>{ b.rounds=Math.max(2,(b.rounds||3)-1); b.rest=(b.rest||60)+15; });
    ch.push("Rounds reduced and rest extended while the neck settles.");
  }

  /* 3. pain and pelvic symptoms */
  if(pain>=5 || pelvic.length){
    let n=0;
    w.blocks.forEach(b=>b.items.forEach(it=>{
      const alt=PELVIC_SWAPS[it.ex];
      if(alt && EX(alt)){ swapItem(w,it.id,alt,"pelvic"); n++; }
    }));
    if(n) ch.push("Pressure and impact reduced — "+plural(n,"movement")+" changed for pelvic-safe versions.");
    if(!w.prep.some(p=>p.ex==="Connection Breath")) w.prep.unshift(newItem({ex:"Connection Breath",time:60}));
  }

  /* 4. readiness → volume */
  if(r<40){
    w.blocks.forEach(b=>{ if(!b.flow) b.rounds=Math.max(2,(b.rounds||3)-1); b.rest=(b.rest||60)+15; });
    ch.push("A round off each block and longer rests — the tank is low today.");
  } else if(r<58){
    const last=w.blocks.filter(b=>!b.flow).slice(-1)[0];
    if(last){ last.rounds=Math.max(2,(last.rounds||3)-1); ch.push("One round off the last block."); }
  } else if(r>=85 && w.mode==="full" && sore<4 && neck<4){
    ch.push("Everything green — this is a day to push the loads.");
  }

  /* 5. soreness in a trained area */
  if(sore>=7){
    w.blocks.forEach(b=>{ b.rest=(b.rest||60)+10; });
    ch.push("Rests extended for the soreness.");
  }

  /* 6. cycle — one input among several, never the whole story */
  if(DB.prefs.cycleOn && cyc.known){
    const sym=(ci.cycleSymptoms||[]);
    const heavy = sym.includes("cramps") || sym.includes("heavy") || (ci.cramps||0)>=5;
    if(cyc.bleeding && heavy && r<70){
      w.blocks.forEach(b=>{ if(!b.flow) b.rounds=Math.max(2,(b.rounds||3)-1); });
      ch.push("Cramps reported and energy is down — volume trimmed, mobility kept.");
    } else if(cyc.phase==="luteal" && r<50){
      ch.push("Luteal phase and a low check-in — the loads stay where they were last week.");
    }
  }

  /* 7. recompute the clock */
  w.mins=estimateMinutes(w);
  w.adjustments=ch;
  w.checkinApplied=ci.id||true;
  w.edited=true;
  return ch;
}

/* ---------- replacement suggestions ---------- */
function replacementsFor(w,itemId,n){
  const found=findAnyItem(w,itemId); if(!found) return [];
  const it=found.item, e=EX(it.ex)||{};
  const target=(e.m||[])[0];
  const pat=e.pat;
  const neck=neckToday();
  const inSession=new Set();
  w.blocks.forEach(b=>b.items.forEach(x=>inSession.add(x.ex)));
  (w.prep||[]).forEach(x=>inSession.add(x.ex));
  (w.cooldown||[]).forEach(x=>inSession.add(x.ex));
  const prefs=DB.exPrefs||{};
  const scored=allNames().filter(nm=>{
    if(nm===it.ex||inSession.has(nm)) return false;
    const c=EX(nm); if(!c) return false;
    if(prefs[nm]&&prefs[nm].avoid) return false;
    if(coach().blocked[nm]) return false;
    if(UNAVAILABLE.test(nm)) return false;
    if(neck>=5 && (hasTag(nm,"overhead")||hasTag(nm,"neck-sensitive"))) return false;
    const m=c.m||[];
    return m.includes(target) || c.pat===pat;
  }).map(nm=>{
    const c=EX(nm); let s=0;
    if((c.m||[])[0]===target) s+=5; else if((c.m||[]).includes(target)) s+=3;
    if(c.pat===pat) s+=3;
    if(c.eq===e.eq) s+=2;                      /* stay at the same station */
    if((DB.prefs.favourEquipment||[]).includes(c.eq)) s+=2;   /* bands, in her case */
    if(prefs[nm]&&prefs[nm].love) s+=3;
    if(mediaFor(nm)) s+=1;
    const st=(coach().exStats||{})[nm]||{};
    s += (st.chosen||0)*2 - (st.disliked||0)*3 - (st.swappedOut||0);
    const ago=recentUse(nm);
    if(ago!=null && ago<3) s-=6;               /* she did it in the last two days */
    if((c.tags||[]).includes("pelvic-safe")) s+=1;
    return {name:nm,score:s,why:whyReplacement(c,e,target)};
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,n||3);
}
function recentUse(ex){
  const h=history(ex);
  if(!h.length) return null;
  const last=h.map(e=>e.date).sort().slice(-1)[0];
  return daysBetween(last,today());
}
function whyReplacement(c,e,target){
  const bits=[];
  if((c.m||[])[0]===target) bits.push("same muscle");
  if(c.pat===e.pat) bits.push("same pattern");
  if(c.eq===e.eq) bits.push("no kit change");
  else bits.push(EQUIP_LABEL[c.eq]||c.eq);
  return bits.slice(0,2).join(" · ");
}

/* ---------- logging and records ---------- */
function logSet(w,itemId,payload){
  const f=findItem(w,itemId); if(!f) return null;
  const it=f.item, ex=it.ex, d=w.date;
  DB.strength[ex]=DB.strength[ex]||[];
  let entry=DB.strength[ex].find(e=>e.date===d);
  if(!entry){ entry={date:d,sets:[]}; DB.strength[ex].push(entry); }
  const set={};
  if(payload.w!=null) set.w=payload.w;
  if(payload.r!=null) set.r=payload.r;
  if(payload.sec!=null) set.sec=payload.sec;
  if(payload.txt!=null) set.txt=payload.txt;
  if(payload.rpe!=null) set.rpe=payload.rpe;
  if(payload.pain) set.pain=payload.pain;
  entry.sets.push(set);
  const pr=detectPR(ex,set,d);
  save();
  return pr;
}
function detectPR(ex,set,date){
  const prior=history(ex).filter(e=>e.date!==date);
  if(!prior.length) return null;                 /* first time isn't a record */
  let bestW=0,bestRepsAtW=0,bestSec=0;
  prior.forEach(e=>(e.sets||[]).forEach(s=>{
    if((s.w||0)>bestW){ bestW=s.w||0; bestRepsAtW=s.r||0; }
    else if((s.w||0)===bestW && (s.r||0)>bestRepsAtW) bestRepsAtW=s.r||0;
    if((s.sec||0)>bestSec) bestSec=s.sec||0;
  }));
  let pr=null;
  if(set.w && set.w>bestW && bestW>0) pr={kind:"weight",value:kgTxt(set.w)+" × "+(set.r||0)};
  else if(set.w && set.w===bestW && (set.r||0)>bestRepsAtW && bestRepsAtW>0) pr={kind:"reps",value:kgTxt(set.w)+" × "+set.r};
  else if(set.sec && set.sec>bestSec && bestSec>0) pr={kind:"time",value:set.sec+"s"};
  if(pr){
    pr.ex=ex; pr.date=date;
    if(!(DB.prs||[]).some(p=>p.ex===ex&&p.date===date&&p.kind===pr.kind)){ DB.prs.push(pr); }
  }
  return pr;
}
function sessionSetsDone(w){
  let done=0,total=0;
  (w.blocks||[]).forEach(b=>{ total += (b.items.length*(b.rounds||1)); });
  done = Object.keys(w.state.done||{}).length;
  return {done,total};
}
function completeSession(w){
  w.state.finished=true;
  w.state.rest=null; w.state.work=null;
  if(w.state.clock && w.state.clock.pausedAt){
    w.state.clock.pausedMs=(w.state.clock.pausedMs||0)+(Date.now()-w.state.clock.pausedAt);
    w.state.clock.pausedAt=null;
  }
  w.elapsedMs=sessionElapsed(w);
  w.completedAt=Date.now();
  const {done,total}=sessionSetsDone(w);
  w.completion = total? Math.round(done/total*100) : 0;
  /* the engine only learns from work that actually happened */
  const state=w.state.done||{};
  (w.blocks||[]).forEach(b=>b.items.forEach(it=>{
    const keys=Object.keys(state).filter(k=>k.endsWith("-"+it.id));
    const didAny=keys.some(k=>!state[k].skipped);
    if(didAny){ noteDone(it.ex); if(it.progressKind) noteProgress(it.ex,it.progressKind); }
    else if(keys.length) noteSkipped(it.ex);
  }));
  updateStreak(w.date);
  save();
}
/* ---------- the nudge ----------
   What she lifted, how it felt in her own words, and one number to aim at.
   One sentence, no jargon, and only when there is something real to say. */
function howItFelt(dateISO){
  const f=(coach().feedback||[]).find(x=>x.date===dateISO);
  if(!f||!f.effort) return null;
  return f.effort==="easy"? "easy" : f.effort==="hard"? "hard" : null;
}
function whenWord(dateISO){
  const d=daysBetween(dateISO,today());
  if(d<=1) return "Yesterday";
  if(d<=9) return "Last time";
  if(d<=16) return "A fortnight ago";
  return ukShort(dateISO);
}
function nextTarget(ex,kg,felt){
  const step=loadStep(kg);
  if(felt==="easy") return roundLoad(kg+step*2);
  if(felt==="hard") return null;
  return roundLoad(kg+step);
}
function progressNote(ex,dateISO){
  const e=EX(ex)||{};
  if(e.load!=="kg") return null;
  const prev=lastBefore(ex,dateISO||today());
  const t=topSet(prev);
  if(!prev||!t||!t.w) return null;
  const felt=howItFelt(prev.date);
  const up=nextTarget(ex,t.w,felt);
  const said = felt==="easy"? " and it felt easy" : felt==="hard"? " and it felt hard" : "";
  if(felt==="hard") return { text: whenWord(prev.date)+" "+kgTxt(t.w)+said+". Stay there today.", kg:t.w, hold:true };
  if(!up || up<=t.w) return { text: whenWord(prev.date)+" "+kgTxt(t.w)+" \u00d7 "+(t.r||0)+". Match it or beat it.", kg:t.w };
  return { text: whenWord(prev.date)+" "+kgTxt(t.w)+said+" \u2014 try "+kgTxt(up)+".", kg:up, up:true };
}

/* ---------- the workout clock ----------
   Timestamps, never accumulated intervals. A backgrounded tab, a locked
   phone and a page refresh all produce the same number. */
function sessionElapsed(w){
  const c=w&&w.state&&w.state.clock;
  if(!c||!c.startedAt) return 0;
  const paused=(c.pausedMs||0) + (c.pausedAt? (Date.now()-c.pausedAt) : 0);
  return Math.max(0, Date.now()-c.startedAt-paused);
}
function isPaused(w){ return !!(w&&w.state&&w.state.clock&&w.state.clock.pausedAt); }
function sessionLive(w){ return !!(w&&w.state&&w.state.clock&&w.state.clock.startedAt&&!w.state.finished); }

/* ---------- discarding a session ----------
   Ending a workout saves what was done. Discarding one says it never
   happened: the logged sets for that date come out of the strength history,
   any record claimed on that date goes with them, and the streak is counted
   again. Every discard leaves an undo snapshot. */
function loggedOn(dateISO){
  const d=dateISO||today();
  let sets=0; const exs=[];
  Object.keys(DB.strength||{}).forEach(ex=>{
    const e=(DB.strength[ex]||[]).find(x=>x.date===d);
    if(e && (e.sets||[]).length){ sets+=e.sets.length; exs.push(ex); }
  });
  return { sets, exercises:exs.length, names:exs,
           prs:(DB.prs||[]).filter(p=>p.date===d).length };
}
function discardSession(dateISO,keepPlan){
  const d=dateISO||today();
  Object.keys(DB.strength||{}).forEach(ex=>{
    DB.strength[ex]=(DB.strength[ex]||[]).filter(e=>e.date!==d);
    if(!DB.strength[ex].length) delete DB.strength[ex];
  });
  DB.prs=(DB.prs||[]).filter(p=>p.date!==d);
  if(d===today()){
    const ci=checkinOn(d);
    if(keepPlan===false){
      DB.sessions[d]=restSession(d);
      DB.sessions[d].deleted=true; DB.sessions[d].title="Cleared";
    } else {
      DB.sessions[d]=buildSession(d, DB.prefs.lastDuration||"full");
      /* the morning check-in was real even if the session wasn't — keep it */
      if(ci && ci.analysed){
        const changes=applyCheckin(DB.sessions[d],ci);
        DB.sessions[d].analysis={...(ci.analysis||{}),
          headline:"Starting again", summary:"Session discarded and rebuilt. "+(changes[0]||""), changes};
      }
    }
  } else {
    delete DB.sessions[d];
  }
  updateStreak(today());
  save();
}

function updateStreak(date){
  let n=0, d=date||today();
  for(let i=0;i<400;i++){
    if(d<startedOn()) break;
    const s=(DB.sessions||{})[d];
    if(isRestDay(d)){ d=addDays(d,-1); continue; }
    if(s && s.state && s.state.finished){ n++; d=addDays(d,-1); }
    else break;
  }
  DB.streak=n;
  return n;
}
/* The day she started. Nothing before it counts as a missed session —
   a fresh install should not open on a week of red crosses. */
function startedOn(){
  if(!DB.startedOn){ DB.startedOn=today(); save(); }
  return DB.startedOn;
}
function countsAsMissed(d){
  return !isRestDay(d) && d<today() && d>=startedOn() &&
    !((DB.sessions||{})[d]||{}).deleted &&
    !(((DB.sessions||{})[d]||{}).state||{}).finished;
}
function weekStart(dateISO){ const d=dateISO||today(); const off=(dowOf(d)+6)%7; return addDays(d,-off); }
function weekStats(anyDateISO){
  const start=weekStart(anyDateISO||today());
  const out={planned:0,done:0,missed:0,days:[],start};
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    const rest=isRestDay(d);
    const s=(DB.sessions||{})[d];
    const done=!!(s&&s.state&&s.state.finished);
    const missed=countsAsMissed(d);
    if(!rest) out.planned++;
    if(done) out.done++;
    if(missed) out.missed++;
    out.days.push({date:d,rest,done,missed,today:d===today(),future:d>today()});
  }
  return out;
}
function monthStats(monthISO){
  const first=(monthISO||today()).slice(0,7)+"-01";
  const d0=parseISO(first), n=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
  let done=0,missed=0,planned=0; const necks=[],energies=[];
  for(let i=0;i<n;i++){
    const d=addDays(first,i);
    if(d>today()) break;
    const rest=isRestDay(d);
    const s=(DB.sessions||{})[d];
    if(!rest && d>=startedOn()) planned++;
    if(s&&s.state&&s.state.finished) done++;
    else if(countsAsMissed(d)) missed++;
    const ci=checkinOn(d);
    if(ci){ if(ci.neck!=null) necks.push(+ci.neck); if(ci.energy!=null) energies.push(+ci.energy); }
  }
  const avg=a=>a.length? Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10 : null;
  return {month:first.slice(0,7),planned,done,missed,neckAvg:avg(necks),energyAvg:avg(energies),
          prs:(DB.prs||[]).filter(p=>p.date.slice(0,7)===first.slice(0,7))};
}

/* =====================================================================
   THE COACH
   Structured output only. The model returns a small validated object;
   the interface renders it. Anything that changes the workout is
   executed by the engine after the arguments have been checked against
   the catalogue. Without an API key the app still works — every screen
   below has a deterministic fallback.
   ===================================================================== */
function aiReady(){ return !!(DB.ai && DB.ai.key); }

/* ---------- the coach's voice ----------
   Two tones, one set of rules. The rules are not negotiable in either. */
const COACH_RULES = `
You never diagnose, never name a condition, and never promise to fix pain. You are not a substitute for a doctor or a physiotherapist. If she reports severe, worsening, persistent or radiating symptoms, numbness, weakness, dizziness, or a new injury, tell her to stop the session and get it assessed properly.

Never remark on her body, her weight, her eating, her motherhood, or her worth. Comment on the training and the effort only.

Nutrition is not part of this app. If she raises food, say it is handled elsewhere and move on.

The app decides the programme, not you. Never claim to have changed something unless you returned the action for it. Never invent an exercise name.

Be brief. Under 45 words unless she explicitly asks you to explain something. No essays, no motivational speeches, no quotations, no gym jargon, no emojis. She should understand the plan in seconds.`;

const COACH_TONES = {
  warm: `You are Lia's personal trainer inside an app called Train.

Manner: warm, confident, concise, encouraging — a good trainer standing beside her, not a cheerleader and not a drill sergeant. Say what today is for and why, in plain words. Praise the work, not the showing up. Dry humour is welcome; flattery is not.

Sound like this: "Today we're building glutes and legs without wearing you out." "You found this easy last time, so I've added two reps." "Your legs worked yesterday, so today is upper body and mobility." "I'm changing the accessory work but keeping your main lift, so we can measure it."`,

  military: `You are Lia's personal trainer inside an app called Train.

Manner: direct, firm, brief, decisive, accountability-first. No warmth for its own sake, no praise for showing up, no exclamation marks. Short declarative sentences.

You hold her to the work, never to her worth. Dry, cutting humour about missed sessions is right. Never use insults such as lazy, weak, pathetic or useless.`
};
function coachSystem(){
  const t=(DB.prefs&&DB.prefs.coachTone)||"warm";
  return (COACH_TONES[t]||COACH_TONES.warm)+"\n"+COACH_RULES;
}
/* Kept so older saved sessions and any stray reference still resolve. */
const COACH_SYSTEM = COACH_TONES.warm+"\n"+COACH_RULES;

function coachContext(){
  const d=today(), ci=checkinOn(d), w=sessionFor(d,false), cyc=cycleInfo(d);
  const wk=weekStats();
  const c=coach();
  /* the last ten workouts, and what she actually did in them */
  const recent=priorSessions(d,10).map(s=>({
    date:uk(s.date), title:s.title, done:sessionWasPerformed(s),
    minutes:s.mins, blockWeek:s.blockWeek||null,
    movements:exercisesIn(s)
  }));
  /* how the last fortnight balanced across the movement categories */
  const bal={};
  priorSessions(d,10).forEach(s=>exercisesIn(s).forEach(ex=>{
    const k=catOf(ex); bal[k]=(bal[k]||0)+1;
  }));
  const stats=c.exStats||{};
  const skipped=Object.keys(stats).filter(n=>(stats[n].skipped||0)>=2)
    .map(n=>({exercise:n, skipped:stats[n].skipped, done:stats[n].done||0}));
  const disliked=Object.keys(stats).filter(n=>(stats[n].disliked||0)>0).map(n=>n);
  const loved=Object.keys(stats).filter(n=>(stats[n].loved||0)>0).map(n=>n);
  const necks=neckTrend(10).filter(x=>x.v!=null).map(x=>x.v);

  /* Today's session with, for each movement, the replacements the engine has
     already approved. The model picks from these; it does not invent. */
  const todayPlan = w && !w.rest ? {
    title:w.title, minutes:w.mins, mode:w.mode, blockWeek:w.blockWeek||1,
    why:w.why||[],
    blocks:(w.blocks||[]).map(b=>({
      label:b.label, rounds:b.rounds,
      items:b.items.map(i=>({
        exercise:i.ex,
        prescription:(i.time? i.time+"s" : i.reps+" reps")+(i.side?" each side":"")+(i.weight?" at "+kgTxt(i.weight):""),
        heldForProgress: i.role==="anchor",
        approvedAlternatives: replacementsFor(w,i.id,3).map(o=>o.name)
      }))
    })),
    adjustments:w.adjustments||[], finished:!!(w.state&&w.state.finished)
  } : null;

  return {
    profile:{name:DB.profile.name,age:DB.profile.age,experience:DB.profile.experience,
             goals:DB.profile.goals,avoid:DB.profile.avoid,equipment:DB.profile.equipment,
             cSection:DB.profile.csection},
    thisWeek:{
      style:programmeStyle().label,
      days:weekAhead(d),
      balanceSoFar:weekBalance(d),
      stillShortOf:weekGaps(d).map(catLabel),
      trainingDaysLeft:daysLeftThisWeek(d)
    },
    programme:{
      blockWeek:blockWeek(d), blockNote:BLOCK_NOTE[blockWeek(d)],
      heldForProgress:Object.keys(c.anchors||{}).map(k=>c.anchors[k].ex),
      categoryBalanceLast10:bal,
      onHoldAfterPain:Object.keys(c.blocked||{}),
      lastFeedback:(c.feedback||[]).slice(-3),
      repeatedlySkipped:skipped, disliked, loved
    },
    today:{date:uk(d), day:DOW_FULL[dowOf(d)], rest:isRestDay(d), workout:todayPlan},
    checkin: ci? {sleep:ci.sleep,energy:ci.energy,soreness:ci.soreness,soreArea:ci.soreArea,
                  stress:ci.stress,neck:ci.neck,pain:ci.pain,time:ci.time,focus:ci.focus,
                  note:ci.note,readiness:readiness(ci)} : null,
    cycle: (DB.prefs.cycleOn && cyc.known)? {phase:PHASE_LABEL[cyc.phase],dayOfCycle:cyc.day,estimate:true} : null,
    week:{planned:wk.planned,completed:wk.done,missed:wk.missed,streak:DB.streak||0},
    neckLast10:necks,
    recentSessions:recent,
    records:(DB.prs||[]).slice(-5)
  };
}

let AI_LAST = null;   /* the outcome of the last call, so Settings can explain itself */
function aiStatus(){
  if(!aiReady()) return {ok:false, code:"nokey", why:"no key on this device"};
  if(!AI_LAST) return {ok:null, why:"not tried yet"};
  return AI_LAST;
}
function aiExplain(st){
  if(!st) return "";
  if(st.ok) return "Live on "+(DB.ai.model||"gpt-4o-mini")+".";
  switch(st.code){
    case "nokey":   return "No key saved on this device. The programme still runs; only the words go quiet.";
    case 401:       return "The key was rejected (401). Check it was copied whole, and that it belongs to this account.";
    case 429:       return "Rate-limited or out of credit (429). Add credit at platform.openai.com \u2192 Billing.";
    case 404:       return "That model isn't available to this account (404). Try gpt-4o-mini.";
    case "network": return "Couldn't reach OpenAI. Check the connection and try again.";
    case "timeout": return "OpenAI took too long to answer. Try again.";
    default:        return st.why || "Something went wrong.";
  }
}
async function aiJSON(system,user,schema,name,maxTokens){
  if(!aiReady()){ AI_LAST={ok:false,code:"nokey",why:"no key on this device"}; return null; }
  let ctl=null,timer=null;
  try{
    ctl=new AbortController(); timer=setTimeout(()=>{try{ctl.abort();}catch(e){}},45000);
    const body={ model: DB.ai.model||"gpt-4o-mini",
      messages:[{role:"system",content:system},{role:"user",content:typeof user==="string"?user:JSON.stringify(user)}],
      response_format:{type:"json_schema",json_schema:{name:name||"reply",strict:true,schema}} };
    if(/^gpt-5|^o\d/i.test(body.model)){ body.max_completion_tokens=(maxTokens||400)+1200; }
    else { body.max_tokens=maxTokens||400; body.temperature=0.85; }
    const res=await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DB.ai.key},
      body:JSON.stringify(body)});
    if(!res.ok){
      let m=""; try{ m=((await res.json()).error||{}).message||""; }catch(e){}
      console.warn("AI",res.status,m);
      AI_LAST={ok:false, code:res.status, why:m||("HTTP "+res.status)};
      toast(res.status===401?"API key rejected — check Settings":"Coach unavailable ("+res.status+")");
      return null;
    }
    const j=await res.json();
    const txt=(((j.choices||[])[0]||{}).message||{}).content||"";
    AI_LAST={ok:true, code:200, why:"ok", at:Date.now()};
    return JSON.parse(txt);
  }catch(e){
    if(e&&e.name==="AbortError"){ AI_LAST={ok:false,code:"timeout",why:"timed out"}; toast("Coach timed out"); }
    else { AI_LAST={ok:false,code:"network",why:String(e&&e.message||e)}; console.warn("AI",e); }
    return null;
  } finally { if(timer) clearTimeout(timer); }
}

/* ---------- schemas ---------- */

  }};
const S_MESSAGE={type:"object",additionalProperties:false,required:["message"],
  properties:{message:{type:"string"}}};
const S_CHAT={type:"object",additionalProperties:false,required:["message","action"],
  properties:{
    message:{type:"string"},
    action:{type:"object",additionalProperties:false,required:["kind","exercise","replacement","value"],
      properties:{
        kind:{type:"string",enum:["none","set_duration","rest_today","rebuild","replace","add","remove","set_rounds","ban","hold","rotate"]},
        exercise:{type:"string",description:"Exact catalogue name, a block letter for set_rounds, or an empty string."},
        replacement:{type:"string",description:"Exact catalogue name, or an empty string."},
        value:{type:"number",description:"Minutes for set_duration, rounds for set_rounds, otherwise 0."}
      }}
  }};
const S_REVIEW={type:"object",additionalProperties:false,required:["headline","summary","focus"],
  properties:{headline:{type:"string"},summary:{type:"string"},
    focus:{type:"array",items:{type:"string"},description:"Two or three short focus points for next month."}}};

const FALLBACK_OPENERS=["Read and applied.","Logged.","Check-in processed.","Noted.","Understood."];
function fallbackAnalysis(ci,w,changes){
  const r=readiness(ci);
  const seed=(parseISO(w.date).getDate()+ (ci.energy||0))%FALLBACK_OPENERS.length;
  let head = r>=78?"Green light":r>=58?"Steady day":r>=38?"Manage it":"Recovery bias";
  if((+ci.neck||0)>=6) head="Neck first";
  if(ci.time==="short") head="Short session";
  const bits=[];
  if(changes.length) bits.push(changes.join(" "));
  else if((w.why||[]).length) bits.push(w.why[0]);
  else bits.push("Nothing needed changing — today stands as the programme wrote it.");
  bits.push(w.mins+" minutes.");
  return {headline:head, summary:FALLBACK_OPENERS[seed]+" "+bits.join(" ")};
}
async function analyseDay(ci,w,changes){
  const ai=await aiJSON(coachSystem(),
    {task:"Summarise this morning check-in and the changes already made to today's workout. Do not propose further changes. State what changed and why in one or two sentences.",
     checkin:{sleep:ci.sleep,energy:ci.energy,soreness:ci.soreness,stress:ci.stress,neck:ci.neck,pain:ci.pain,
              cycle:ci.cycleStatus,pelvic:ci.pelvic,note:ci.note,time:ci.time,readiness:readiness(ci)},
     workout:{title:w.title,minutes:w.mins,mode:w.mode,
              blocks:(w.blocks||[]).map(b=>b.label+": "+b.rounds+" rounds — "+b.items.map(i=>i.ex).join(", "))},
     changesAlreadyApplied:changes},
    S_ANALYSIS,"daily_analysis",260);
  return ai || fallbackAnalysis(ci,w,changes);
}

/* ---------- chat ---------- */
/* ---------- what the coach is allowed to change ----------
   The model proposes; this decides. Every structural change is put through
   the same validation the engine uses on its own sessions, and anything that
   fails is refused with the reason, not quietly applied. */
function liveContext(){ return buildContext(today(), checkinOn(today())); }
function issuesForExercise(w,ctx,ex){
  return validateSession(w,ctx).filter(i=>{
    if(!i.itemId) return false;
    const it=(w.blocks||[]).flatMap(b=>b.items).find(x=>x.id===i.itemId);
    return it && it.ex===ex;
  });
}
function whyRefused(ctx,ex){
  const e=EX(ex);
  if(!e) return ex+" isn't in the catalogue";
  if(ctx.blocked[ex]) return ex+" is on hold after a pain report";
  if((ctx.prefs[ex]||{}).avoid) return ex+" is on your avoid list";
  if(!ctx.equip.has(e.eq||"bw")) return "you haven't got the "+(EQUIP_LABEL[e.eq]||e.eq)+" today";
  if(ctx.neck>=5 && ((e.tags||[]).includes("overhead")||(e.tags||[]).includes("neck-sensitive")))
    return ex+" loads the neck, and the neck is loud today";
  if(ctx.recent2.has(ex)) return "you did "+ex+" in one of the last two sessions";
  return ex+" doesn't fit today's session";
}
function runCoachAction(a){
  if(!a||a.kind==="none") return null;
  const d=today();
  let w=sessionFor(d,true);
  const live=!!(w&&w.state&&(w.state.finished||(w.state.clock&&w.state.clock.startedAt)));
  const name=n=>{ const s=String(n||"").trim(); return allNames().find(x=>x.toLowerCase()===s.toLowerCase())||null; };

  if(a.kind==="rest_today"){
    if(live) return null;
    DB.sessions[d]=restSession(d); save(); return "Today is a rest day.";
  }
  if(a.kind==="rebuild"){
    coach().nonce=(coach().nonce||0)+1;
    regenerate(d,w.duration||"full");
    const nw=DB.sessions[d];
    return "Rebuilt — "+nw.title+", about "+nw.mins+" minutes.";
  }
  if(a.kind==="set_duration"){
    const mins=clamp(Math.round(a.value||0),10,120);
    if(!mins) return null;
    const nw=setDuration(d,nearestPreset(mins)==="custom"?(DB.prefs.customMins=mins,"custom"):nearestPreset(mins));
    return "Set to about "+nw.mins+" minutes.";
  }
  if(a.kind==="ban"){
    const ex=name(a.exercise); if(!ex) return null;
    DB.exPrefs[ex]={...(DB.exPrefs[ex]||{}),avoid:true}; save();
    const hit=(w.blocks||[]).flatMap(b=>b.items).find(i=>i.ex===ex);
    if(hit){ const alt=replacementsFor(w,hit.id,1); if(alt.length) swapItem(w,hit.id,alt[0].name,"banned"); }
    save(); return ex+" is out of the programme.";
  }
  if(a.kind==="hold"){
    const ex=name(a.exercise); if(!ex) return null;
    blockExercise(ex,"you told the coach it hurt");
    const hit=(w.blocks||[]).flatMap(b=>b.items).find(i=>i.ex===ex);
    if(hit){ const alt=replacementsFor(w,hit.id,1); if(alt.length) swapItem(w,hit.id,alt[0].name,"pain"); }
    save();
    return ex+" is on hold until you put it back. If it keeps hurting, get it looked at properly.";
  }
  if(a.kind==="remove"){
    const ex=name(a.exercise); if(!ex) return null;
    for(const b of (w.blocks||[])){
      const i=b.items.findIndex(x=>x.ex===ex);
      if(i>=0 && b.items.length>1){ b.items.splice(i,1); w.edited=true; w.mins=estimateMinutes(w); save(); return ex+" removed."; }
    }
    return null;
  }
  if(a.kind==="add"){
    const ex=name(a.replacement)||name(a.exercise); if(!ex) return null;
    const ctx=liveContext();
    const e=EX(ex);
    if(!e || ctx.blocked[ex] || (ctx.prefs[ex]||{}).avoid || !ctx.equip.has(e.eq||"bw")
       || (w.blocks||[]).some(b=>b.items.some(i=>i.ex===ex)))
      return "I can't add that — "+whyRefused(ctx,ex)+".";
    const b=(w.blocks||[])[w.blocks.length-1]; if(!b) return null;
    const it=newItem({ex,reps:10});
    it.role="accessory"; it.cat=catOf(ex);
    b.items.push(it); w.edited=true; w.mins=estimateMinutes(w); save();
    return ex+" added to block "+b.label+" — about "+w.mins+" minutes now.";
  }
  if(a.kind==="set_rounds"){
    const v=clamp(Math.round(a.value||0),1,6); if(!v) return null;
    const letter=String(a.exercise||"").trim().toUpperCase();
    const hits=(w.blocks||[]).filter(b=>!letter||b.label===letter);
    if(!hits.length) return null;
    hits.forEach(b=>b.rounds=v);
    w.edited=true; w.mins=estimateMinutes(w); save();
    return (letter?"Block "+letter:"Every block")+" set to "+plural(v,"round")+" — about "+w.mins+" minutes.";
  }
  if(a.kind==="replace"){
    const oldEx=name(a.exercise), newEx=name(a.replacement);
    if(!oldEx||!newEx) return null;
    const f=(w.blocks||[]).flatMap(b=>b.items).find(i=>i.ex===oldEx);
    if(!f) return null;
    const ctx=liveContext();
    if(!swapItem(w,f.id,newEx,"coach")) return null;
    /* the engine gets the last word on whether that was allowed */
    const bad=issuesForExercise(w,ctx,newEx);
    if(bad.length){
      swapItem(w,f.id,oldEx,"coach");     /* put it back */
      save();
      return "I'd rather not — "+whyRefused(ctx,newEx)+". "+oldEx+" stays.";
    }
    save();
    return oldEx+" → "+newEx+".";
  }
  /* "give me something else for this one" — the engine chooses, not the model */
  if(a.kind==="rotate"){
    const oldEx=name(a.exercise); if(!oldEx) return null;
    const f=(w.blocks||[]).flatMap(b=>b.items).find(i=>i.ex===oldEx);
    if(!f) return null;
    const alt=replacementsFor(w,f.id,1);
    if(!alt.length) return "There's nothing better than "+oldEx+" for that slot today.";
    swapItem(w,f.id,alt[0].name,"coach");
    save();
    return oldEx+" → "+alt[0].name+" ("+alt[0].why+").";
  }
  return null;
}
async function coachReply(text){
  const ctx=coachContext();
  const hist=(DB.chat||[]).slice(-8).map(m=>({role:m.who==="me"?"user":"assistant",text:m.text}));
  const ai=await aiJSON(coachSystem()+`

THE APP OWNS THE PROGRAMME. It has already chosen today's movements from her
history, her four-week block, what she did in the last two sessions, the kit
she has today and anything on hold after pain. You may adjust it by returning
one action, and the app will refuse anything that breaks those rules.

THINK IN WEEKS, NOT DAYS. thisWeek tells you what she has already trained,
what is still to come and what the week is short of. Answer "what should I do
today" in the context of the whole week: if she has pulled twice and not
pressed, say so; if she is asking to move a session, say what it does to the
rest of the week; if two days are left and the week is short of legs, that is
the answer.

When she wants a different movement, prefer "rotate" — the app picks the best
approved alternative for that slot. Only use "replace" when she names the
movement she wants, and then choose from that item's approvedAlternatives in
the context if you can.

kind "set_duration" with value in minutes — for "I've only got 30 minutes".
kind "rest_today" — she is not training today.
kind "rebuild" — build today again from the programme, differently.
kind "rotate" with exercise — swap that movement for the best alternative.
kind "replace" with exercise and replacement — both exact catalogue names.
kind "add" with replacement — an exact catalogue name.
kind "remove" with exercise — an exact catalogue name in today's session.
kind "set_rounds" with exercise as a block letter (A, B, C, or empty for all) and value as the number of rounds.
kind "hold" with exercise — it hurt, take it out until she says otherwise.
kind "ban" with exercise — she never wants to see it again.
kind "none" — everything else. Say what you would do rather than pretending.

Exact catalogue names: `+allNames().join(", ")+`

Never claim to have changed something unless you returned the action for it,
and never state a change as done — the app appends what actually happened.`,
    {question:text, recentMessages:hist, context:ctx},
    S_CHAT,"coach_reply",420);
  if(!ai){
    return {message: fallbackChat(text), action:null, applied:null};
  }
  const applied=runCoachAction(ai.action);
  return {message:ai.message, action:ai.action, applied};
}
/* Without an API key the coach still answers, from the same engine the
   session came from. Fewer words, same facts. */
function fallbackChat(text){
  const t=String(text||"").toLowerCase();
  const warm=(DB.prefs&&DB.prefs.coachTone)!=="military";
  const d=today(), ci=checkinOn(d), w=sessionFor(d,false);
  const live=!!(w&&w.state&&(w.state.clock&&w.state.clock.startedAt||w.state.finished));
  if(/tomorrow|next week|monday|tuesday|wednesday|thursday|friday|later/.test(t))
    return warm? "I build one day at a time. Ask me in the morning and I'll have it ready."
               : "I only run today. Tell me again in the morning and I'll build it then.";
  const mm=t.match(/(\d{2})\s*(?:min|minutes)/);
  if(mm){
    if(live) return warm? "You're already under way — change the length from the session menu."
                        : "Already under way. Change it from the session menu if you must.";
    return runCoachAction({kind:"set_duration",exercise:"",replacement:"",value:+mm[1]})
      || "Give me a number between 10 and 120.";
  }
  if(/short|quick|no time/.test(t)){
    if(live) return warm? "Already started. Finish what's there or end it properly."
                        : "Today's session is already under way. Not rewriting it mid-set.";
    setDuration(d,"quick");
    return (warm?"Quick session set — ":"Quick session set. ")+(DB.sessions[d]||{}).mins+" minutes.";
  }
  if(/rest|skip|can'?t train|day off/.test(t)){
    if(live) return warm? "You've already started. Finish it or end it properly — don't leave it hanging."
                        : "You already started. Finish what's on the screen or end it properly.";
    DB.sessions[d]=restSession(d); save();
    return warm? "Marked as rest. See you tomorrow." : "Marked as rest. Tomorrow is not negotiable.";
  }
  /* "why this workout" and "something else" are answered from the engine */
  if(/why|reason|explain/.test(t) && w && (w.why||[]).length) return w.why.join(" ");
  if(/different|something else|bored|change it|same/.test(t)){
    if(live) return "Tap Swap on the movement and I'll offer you three.";
    const r=runCoachAction({kind:"rebuild",exercise:"",replacement:"",value:0});
    return r||"Nothing to rebuild today.";
  }
  if(/hurt|pain|sore/.test(t))
    return "Tell me which movement at the end of the session, or use Report pain in the session menu, and it comes out of the programme. If it's sharp or getting worse, stop and get it looked at.";
  if(/what.*today|plan|session/.test(t) && w && !w.rest)
    return w.title+" — "+w.mins+" minutes, "+plural((w.blocks||[]).length,"block")+". "+((w.why||[])[0]||"");
  if(/week|rest of/.test(t)){
    const wk=weekStats(); const gaps=weekGaps(d);
    return wk.done+" of "+wk.planned+" done this week"+
      (gaps.length? ". Still short of "+gaps.map(catLabel).join(" and ").toLowerCase()+"." : ". Balance looks right.");
  }
  if(/neck/.test(t)) return "Put a number on it in the check-in. That's what changes the session.";
  if(/food|eat|calorie|protein|diet/.test(t)) return "Not this app. Training only.";
  if(!ci) return pickLine("nocheckin");
  return warm? "No API key yet, so I'm on rails. Add one in Settings and I'll answer properly."
             : "No API key, so I'm running on rails. Add one in Settings and I'll answer properly.";
}

/* ---------- monthly review ---------- */
async function buildReview(monthISO){
  const st=monthStats(monthISO);
  const strength=strengthDeltas(st.month);
  const meas=measureDeltas(st.month);
  const ai=await aiJSON(coachSystem(),
    {task:"Write a short monthly review. Headline of three or four words. Summary of two sentences maximum. Two or three focus points for next month, each under eight words.",
     stats:st,strengthChanges:strength,measurementChanges:meas},
    S_REVIEW,"monthly_review",420);
  const fallback={
    headline: st.done>=st.planned*0.8? "Week after week" : st.done>=st.planned*0.5? "Half the work" : "Below the line",
    summary: st.done+" of "+st.planned+" sessions completed"+(st.missed?", "+st.missed+" missed":"")+"."+
      (strength.length? " Strongest movement: "+strength[0].ex+" up "+strength[0].delta+"." : ""),
    focus: [ st.missed>2? "Protect the five weekdays" : "Hold the consistency",
             "Add load where reps hit twelve",
             st.neckAvg!=null&&st.neckAvg>=4? "Keep the neck prep every session" : "Progress the pelvic work" ]
  };
  const out=ai||fallback;
  const rec={id:uid(),month:st.month,created:Date.now(),stats:st,strength,measures:meas,...out};
  DB.reviews=(DB.reviews||[]).filter(r=>r.month!==st.month);
  DB.reviews.push(rec); save();
  return rec;
}
function strengthDeltas(monthPrefix){
  const out=[];
  Object.keys(DB.strength||{}).forEach(ex=>{
    const inM=history(ex).filter(e=>e.date.slice(0,7)===monthPrefix);
    const before=history(ex).filter(e=>e.date.slice(0,7)<monthPrefix);
    if(!inM.length||!before.length) return;
    const a=Math.max(...before.map(e=>(topSet(e)||{}).w||0));
    const b=Math.max(...inM.map(e=>(topSet(e)||{}).w||0));
    if(a>0&&b>a) out.push({ex,from:a,to:b,delta:"+"+kgTxt(b-a)});
  });
  return out.sort((x,y)=>parseFloat(y.delta)-parseFloat(x.delta)).slice(0,5);
}
function measureDeltas(monthPrefix){
  const ms=(DB.measures||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(ms.length<2) return [];
  const last=ms[ms.length-1], first=ms.find(m=>m.date.slice(0,7)>=monthPrefix)||ms[0];
  const keys=["waist","hips","thigh","glutes","chest","arm"];
  return keys.filter(k=>last[k]!=null&&first[k]!=null&&last[k]!==first[k])
    .map(k=>({what:k,from:first[k],to:last[k],delta:(last[k]-first[k]>0?"+":"")+(Math.round((last[k]-first[k])*10)/10)+" cm"}));
}

/* =====================================================================
   CLOUD MIRROR
   Same Firebase project as Amir's app, different collection and a
   different document. Neither app can read the other's training.
   If the project's rules don't yet carry a liapt block, the first write
   fails with permission-denied and we fall back to a document inside the
   existing collection — same isolation, no console visit required.
   ===================================================================== */
let _fb=null, _fbReady=false, _fbErr=null, _pushing=false;
function cloudDocPath(){ return (DB.cloud.collection||FB_COLLECTION)+"/"+(DB.cloud.syncId||FB_SYNC_DEFAULT); }
function cloudDoc(){ return _fb.firestore().doc(cloudDocPath()); }

async function cloudInit(){
  if(_fbReady) return true;
  if(typeof firebase==="undefined"){ _fbErr="Firebase SDK didn't load"; return false; }
  try{
    _fb=firebase;
    if(!_fb.apps.length) _fb.initializeApp(FB_CONFIG);
    await _fb.auth().signInAnonymously();
    _fbReady=true; _fbErr=null;
    return true;
  }catch(e){ _fbErr=(e&&e.message)||"sign-in failed"; console.warn("cloud",e); return false; }
}
function cloudPayload(){
  const d=JSON.parse(JSON.stringify(DB));
  if(!DB.cloud.syncKeys) d.ai={...d.ai,key:""};
  let s=JSON.stringify(d);
  if(s.length>780000){
    /* Progress photographs are the only thing big enough to burst a document.
       They stay on the device and the rest still mirrors. */
    d.photos=(d.photos||[]).map(p=>({...p,data:null,localOnly:true}));
    d._photosLocal=true;
  }
  return d;
}
async function cloudPush(quiet){
  if(!DB.cloud.on || _pushing) return false;
  _pushing=true;
  try{
    if(!await cloudInit()){ if(!quiet) toast("Cloud: "+(_fbErr||"unavailable")); return false; }
    const payload={ updated:Date.now(), v:VERSION, data:cloudPayload() };
    try{
      await cloudDoc().set(payload);
    }catch(e){
      if(String(e&&e.code)==="permission-denied" && DB.cloud.collection!==FB_COLLECTION_FALLBACK){
        DB.cloud.collection=FB_COLLECTION_FALLBACK;
        DB.cloud.syncId=(DB.cloud.syncId||FB_SYNC_DEFAULT).startsWith("lia-")?DB.cloud.syncId:"lia-"+DB.cloud.syncId;
        await cloudDoc().set(payload);
      } else throw e;
    }
    DB.cloud.last=Date.now();
    try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }catch(e){}
    if(!quiet) toast("Backed up");
    return true;
  }catch(e){
    console.warn("push",e);
    if(!quiet) toast("Backup failed: "+((e&&e.message)||"unknown").slice(0,60));
    return false;
  } finally { _pushing=false; }
}
async function cloudPull(quiet){
  if(!DB.cloud.on) return false;
  try{
    if(!await cloudInit()){ if(!quiet) toast("Cloud: "+(_fbErr||"unavailable")); return false; }
    let snap;
    try{ snap=await cloudDoc().get(); }
    catch(e){
      if(String(e&&e.code)==="permission-denied" && DB.cloud.collection!==FB_COLLECTION_FALLBACK){
        DB.cloud.collection=FB_COLLECTION_FALLBACK; snap=await cloudDoc().get();
      } else throw e;
    }
    if(!snap.exists){ if(!quiet) toast("Nothing in the cloud yet"); return false; }
    const v=snap.data();
    if(!v||!v.data){ if(!quiet) toast("Backup looks empty"); return false; }
    const keepKey=DB.ai.key, keepCloud={...DB.cloud};
    const keepPhotos=(DB.photos||[]).filter(p=>p.data);
    const merged=mergeDefaults(v.data);
    merged.cloud={...keepCloud};
    if(!merged.ai.key) merged.ai.key=keepKey;
    if(v.data._photosLocal||merged.photos.some(p=>p.localOnly)){
      const byId={}; keepPhotos.forEach(p=>byId[p.id]=p);
      merged.photos=merged.photos.map(p=>byId[p.id]||p).filter(p=>p.data);
    }
    Object.keys(DB).forEach(k=>{ delete DB[k]; });
    Object.assign(DB,merged);
    save();
    if(!quiet) toast("Restored from cloud");
    refresh();
    return true;
  }catch(e){ console.warn("pull",e); if(!quiet) toast("Restore failed"); return false; }
}
async function cloudStatus(){
  const ok=await cloudInit();
  if(!ok) return {ok:false,msg:_fbErr||"not connected"};
  try{
    const snap=await cloudDoc().get();
    if(!snap.exists) return {ok:true,msg:"Connected. No backup written yet."};
    const v=snap.data();
    const size=JSON.stringify(v).length;
    return {ok:true,msg:"Connected to "+cloudDocPath()+". Last backup "+uk(iso(new Date(v.updated)))+
      " at "+new Date(v.updated).toTimeString().slice(0,5)+" · "+Math.round(size/1024)+" KB."};
  }catch(e){
    return {ok:false,msg:String(e&&e.code)==="permission-denied"
      ? "Permission denied. Paste the updated Firestore rules (see the setup notes) or leave sync off."
      : ((e&&e.message)||"failed")};
  }
}

/* ---------- backup file ---------- */
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="train-backup-"+uk(today()).replace(/\//g,"-")+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const parsed=JSON.parse(r.result);
    if(!parsed||typeof parsed!=="object") throw new Error("not a backup");
    const merged=mergeDefaults(parsed);
    Object.keys(DB).forEach(k=>{ delete DB[k]; });
    Object.assign(DB,merged); save(); refresh(); toast("Backup restored");
  }catch(e){ toast("That file isn't a Train backup"); } };
  r.readAsText(f);
  input.value="";
}

function redFlag(c){

  const words=/numb|tingl|pins and needles|shooting|radiat|down my arm|weak(ness)?|dizzy|dizziness|faint|black ?out|fever|can'?t move|can'?t turn/;
  if((+c.neck||0)>=9) return "Neck at "+c.neck+" out of ten.";
  if((+c.pain||0)>=9) return "Pain at "+c.pain+" out of ten.";
  if(words.test(t)) return "What you've described in the note.";
  return null;
}

let _analysing=false;
async function runAnalysis(){
  if(_analysing) return;
  const c=ciDraft();
  const btn=el("analyseBtn");
  if(btn){ btn.classList.add("loading"); btn.innerHTML='<span class="spin"></span><span class="lbl">Reading it</span>'; }
  _analysing=true;
  try{
    c.analysed=true; c.at=Date.now();
    if(c.cycleStatus==="started") startPeriod(c.date,true);
    if(c.cycleStatus==="ended") endPeriod(c.date,true);
    DB.checkins[c.date]=JSON.parse(JSON.stringify(c));
    let w=sessionFor(c.date,true);
    if(!w.rest){
      if(!(w.state && w.state.clock && w.state.clock.startedAt)){
        DB.prefs.lastDuration=c.duration||DB.prefs.lastDuration||"full";
        w=regenerate(c.date, c.duration||DB.prefs.lastDuration);
      }
    }
    let changes=[];
    if(!w.rest){ changes=applyCheckin(w,c); }
    const flag=redFlag(c);
    const a= w.rest
      ? {headline:"Rest day", summary:"Logged. No session today — that is the programme, not a gap."}
      : await analyseDay(c,w,changes);
    w.analysis={...a, changes, flag, at:Date.now()};
    DB.sessions[c.date]=w;
    pushCoach(a.summary + (flag? " Stop and get that looked at properly before the next session." : ""));
    save();
  }catch(e){ console.error(e); toast("Couldn't finish the analysis — the check-in is saved"); }
  _analysing=false;
  renderHome();
}

let CAL_MONTH=null, CAL_SEL=null;
function calMonth(){ return CAL_MONTH || today().slice(0,7); }
function calShift(n){
  const [y,m]=calMonth().split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  CAL_MONTH=iso(d).slice(0,7); renderHome();
}
function periodDays(){
  const set=new Set();
  (DB.cycle.periods||[]).forEach(p=>{
    const end=periodEnd(p);
    let d=p.start, guard=0;
    while(d<=end && guard++<15){ set.add(d); d=addDays(d,1); }
  });
  return set;
}

    const date=mk+"-"+String(day).padStart(2,"0");
    const rest=isRestDay(date);
    const s=(DB.sessions||{})[date];
    const done=!!(s&&s.state&&s.state.finished);
    const missed=countsAsMissed(date);

    if(date===today()) cls.push("today");

    if(CAL_SEL===date) cls.push("sel");
    let dot="";
    if(!rest && date>=startedOn()){
      if(done) dot='<i class="cal-dot done"></i>';
      else if(missed) dot='<i class="cal-dot miss"></i>';
      else dot='<i class="cal-dot plan"></i>';
    }
    cells+='<button class="'+cls.join(" ")+'" onclick="openDay(\''+date+'\')" aria-label="'+uk(date)+'">'+
      (per.has(date)?'<span class="cal-period"></span>':'')+
      (prDates.has(date)?'<span class="cal-pr">PR</span>':'')+
      '<span class="num">'+day+'</span>'+dot+'</button>';
  }
  const label=MONTHS[parseISO(first).getMonth()]+" "+parseISO(first).getFullYear();
  return '<details class="card cal-wrap"'+(window.innerWidth>=900?' open':'')+'><summary>'+
