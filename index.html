<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Train" />
<meta name="theme-color" content="#F4F6FA" />
<meta name="description" content="Train — a private personal-training app." />
<title>Train</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
<style>
:root{
  --bg:#F4F6FA; --bg-2:#E9EDF5; --surface:#FFFFFF; --surface-2:#F7F8FA;
  --ink:#14161C; --ink-2:#525A6A; --ink-3:#8A92A2; --ink-4:#AEB5C2;
  --line:#E4E9F2; --line-2:#F0F3F8;
  --blue:#1B62F5; --blue-ink:#1348C9; --blue-soft:#E8F0FF; --blue-line:#C2D6FF;
  --wave-1:#EAF1FF; --wave-2:#DCE8FF;
  --good:#12915C; --good-soft:#E6F5EE;
  --warn:#B4630E; --warn-soft:#FDF1E3;
  --bad:#C03A2F; --bad-soft:#FCEDEB;
  --rose:#A8477A; --rose-soft:#FBEDF4;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:14px; --r:18px; --r-lg:22px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(20,26,45,.05);
  --sh-2:0 1px 2px rgba(20,26,45,.04), 0 10px 26px -14px rgba(20,26,45,.22);
  --sh-3:0 2px 6px rgba(20,26,45,.06), 0 24px 48px -22px rgba(20,26,45,.30);
  --ease:cubic-bezier(.23,1,.32,1);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px); --safe-right:env(safe-area-inset-right,0px);
  --font:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:16px;line-height:1.55;overscroll-behavior-y:none;}
body{max-width:1120px;margin:0 auto;min-height:100dvh;position:relative;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{border:none;background:none;cursor:pointer;padding:0;}
a{color:var(--blue);text-underline-offset:2px;}
::-webkit-scrollbar{width:0;height:0;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- layout ---------- */
#app{padding:calc(var(--safe-top) + 14px) 18px calc(112px + var(--safe-bot));}
@media(min-width:900px){ #app{padding-left:40px;padding-right:40px;padding-bottom:64px;} }
.screen{display:none;}
.screen.active{display:block;animation:enter .28s var(--ease);}
@keyframes enter{from{opacity:0;transform:translateY(6px) scale(.995);}to{opacity:1;transform:none;}}
.stack{display:flex;flex-direction:column;gap:var(--s4);}
.stack-lg{display:flex;flex-direction:column;gap:var(--s5);}
.row{display:flex;align-items:center;gap:var(--s3);}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.grow{flex:1 1 auto;min-width:0;}

/* ---------- type ---------- */
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance;}
h1{font-size:clamp(26px,7vw,34px);line-height:1.1;letter-spacing:-.03em;}
h2{font-size:clamp(20px,4.4vw,24px);line-height:1.15;}
h3{font-size:17px;line-height:1.25;}
p{margin:0;text-wrap:pretty;}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.muted{color:var(--ink-2);}
.dim{color:var(--ink-3);}
.small{font-size:13.5px;}
.tiny{font-size:12px;}
.big-num{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px var(--s5);}
.topbar .date{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px;}
.mark{width:40px;height:40px;border-radius:12px;overflow:hidden;box-shadow:var(--sh-1);display:block;}
.mark img{width:100%;height:100%;object-fit:cover;display:block;}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5) var(--s4);box-shadow:var(--sh-2);}
.card.pad-lg{padding:var(--s5);}
.card.tight{padding:var(--s4);}
.card.flat{box-shadow:none;border:1px solid var(--line);}
/* a whole card that is a button */
.card.tap{display:block;width:100%;text-align:left;transition:transform .16s var(--ease);}
.card.tap:active{transform:scale(.99);}
.card.tap .k{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.card.tap > .spread > svg{width:20px;height:20px;flex:0 0 20px;color:var(--ink-4);}
.hair{height:1px;background:var(--line-2);margin:var(--s4) 0;}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;
  min-height:54px;padding:0 var(--s5);border-radius:var(--r);font-size:16px;font-weight:600;
  background:var(--blue);color:#fff;transition:transform .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
  box-shadow:0 1px 2px rgba(27,59,209,.28), 0 10px 22px -12px rgba(27,59,209,.55);letter-spacing:-.01em;}
.btn:active{transform:scale(.975);}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);border:1px solid var(--line);}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;border:1px solid var(--line);}
.btn.quiet{background:var(--bg-2);color:var(--ink);box-shadow:none;}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 10px;border-radius:var(--r-sm);}
.btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-row .btn{min-width:0;}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none;}
.btn.sec.on{background:var(--blue);color:#fff;border-color:var(--blue);
  box-shadow:0 5px 12px -7px rgba(19,72,201,.9);}
/* the verdict on the whole session */
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:12px;}
.thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:96px;padding:12px 10px;border-radius:var(--r);background:var(--surface-2);
  border:1.5px solid transparent;color:var(--ink-2);
  transition:transform .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease);}
.thumb:active{transform:scale(.97);}
.thumb svg{width:24px;height:24px;margin-bottom:2px;}
.thumb .t{font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink);}
.thumb .s{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.3;}
.thumb.on.up{background:var(--good-soft);border-color:var(--good);}
.thumb.on.up svg,.thumb.on.up .t{color:var(--good);}
.thumb.on.up .s{color:var(--good);opacity:.8;}
.thumb.on.down{background:var(--bad-soft);border-color:var(--bad);}
.thumb.on.down svg,.thumb.on.down .t{color:var(--bad);}
.thumb.on.down .s{color:var(--bad);opacity:.8;}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn svg{width:19px;height:19px;flex:0 0 auto;}
.btn.loading{pointer-events:none;}
/* a countdown you can read without leaning in */
.btn.running{background:var(--ink);color:#fff;border-color:transparent;
  box-shadow:0 1px 2px rgba(20,26,45,.2),0 10px 22px -12px rgba(20,26,45,.5);}
.btn.running svg{color:#fff;}
.btn.running .lbl{font-size:30px;font-weight:600;letter-spacing:-.03em;}
.btn.running small{font-size:12px;font-weight:600;opacity:.65;margin-left:8px;text-transform:uppercase;letter-spacing:.06em;}
.btn.loading .lbl{opacity:.55;}
.btn-row{display:flex;gap:var(--s3);}
.btn-row .btn{flex:1;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  background:var(--bg-2);color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap;}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink);}
.chip.good{background:var(--good-soft);color:var(--good);}
.chip.warn{background:var(--warn-soft);color:var(--warn);}
.chip.bad{background:var(--bad-soft);color:var(--bad);}
.chip.rose{background:var(--rose-soft);color:var(--rose);}
button.chip{min-height:36px;padding-top:0;padding-bottom:0;}
.linkbtn{font-size:14px;font-weight:600;color:var(--blue);padding:8px 2px;
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}

/* ---------- segmented / sliders ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg-2);
  padding:5px;border-radius:var(--r);}
.seg button{min-height:46px;border-radius:11px;font-size:14.5px;font-weight:600;color:var(--ink-2);
  transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);}
.seg.blue button.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px -8px rgba(27,59,209,.8);}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.scale button{min-height:50px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:15px;
  color:var(--ink-2);transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease);}
.scale button.on{background:var(--blue);color:#fff;}
.scale button:active{transform:scale(.94);}
.ci-item{padding:var(--s4) 0;border-bottom:1px solid var(--line-2);}
.ci-item:last-of-type{border-bottom:none;}
.ci-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s3);gap:var(--s3);}
.ci-head .q{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.ci-head .v{font-size:13px;font-weight:600;color:var(--blue-ink);}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;}
.slider::-webkit-slider-runnable-track{height:10px;border-radius:999px;
  background:linear-gradient(90deg,var(--blue) var(--pct,50%),var(--bg-2) var(--pct,50%));}
.slider::-moz-range-track{height:10px;border-radius:999px;background:var(--bg-2);}
.slider::-moz-range-progress{height:10px;border-radius:999px;background:var(--blue);}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(20,26,45,.2),0 6px 14px -6px rgba(20,26,45,.4);margin-top:-10px;border:1px solid var(--line);}
.slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(20,26,45,.2);}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-4);font-weight:500;margin-top:-4px;}
.txtin{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px var(--s4);font-size:15.5px;transition:border-color .16s var(--ease),background .16s var(--ease);}
.txtin:focus{outline:none;border-color:var(--blue-line);background:var(--surface);}
textarea.txtin{min-height:88px;resize:vertical;line-height:1.5;}
.field{display:block;margin-bottom:var(--s4);}
.field > label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.45;}
.switch{width:50px;height:30px;border-radius:999px;background:var(--bg-2);position:relative;flex:0 0 auto;
  transition:background .2s var(--ease);cursor:pointer;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:transform .2s var(--ease);}
.switch.on{background:var(--blue);}
.switch.on::after{transform:translateX(20px);}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);}
.cal-nav button:active{transform:scale(.94);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-dow span{text-align:center;font-size:11px;font-weight:600;color:var(--ink-4);letter-spacing:.04em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1/1;min-width:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2);
  position:relative;transition:background .16s var(--ease),transform .16s var(--ease);min-height:40px;}
.cal-cell:active{transform:scale(.92);}
.cal-cell.out{color:var(--ink-4);opacity:.5;}
.cal-cell.rest{color:var(--ink-4);}
.cal-cell.today{background:var(--ink);color:#fff;font-weight:600;}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--blue);}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--blue-line);}
.cal-dot.done{background:var(--good);}
.cal-dot.miss{background:var(--bad);}
.cal-dot.plan{background:var(--blue);}
.cal-cell.today .cal-dot{background:#fff;}
.cal-period{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--rose);}
.cal-pr{position:absolute;top:5px;left:6px;font-size:8px;color:var(--warn);font-weight:700;}
.cal-legend{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);margin-top:var(--s4);font-size:11.5px;color:var(--ink-3);}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px;}

/* ---------- quick check-in ---------- */
.qrow{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--line-2);}
.qrow:last-of-type{border-bottom:none;}
.qrow .ql{width:62px;flex:0 0 62px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
@media(max-width:420px){ .qrow .ql{width:54px;flex:0 0 54px;font-size:14.5px;} }
@media(min-width:1000px){ .seg3 button{font-size:14.5px;} }
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg-2);padding:4px;
  border-radius:14px;flex:1;min-width:0;}
.seg3 button{min-height:44px;min-width:0;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  padding:0 4px;white-space:nowrap;
  transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);}
.seg3 button.on{background:var(--blue);color:#fff;box-shadow:0 5px 12px -7px rgba(19,72,201,.9);}

/* ---------- calendar in a fold ---------- */
.cal-wrap summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;}
.cal-wrap summary::-webkit-details-marker{display:none;}
.cal-wrap summary svg{width:18px;height:18px;color:var(--ink-4);transition:transform .2s var(--ease);}
.cal-wrap[open] summary svg{transform:rotate(180deg);}
.cal-wrap[open] summary .chip{display:none;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;
  font-size:15px;font-weight:600;color:var(--ink-2);flex:0 0 40px;}
.avatar:active{transform:scale(.94);}

/* ---------- media / exercise tiles ---------- */
.media{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--surface-2);}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;}
.media.ph{display:grid;place-items:center;background:linear-gradient(160deg,#F5F8FF,#E6ECF8);}
.media.loading{background:linear-gradient(100deg,var(--surface-2) 30%,#EEF2FA 50%,var(--surface-2) 70%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite;}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.media.loading img,.media.loading video{opacity:0;}
.media img,.media video{transition:opacity .3s var(--ease);}
.media.ph svg{width:56%;height:56%;opacity:.5;}
.media .addmedia{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--ink-2);
  font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;box-shadow:var(--sh-1);}
.media .borrowed{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:var(--ink-3);
  font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;box-shadow:var(--sh-1);
  max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.media.loading .borrowed{display:none;}
.media.sm{aspect-ratio:4/3;border-radius:var(--r-sm);width:76px;flex:0 0 76px;}
.media.sm img,.media.sm video{object-position:left center;}
.media.sm.ph svg{width:64%;height:64%;}

/* inline svg sizing — every icon inherits a size from its component */
.chip svg{width:14px;height:14px;flex:0 0 auto;}
.pick svg{width:20px;height:20px;flex:0 0 auto;color:var(--ink-4);}
.upnext .lab svg{width:15px;height:15px;}
.upnext .nm,.upnext .mt,.pick .nm,.pick .mt{display:block;}
.linkbtn svg{width:15px;height:15px;}
.cue .grow{display:block;}
/* ---------- cues ---------- */
.cue{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:var(--r-sm);
  padding:12px 14px;margin-top:var(--s4);font-size:14.5px;color:var(--ink-2);line-height:1.45;}
.cue svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px;color:var(--ink-3);}
.cue.neck{background:var(--blue-soft);color:var(--blue-ink);}
.cue.neck svg{color:var(--blue);}
.cue b{font-weight:600;}

.media.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
.media.ph{position:relative;}

/* ---------- hero with the soft wave ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,#F7FAFF 46%,var(--wave-1) 100%);
  border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:var(--s5);}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:96px;pointer-events:none;}
.hero .wave svg{width:100%;height:100%;display:block;}
.hero > *{position:relative;}
.hero-row{display:flex;align-items:center;gap:var(--s4);}
.hero-sun{width:44px;height:44px;flex:0 0 44px;}
.hero h2{font-size:21px;letter-spacing:-.025em;}
.hero .sub{font-size:15px;color:var(--ink-2);margin-top:2px;}
.fab{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(19,72,201,.3),0 14px 26px -12px rgba(19,72,201,.7);
  transition:transform .16s var(--ease);}
.fab:active{transform:scale(.94);}
.fab svg{width:22px;height:22px;}

/* ---------- week strip + day tiles ---------- */
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:var(--s4) 0 var(--s5);}
.weekdots .d{text-align:center;}
.weekdots .lb{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:9px;}
.weekdots .dot{width:16px;height:16px;border-radius:50%;margin:0 auto;background:var(--bg-2);
  transition:transform .2s var(--ease);}
.weekdots .dot.plan{background:var(--blue);}
.weekdots .dot.done{background:var(--good);}
.weekdots .dot.miss{background:var(--bad);}
.weekdots .d.today .dot{box-shadow:0 0 0 4px rgba(27,98,245,.16);transform:scale(1.12);}
.daytiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.daytile{background:var(--surface-2);border-radius:var(--r);padding:13px 14px;text-align:left;min-height:70px;
  display:flex;flex-direction:column;justify-content:center;transition:transform .16s var(--ease),background .16s var(--ease);}
.daytile:active{transform:scale(.97);}
.daytile .dy{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
.daytile .ds{font-size:13px;color:var(--ink-3);margin-top:1px;}
.daytile.on{background:var(--blue);}
.daytile.on .dy,.daytile.on .ds{color:#fff;}
.daytile.on .ds{color:rgba(255,255,255,.78);}
.daytile.off .dy,.daytile.off .ds{color:var(--ink-4);}
.daytile.done{background:var(--good-soft);}

/* ---------- live session chrome ---------- */
.trainbar{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;margin-bottom:var(--s3);}
.trainbar h2{text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.trainbar .count{text-align:right;font-size:15px;font-weight:600;color:var(--ink-2);}
.navbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);
  background:transparent;transition:background .16s var(--ease);}
.navbtn:active{background:var(--bg-2);}
.navbtn svg{width:20px;height:20px;}
.navbtn.sm{width:40px;height:40px;}
.navbtn.sm svg{width:17px;height:17px;}
.strip{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border-radius:var(--r);
  padding:8px 8px 8px 16px;box-shadow:var(--sh-1);margin-bottom:10px;}
.strip-l{display:flex;flex-direction:column;min-width:0;flex:1;}
.strip-l > .num{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1;}
.strip-sub{font-size:12px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pausebtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 18px;border-radius:13px;
  background:var(--bg-2);color:var(--ink);font-size:14.5px;font-weight:600;flex:0 0 auto;
  transition:transform .16s var(--ease),background .16s var(--ease);}
.pausebtn:active{transform:scale(.96);}
.pausebtn svg{width:16px;height:16px;}
.pausebtn.on{background:var(--blue);color:#fff;}
.pausebtn.wide{flex:1;justify-content:center;min-height:54px;font-size:16px;}
.paused-note{background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:500;
  border-radius:var(--r-sm);padding:10px 14px;margin-bottom:10px;}
/* quiet, always reachable, never next to the blue button */
.cancelbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;margin:0 0 8px;
  font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em;}
.cancelbtn svg{width:14px;height:14px;}
.cancelbtn:active{color:var(--bad);}

/* ---------- duration picker ---------- */
.durgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.durtile{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),background .16s var(--ease);border:1.5px solid transparent;}
.durtile:active{transform:scale(.97);}
.durtile .dt{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.durtile .dm{display:block;font-size:13px;color:var(--ink-3);margin-top:1px;}
.durtile.on{background:var(--blue);border-color:var(--blue);}
.durtile.on .dt{color:#fff;} .durtile.on .dm{color:rgba(255,255,255,.8);}

/* ---------- exercise card ---------- */
.ec-media{position:relative;width:100%;aspect-ratio:16/10;max-height:44dvh;background:var(--surface-2);overflow:hidden;}
.ec-media.noshot{aspect-ratio:16/9;max-height:26dvh;}
.ec-media img,.ec-media video{width:100%;height:100%;object-fit:cover;display:block;}
.ec-media .media,.ec-media .media.ph{width:100%;height:100%;aspect-ratio:auto;border-radius:0;}
.ec-media .media.ph{background:linear-gradient(170deg,#FFFFFF 0%,var(--wave-1) 62%,var(--wave-2) 100%);}
.ec-media .media.ph svg{width:44%;height:44%;opacity:.85;}
.ec-media .media.ph figcaption{bottom:16px;font-size:11.5px;color:var(--ink-3);}
.ec-sheet{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-24px;
  padding:var(--s5) 18px var(--s4);position:relative;z-index:2;}
.ec-strip{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s4);}
.ec-strip .lab{font-size:16px;font-weight:700;color:var(--blue);letter-spacing:.02em;flex:0 0 auto;}
.metric{min-height:44px;padding:0 16px;border-radius:13px;background:var(--surface-2);font-size:17px;
  font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  transition:background .16s var(--ease),transform .16s var(--ease);}
.metric small{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:2px;}
.metric:active{transform:scale(.96);}
.metric.on{background:var(--blue-soft);color:var(--blue-ink);}
.metric.on small{color:var(--blue-ink);opacity:.7;}
.metric.ghost{background:transparent;border:1px dashed var(--line);color:var(--ink-3);font-size:14px;}
.editrow{display:flex;gap:10px;margin:-4px 0 var(--s4);}
.mini{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:13px;padding:4px;}
.mini button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);
  font-size:19px;font-weight:500;background:transparent;}
.mini button:active{background:var(--bg-2);}
.mini .v{min-width:78px;text-align:center;font-size:16px;font-weight:600;letter-spacing:-.01em;}
.mini .v small{color:var(--ink-3);font-weight:500;}
.mini.big{flex:1;}
.mini.big .v{flex:1;font-size:18px;}
.mini.sm{padding:2px;}
.mini.sm button{width:36px;height:36px;font-size:17px;}
.mini.sm .v{min-width:72px;font-size:13.5px;}
.ec-title{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.08;}
.sidetag{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;vertical-align:4px;}
.ec-sub{font-size:16px;color:var(--ink-2);margin-top:7px;line-height:1.4;}
.ec-prev{font-size:13.5px;color:var(--ink-3);margin-top:8px;}
/* what today is trying to beat */
.target{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13.5px;font-weight:600;
  color:var(--good);background:var(--good-soft);border-radius:var(--r-sm);padding:9px 12px;}
.target svg{width:15px;height:15px;flex:0 0 15px;}
.restrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:var(--s4);color:var(--ink-2);}
.restrow svg{width:19px;height:19px;color:var(--ink-3);flex:0 0 auto;}
.restrow .t{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.restrow button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--blue);}
.restrow.flow{color:var(--ink-3);font-size:14px;}
.restrow.flow svg{width:16px;height:16px;}
.quickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:var(--s4);}
.quickrow button{min-height:52px;border-radius:var(--r-sm);background:var(--surface-2);font-size:12.5px;
  font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.quickrow button:active{transform:scale(.96);}
.quickrow svg{width:18px;height:18px;}
.btn.big{min-height:60px;font-size:17.5px;border-radius:var(--r);}

/* ---------- plan blocks / sheets ---------- */
.planblock{padding:var(--s4) 0;border-bottom:1px solid var(--line-2);}
.planblock:last-child{border-bottom:none;}
details.sec{padding:var(--s3) 0;border-bottom:1px solid var(--line-2);}
details.sec summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;}
details.sec summary::-webkit-details-marker{display:none;}
details.sec summary svg{width:18px;height:18px;color:var(--ink-4);transition:transform .2s var(--ease);}
details.sec[open] summary svg{transform:rotate(180deg);}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;}
.searchwrap{position:relative;margin-bottom:12px;}
.searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-4);}
.txtin.search{padding-left:42px;}
.pick.plain{background:transparent;padding:15px 2px;border-bottom:1px solid var(--line-2);margin-bottom:0;border-radius:0;}
.pick.plain:active{background:var(--surface-2);}

/* ---------- lists, progress, full-bleed ---------- */
.bleed{margin-inline:-18px;}
.prog-track{height:6px;border-radius:999px;background:var(--bg-2);overflow:hidden;margin-bottom:16px;}
.prog-track span{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .4s var(--ease);}
.updeck{display:flex;flex-direction:column;gap:10px;}
.upnext{display:flex;align-items:center;gap:var(--s3);padding:12px;background:var(--surface);
  border-radius:var(--r);box-shadow:var(--sh-1);width:100%;text-align:left;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease);}
.upnext:active{transform:scale(.985);}
/* the row splits: tap the movement to see how, tap the tick to mark it done */
.up-open{display:flex;align-items:center;gap:var(--s3);flex:1;min-width:0;text-align:left;
  background:none;padding:0;transition:transform .16s var(--ease);}
.up-open:active{transform:scale(.985);}
/* the move she is on, big enough to copy */
.guide{margin-top:16px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2);box-shadow:var(--sh-1);}
.guide-media .media{border-radius:0;aspect-ratio:16/10;}
.guide-body{padding:14px;}
.guide-nm{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:4px;}
.guide-cue{font-size:14px;color:var(--ink-2);line-height:1.45;margin-top:8px;}
.upnext .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;display:block;}
.upnext .mt{font-size:12.5px;color:var(--ink-3);display:block;margin-top:1px;}
.upnext .lab{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--bg-2);display:grid;
  place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);}
.upnext .lab svg{width:15px;height:15px;color:var(--ink-4);}
.upnext.cur{box-shadow:inset 0 0 0 1.5px var(--blue),var(--sh-1);}
.upnext.cur .lab{background:var(--blue);color:#fff;}
.upnext .check{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;color:transparent;transition:background .18s var(--ease),border-color .18s var(--ease);}
.upnext .check svg{width:18px;height:18px;}
.upnext.done .nm{color:var(--ink-3);}
.upnext.done .check,.upnext .check.done{background:var(--good);border-color:var(--good);color:#fff;}
.setdots{display:flex;gap:7px;margin-top:var(--s4);justify-content:center;}
.setdots i{width:9px;height:9px;border-radius:50%;background:var(--bg-2);transition:background .2s var(--ease),transform .2s var(--ease);}
.setdots i.on{background:var(--blue);transform:scale(1.15);}
@media(min-width:900px){
  .bleed{margin-inline:0;}
  .ec-media{border-radius:var(--r-xl) var(--r-xl) 0 0;aspect-ratio:16/10;}
  .ec-sheet{border-radius:0 0 var(--r-xl) var(--r-xl);margin-top:0;box-shadow:var(--sh-2);}
  .durgrid{grid-template-columns:repeat(4,1fr);}
}

/* ---------- the rest screen ---------- */
.restview{position:fixed;inset:0;z-index:100;background:rgba(244,246,250,.96);backdrop-filter:blur(16px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);
  padding:var(--s5) 18px calc(var(--s5) + var(--safe-bot));animation:fade .22s var(--ease);}
.restview.show{display:flex;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.restview .ring{position:relative;width:min(58vw,220px);aspect-ratio:1;display:grid;place-items:center;}
.restview .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.restview .ring .t{font-size:clamp(40px,12vw,54px);font-weight:600;letter-spacing:-.04em;}
.restview .lab{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:center;}
.restview .nextup{text-align:center;}
.restview .nextup .nm{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:4px;}
.restview .ctrls{display:flex;gap:10px;width:100%;max-width:420px;}
.restview .ctrls > *{flex:1;}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(20,22,28,.32);opacity:0;pointer-events:none;
  transition:opacity .26s var(--ease);backdrop-filter:blur(2px);}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--surface);visibility:hidden;
  border-radius:26px 26px 0 0;box-shadow:0 -8px 40px -12px rgba(20,26,45,.32);
  transform:translateY(101%);transition:transform .3s var(--ease),visibility .3s;
  max-height:88dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;}
.sheet.show{transform:none;visibility:visible;}
.sheet-grip{width:38px;height:4px;border-radius:999px;background:var(--line);margin:10px auto 2px;flex:0 0 auto;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s5) var(--s3);flex:0 0 auto;gap:var(--s3);}
.sheet-head h3{font-size:18px;letter-spacing:-.02em;}
.sheet-body{padding:0 var(--s5) calc(var(--s5) + var(--safe-bot));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.xbtn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);}
.pick{display:flex;gap:var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s3);border-radius:var(--r);
  background:var(--surface-2);margin-bottom:var(--s3);transition:background .16s var(--ease),transform .16s var(--ease);}
.pick:active{transform:scale(.985);}
.pick .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.pick .mt{font-size:12.5px;color:var(--ink-3);margin-top:1px;}
.pick.on{background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px var(--blue-line);}
.pick.on .nm{color:var(--blue-ink);}
.pick.on svg{color:var(--blue);}
/* the two quiet answers under the segments */
.pillrow{display:flex;gap:var(--s2);margin-top:var(--s4);}
.pill{display:flex;align-items:center;gap:7px;flex:1;min-width:0;min-height:44px;padding:0 12px;
  border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;transition:background .16s var(--ease);}
.pill span{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill svg{width:15px;height:15px;flex:0 0 15px;color:var(--ink-4);}
.pill:active{background:var(--bg-2);}
.whylist{margin:0;padding:0 0 0 20px;}
.whylist li{font-size:15px;color:var(--ink);line-height:1.5;margin-bottom:10px;}
.whylist li::marker{color:var(--blue);font-weight:600;}
/* whether the coach can actually talk, said plainly */
.aistat{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:var(--r-sm);
  font-size:14px;font-weight:500;line-height:1.4;}
.aistat svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px;}
.aistat.ok{background:var(--good-soft);color:var(--good);}
.aistat.bad{background:var(--bad-soft);color:var(--bad);}
.aistat.off{background:var(--warn-soft);color:var(--warn);}
.deflist dt{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:var(--s4);}
.deflist dd{margin:5px 0 0;font-size:15px;color:var(--ink-2);line-height:1.5;}

/* ---------- nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + var(--safe-bot));max-width:1120px;margin:0 auto;}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--ink-3);
  font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:color .16s var(--ease);min-height:50px;}
.tabbar button svg{width:24px;height:24px;}
.tabbar button.on{color:var(--blue);}
.tabbar button:active svg{transform:scale(.9);}
.tabbar button svg{transition:transform .16s var(--ease);}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));transform:translate(-50%,14px);z-index:120;
  background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:13px 20px;border-radius:999px;
  box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);
  max-width:min(92vw,420px);text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--ink-3);}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:var(--s3);}
.empty p{font-size:14.5px;}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:sp .7s linear infinite;display:inline-block;}
.spin.dark{border-color:rgba(20,26,45,.2);border-top-color:var(--ink);}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px;}
.bars .b{flex:1;background:var(--blue-soft);border-radius:5px 5px 3px 3px;min-height:3px;position:relative;transition:height .4s var(--ease);}
.bars .b.on{background:var(--blue);}
.bars .b.miss{background:var(--bg-2);}
.linechart{width:100%;height:110px;display:block;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.stat{background:var(--surface);border-radius:var(--r);padding:var(--s4);box-shadow:var(--sh-1);}
.stat .k{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
.stat .v{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:5px;line-height:1.1;}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0;}
.pr{background:linear-gradient(150deg,#14161C,#272B36);color:#fff;border-radius:var(--r-lg);padding:var(--s5);
  box-shadow:var(--sh-3);}
.pr .eyebrow{color:rgba(255,255,255,.6);}
.pr .nm{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:7px;}
.pr .v{font-size:16px;color:rgba(255,255,255,.8);margin-top:3px;}
.chatlog{display:flex;flex-direction:column;gap:var(--s3);padding-bottom:var(--s4);}
.msg{max-width:86%;padding:13px 16px;border-radius:18px;font-size:15px;line-height:1.5;}
.msg.coach{background:var(--surface);color:var(--ink);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--sh-1);}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px;}
.msg b{font-weight:600;}
.composer{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-bot));z-index:60;padding:0 18px;
  max-width:1120px;margin:0 auto;display:none;}
.composer.show{display:block;}
.composer .wrap{display:flex;gap:var(--s2);background:var(--surface);border-radius:var(--r);padding:6px;
  box-shadow:var(--sh-2);border:1px solid var(--line);}
.composer input{flex:1;border:none;background:none;padding:0 12px;min-height:46px;outline:none;font-size:15.5px;}
.composer .send{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;}
.listrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:16px 0;
  border-bottom:1px solid var(--line-2);width:100%;text-align:left;}
.listrow:last-child{border-bottom:none;}
.listrow .k{font-size:15px;font-weight:500;}
.listrow .v{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:8px;}
.listrow.stacked{display:block;}
.listrow.stacked .v{display:block;margin-top:3px;color:var(--ink-2);}
.listrow svg{width:17px;height:17px;color:var(--ink-4);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);}

@media(min-width:760px){

}

}

@media (min-width:760px){
  .ec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;

  .photo-grid{grid-template-columns:repeat(4,1fr);}

}

/* ---------- phone in landscape ----------
   iPhone 17 on its side is ~874 x 402: wide, and very short. Everything
   that stacks in portrait sits side by side here, the tab bar loses its
   second line, and the notch side gets its inset back. */
@media (orientation:landscape) and (max-height:560px){
  #app{padding:calc(var(--safe-top) + 10px) calc(18px + var(--safe-right)) calc(74px + var(--safe-bot)) calc(18px + var(--safe-left));}
  .topbar{margin-bottom:var(--s4);}
  h1{font-size:24px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:start;}
  .tabbar{grid-template-columns:repeat(5,1fr);padding:4px calc(6px + var(--safe-right)) calc(4px + var(--safe-bot)) calc(6px + var(--safe-left));}
  .tabbar button{flex-direction:row;gap:7px;min-height:42px;font-size:12px;padding:4px 0;}
  .tabbar button svg{width:19px;height:19px;}
  .composer{bottom:calc(54px + var(--safe-bot));}
  .toast{bottom:calc(66px + var(--safe-bot));}
  /* the working exercise: picture on the left, the numbers and the button on the right */
  .ec{display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1.05fr);gap:0;align-items:stretch;
    background:var(--surface);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2);}
  .ec-media{aspect-ratio:auto;max-height:none;height:100%;min-height:190px;border-radius:0;}
  .ec-media.noshot{aspect-ratio:auto;max-height:none;}
  .ec-sheet{margin-top:0;border-radius:0;padding:var(--s4) var(--s4) var(--s3);overflow-y:auto;max-height:calc(100dvh - 150px);}
  .bleed{margin-inline:0;}
  .ec-title{font-size:22px;}
  .trainbar{grid-template-columns:40px 1fr 40px;margin-bottom:2px;}

  .stripwrap{display:flex;align-items:center;gap:10px;}
  .stripwrap .strip{flex:1;min-width:0;margin-bottom:0;padding:4px 6px 4px 12px;}
  .strip-l > .num{font-size:17px;}

  .prog-track{margin:6px 0 8px;}
  /* the rest screen reads across, not down */
  .restview{flex-direction:row;flex-wrap:wrap;gap:var(--s5);padding:var(--s4) calc(18px + var(--safe-right)) calc(var(--s4) + var(--safe-bot)) calc(18px + var(--safe-left));}
  .restview .ring{width:min(30vw,150px);}

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   TRAIN — Lia's personal training app
   Built on the Amir PT architecture: single-file PWA, localStorage +
   IndexedDB, Firestore mirror, OpenAI for judgement only. Every state
   change is decided in code; the model explains, it never commands.
   ===================================================================== */
const VERSION = "2.1";
const STORE_KEY = "lia_train_v1";
const IDB_NAME = "liaTrain", IDB_STORE = "kv";

/* Firebase web config is public by design — it names the project, it does not
   grant access. The Firestore rules are what protect the data. Lia's documents
   live in their own collection so nothing of hers touches Amir's. */
const FB_CONFIG = {
  apiKey:"AIzaSyBp4csrAvI9TCeult4GD6iB_w48uU5InWM",
  authDomain:"ptchat-170ff.firebaseapp.com",
  projectId:"ptchat-170ff",
  storageBucket:"ptchat-170ff.firebasestorage.app",
  messagingSenderId:"547217019363",
  appId:"1:547217019363:web:7a514c9009004780a350d6"
};
const FB_COLLECTION = "liapt";              /* preferred */
const FB_COLLECTION_FALLBACK = "amirpt";    /* works under the existing rules */
const FB_SYNC_DEFAULT = "lia-7m2xv4";

const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const PROFILE_DEFAULT = {
  name:"Lia", age:37, heightCm:178, weightKg:65, targetKg:65,
  goalDate:"2027-03-31",
  experience:"Beginner returning to training — trained consistently February to May 2026.",
  place:"Dubai home gym",
  goals:["Build and shape glutes","Strengthen and define the back","Visible abdominal definition",
         "Pelvic and trunk stability","Stronger and more defined at the same weight","Train without neck pain"],
  avoid:"No disproportionately large upper body. Strength and shape, not size up top.",
  likes:["Deadlift","Push-up","Chest Press","Cable Row","Resistance bands"],
  sessionMins:60, shortMins:20, daysPerWeek:5,
  csection:"C-section approximately one year ago. No current movement restrictions.",
  equipment:"Brute Force 360 PTX rack with dual cable stacks and Smith; Olympic barbell and plates; fixed dumbbells to 10 kg; TRX; resistance bands; Concept2 RowERG; adjustable bench; mat; kettlebell; stability ball."
};

const DEFAULTS = {
  v: VERSION,
  profile: structuredClone(PROFILE_DEFAULT),
  checkins: {},        /* iso -> checkin record */
  sessions: {},        /* iso -> workout object (planned, live or completed) */
  strength: {},        /* exercise -> [{date, sets:[{w,r,rpe}]}] */
  cycle: { periods:[], logs:{}, avgLength:28, avgBleed:5 },
  measures: [],        /* [{date, waist, hips, thigh, ...}] */
  weights: [],         /* [{date, kg}] */
  photos: [],          /* [{id, date, pose, data}] */
  prs: [],             /* [{date, ex, kind, value, note}] */
  reviews: [],         /* monthly reviews */
  chat: [],
  lib: {},             /* user-saved exercise references */
  exPrefs: {},         /* name -> {love:true, avoid:true, why} */
  media: {},           /* name -> url override */
  streak: 0,
  ai: { key:"", model:"gpt-4o-mini" },
  cloud: { on:true, syncId:FB_SYNC_DEFAULT, collection:FB_COLLECTION, last:null, syncKeys:false },
  prefs: {
    /* Every transition has its own rest. Supersets get a short changeover,
       not a full rest — that is the whole point of pairing them. */
    rest: { superset:20, round:75, block:100, straight:75 },
    sound:true, vibrate:true, cycleOn:true, coachTone:"warm",
    /* the timer runs itself, counts her in, and says what is next */
    autoTimer:true, voice:true,
    /* how much of the programme is held still so it can be built on */
    build:"balanced",
    /* which week she is on: her own, mixed, or a bodybuilding split */
    style:"lia",
    cooldownSec:40,
    /* The three buttons on the duration picker, and the one she used last. */
    durations:{ quick:20, standard:40, full:60 },
    lastDuration:"full",
    /* Equipment she gravitates to. It biases what a swap offers first;
       it never removes anything from the programme. */
    favourEquipment:["band"] },
  seenIntro: false,
  /* The coach's memory. Everything here is written by the engine, saved
     with every other change and carried to the cloud with the rest. */
  coach: {
    blockStart:null,     /* the Monday the current four-week block began */
    anchors:{},          /* slot -> the movement held there, and since when */
    progress:{},         /* exercise -> which variable moved last */
    feedback:[],         /* [{date, effort, pain, loved, disliked}] */
    exStats:{},          /* exercise -> {done, skipped, loved, disliked} */
    blocked:{},          /* exercise -> {why, since} after a pain report */
    sigs:[],             /* recent session signatures, for the 30-day rule */
    asked:{},            /* exercise -> the day we asked why it keeps getting skipped */
    favourites:{},       /* day -> a session she gave a thumbs up, to run again heavier */
    rejected:[],         /* sessions she gave a thumbs down — never built again */
    nonce:0              /* bumped by a deliberate rebuild, so it differs */
  }
};

/* ---------- tiny utils ---------- */
function today(){ const d=new Date(); return iso(d); }
function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
/* Day-first everywhere a human sees a date. Sort keys stay ISO and stay hidden. */
function uk(s){ if(!s) return "—"; const d=parseISO(s); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function ukLong(s){ const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function ukShort(s){ const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/864e5); }
function dowOf(s){ return parseISO(s).getDay(); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function el(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function plural(n,w){ return n+" "+word(w,n); }
function word(w,n){ if(n===1) return w; return /(ch|sh|s|x|z)$/i.test(w)? w+"es" : /[^aeiou]y$/i.test(w)? w.slice(0,-1)+"ies" : w+"s"; }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
function kgTxt(w){ if(w==null||w==="") return ""; return (Math.round(w*10)/10)+" kg"; }
function roundLoad(w){ const step = w<10 ? 0.5 : (w<30 ? 1.25 : 2.5); return Math.max(0, Math.round(w/step)*step); }

/* ---------- persistence ---------- */
let _idb=null;
function idbOpen(){ return new Promise(res=>{ try{
  const rq=indexedDB.open(IDB_NAME,1);
  rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null);
}catch(e){ res(null); } }); }
async function idbSet(v){ try{ if(!_idb)_idb=await idbOpen(); if(!_idb)return;
  _idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(v,STORE_KEY); }catch(e){} }
async function idbGet(){ try{ if(!_idb)_idb=await idbOpen(); if(!_idb)return null;
  return await new Promise(res=>{ const rq=_idb.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(STORE_KEY);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }); }catch(e){ return null; } }

function mergeDefaults(parsed){
  const d={...structuredClone(DEFAULTS),...(parsed||{})};
  for(const k of Object.keys(DEFAULTS)){
    if(d[k]==null) d[k]=structuredClone(DEFAULTS[k]);
    else if(!Array.isArray(DEFAULTS[k]) && typeof DEFAULTS[k]==="object")
      d[k]={...structuredClone(DEFAULTS[k]),...d[k]};
  }
  d.profile={...structuredClone(PROFILE_DEFAULT),...(parsed&&parsed.profile||{})};
  return d;
}
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return mergeDefaults(JSON.parse(raw)); }catch(e){ console.warn("load",e); }
  return mergeDefaults(null);
}
let _saveT=null, _dirty=false;
function save(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }catch(e){ console.warn("save",e); }
  idbSet(DB); _dirty=true;
  if(_saveT) clearTimeout(_saveT);
  _saveT=setTimeout(()=>{ if(DB.cloud&&DB.cloud.on) cloudPush(true); },2500);
}
let DB = load();

/* ---------- navigation ---------- */
let CUR="home"; const SCROLL={};
function go(name,opts){
  if(name===CUR && !(opts&&opts.force)){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  try{ SCROLL[CUR]=window.scrollY||0; }catch(e){}
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  const t=el("s-"+name); if(t) t.classList.add("active");
  CUR=name;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.s===name));
  el("composer").classList.toggle("show", name==="coach");
  render(name);
  requestAnimationFrame(()=>window.scrollTo({top:(opts&&opts.keepScroll)?(SCROLL[name]||0):0,behavior:"instant"}));
}
function render(name){
  try{
    if(name==="home") renderHome();
    else if(name==="train") renderTrain();
    else if(name==="progress") renderProgress();
    else if(name==="coach") renderChat();
    else if(name==="more") renderMore();
    else if(name==="cycle") renderCycle();
    else if(name==="library") renderLibrary();
    else if(name==="settings") renderSettings();
  }catch(e){ console.error("render "+name,e); toast("Something went wrong drawing that screen"); }
}
function refresh(){ render(CUR); }

let _toastT=null;
function toast(m){
  const t=el("toast"); t.textContent=m; t.classList.add("show");
  if(_toastT) clearTimeout(_toastT);
  _toastT=setTimeout(()=>t.classList.remove("show"),2800);
}

/* ---------- bottom sheet ---------- */
let _sheetOnClose=null;
function openSheet(title,html,onClose){
  el("sheetTitle").textContent=title;
  el("sheetBody").innerHTML=html;
  el("sheet").classList.add("show"); el("scrim").classList.add("show");
  _sheetOnClose=onClose||null;
  el("sheet").querySelectorAll("[data-slider]").forEach(paintSlider);
}
function closeSheet(){
  el("sheet").classList.remove("show"); el("scrim").classList.remove("show");
  const f=_sheetOnClose; _sheetOnClose=null; if(f) try{ f(); }catch(e){}
  /* Empty it once it is off screen: a closed sheet must not leave live
     buttons in the document for a screen reader or a stray tap. */
  setTimeout(()=>{ if(!sheetOpen()){ el("sheetBody").innerHTML=""; el("sheetTitle").textContent=""; } },320);
}
function sheetOpen(){ return el("sheet").classList.contains("show"); }

/* ---------- sound ---------- */
let _audio=null;
/* ---------- the sounds ----------
   She should not have to look at the phone. Three ticks, a go, a swap and a
   finish, each a different pitch so they are told apart without reading. */
function tone(freq,dur,delay,vol){
  if(!(DB.prefs&&DB.prefs.sound)) return;
  try{
    if(!_audio){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; _audio=new C(); }
    if(_audio.state==="suspended") _audio.resume();
    const o=_audio.createOscillator(), g=_audio.createGain();
    o.connect(g); g.connect(_audio.destination);
    o.type="sine"; o.frequency.value=freq;
    const t0=_audio.currentTime+(delay||0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.22,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.2));
    o.start(t0); o.stop(t0+(dur||0.2)+0.05);
  }catch(e){}
}
function buzz(ms){ try{ if(DB.prefs.vibrate && navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function cueTick(){ tone(880,0.1,0,0.2); buzz(35); }                        /* three, two, one */
function cueGo(){ tone(1319,0.3,0,0.26); buzz(90); }                        /* go */
function cueSwap(){ tone(659,0.14,0,0.24); tone(880,0.2,0.18,0.24); buzz([60,60,60]); }
function cueDone(){ tone(784,0.2,0,0.26); tone(1046,0.42,0.2,0.26); buzz([120,80,160]); }
/* Spoken cues, so the one thing she would have looked up — what is next —
   is said out loud. Off in Settings if it grates. */
function say(text){
  if(!(DB.prefs&&DB.prefs.voice)) return;
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.rate=1.05; u.pitch=1; u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* Fire a cue once per whole second, however often the painter runs. */
let CUE={};
function cueCountdown(key,left){
  const s=Math.ceil(left-0.08);
  const prev=CUE[key];
  if(prev===s) return;
  CUE[key]=s;
  if(prev==null) return;                 /* the first paint is not a tick */
  if(s===3||s===2||s===1) cueTick();
}
function clearCue(key){ delete CUE[key]; }
/* Keep the screen awake while she is training, or iOS sleeps the phone and
   the cues stop with it. */
let _wake=null;
async function holdScreen(on){
  try{
    if(on){
      if(_wake||!navigator.wakeLock) return;
      _wake=await navigator.wakeLock.request("screen");
      _wake.addEventListener("release",()=>{ _wake=null; });
    } else if(_wake){ await _wake.release(); _wake=null; }
  }catch(e){ _wake=null; }
}

function beep(times){
  if(!(DB.prefs&&DB.prefs.sound)) return;
  try{
    if(!_audio){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; _audio=new C(); }
    if(_audio.state==="suspended") _audio.resume();
    const n=times||1;
    for(let i=0;i<n;i++){
      const o=_audio.createOscillator(), g=_audio.createGain();
      o.connect(g); g.connect(_audio.destination); o.type="sine"; o.frequency.value= i===n-1?1046:784;
      const t0=_audio.currentTime+i*0.26;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
      o.start(t0); o.stop(t0+0.34);
    }
  }catch(e){}
}
function unlockAudio(){ try{ if(!_audio){ const C=window.AudioContext||window.webkitAudioContext; if(C) _audio=new C(); }
  if(_audio&&_audio.state==="suspended") _audio.resume(); }catch(e){} }

/* Names, sorted once. */
const EX_NAMES = Object.keys(EXDB);
function EX(name){
  if(EXDB[name]) return EXDB[name];
  const l=(DB.lib||{})[name];
  if(l) return {m:l.m||["mobility"],eq:l.eq||"bw",pat:"custom",load:l.load||"kg",cue:l.note||"Your own movement.",
    miss:"",start:"",move:l.note||"",easier:"",harder:"",custom:true,gif:l.url&&/\.(gif|png|jpe?g|webp)$/i.test(l.url)?l.url:null,link:l.url||null};
  return null;
}
function allNames(){ return [...EX_NAMES, ...Object.keys(DB.lib||{})]; }

/* Body map placeholder — shows what the movement trains. Front or back view
   depending on the target, so a placeholder still tells her something. */
function bodyMap(muscles){
  const set=new Set(muscles||[]);
  const back = (muscles||[]).some(m=>POSTERIOR.includes(m));
  const on=(...g)=>g.some(x=>set.has(x))?"#2B54F2":"#D6DBE5";
  const q=String.fromCharCode(34);
  const head='<circle cx="50" cy="15" r="8.5" fill="#C3CAD8"/>';
  let body;
  if(back){
    body =
     '<rect x="38" y="25" width="24" height="6" rx="3" fill="'+on("shoulders","upper-back")+'"/>'+
     '<path d="M36 32 h28 a4 4 0 0 1 4 4 l-3 16 a5 5 0 0 1 -5 4 h-20 a5 5 0 0 1 -5 -4 l-3 -16 a4 4 0 0 1 4 -4 z" fill="'+on("back","lats","upper-back")+'"/>'+
     '<rect x="26" y="33" width="8" height="20" rx="4" fill="'+on("arms")+'"/>'+
     '<rect x="66" y="33" width="8" height="20" rx="4" fill="'+on("arms")+'"/>'+
     '<path d="M38 56 h24 a4 4 0 0 1 4 4 v6 a6 6 0 0 1 -6 6 h-20 a6 6 0 0 1 -6 -6 v-6 a4 4 0 0 1 4 -4 z" fill="'+on("glutes")+'"/>'+
     '<rect x="39" y="73" width="9" height="20" rx="4.5" fill="'+on("hamstrings")+'"/>'+
     '<rect x="52" y="73" width="9" height="20" rx="4.5" fill="'+on("hamstrings")+'"/>'+
     '<rect x="40" y="94" width="7" height="10" rx="3.5" fill="'+on("calves")+'"/>'+
     '<rect x="53" y="94" width="7" height="10" rx="3.5" fill="'+on("calves")+'"/>';
  } else {
    body =
     '<rect x="38" y="25" width="24" height="6" rx="3" fill="'+on("shoulders")+'"/>'+
     '<path d="M37 32 h26 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 z" fill="'+on("chest")+'"/>'+
     '<rect x="26" y="33" width="8" height="20" rx="4" fill="'+on("arms")+'"/>'+
     '<rect x="66" y="33" width="8" height="20" rx="4" fill="'+on("arms")+'"/>'+
     '<path d="M40 51 h20 a3 3 0 0 1 3 3 v14 a4 4 0 0 1 -4 4 h-18 a4 4 0 0 1 -4 -4 v-14 a3 3 0 0 1 3 -3 z" fill="'+on("deep-core","obliques")+'"/>'+
     '<rect x="34" y="52" width="5" height="16" rx="2.5" fill="'+on("obliques")+'"/>'+
     '<rect x="61" y="52" width="5" height="16" rx="2.5" fill="'+on("obliques")+'"/>'+
     '<rect x="39" y="73" width="9" height="21" rx="4.5" fill="'+on("quads")+'"/>'+
     '<rect x="52" y="73" width="9" height="21" rx="4.5" fill="'+on("quads")+'"/>'+
     '<rect x="40" y="95" width="7" height="9" rx="3.5" fill="'+on("calves")+'"/>'+
     '<rect x="53" y="95" width="7" height="9" rx="3.5" fill="'+on("calves")+'"/>';
  }
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112">'+head+body+'</svg>';
  return svg.split('"').join(q);
}

   Photographs and clips live in the repo beside index.html, in a folder
   called demos, named after the exercise in lower case with hyphens:

function exImg(name){
  if(EX_IMG[name]) return {file:EX_IMG[name], borrowed:null};
  const p=EX_IMG_BORROWED[name];
  if(p && EX_IMG[p]) return {file:EX_IMG[p], borrowed:p};

}

const DEMO_EXT=["jpg","webp","png","gif","mp4"];
function slugOf(name){ return String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function demoURL(name,i){ return "demos/"+slugOf(name)+"."+DEMO_EXT[i||0]; }
function isVideo(url){ return /\.(mp4|webm|mov)(\?|$)/i.test(String(url||"")); }
/* The order matters. A picture in the demos folder is hers, chosen for this
   exercise, and beats the built-in animation, which lives on someone else's
   server and can be slow or simply gone. Anything she pasted in herself wins
   over both. */
function mediaFor(name){
  const o=(DB.media||{})[name]; if(o) return o;          /* one she pasted in herself */
  const m=exImg(name); if(m) return "demos/"+m.file;     /* the photograph for this movement */
  if(MEDIA_OK[name]!=null) return demoURL(name,MEDIA_OK[name]);  /* a file that proved itself */
  if(DEMOS_PRESENT!==false) return demoURL(name,0);      /* anything else she drops in */
  const e=EX(name); if(e&&e.gif) return e.gif;           /* then the built-in animation */
  return null;
}
function builtInGif(name){ const e=EX(name); return (e&&e.gif)||null; }
const TRY_GIF=98, TRY_FIXED=99;
/* True only when we know for certain there is a picture. */
function hasRealMedia(name){
  if((DB.media||{})[name]) return true;
  if(exImg(name)) return true;
  const e=EX(name); if(e&&e.gif) return true;
  return !!MEDIA_OK[name];
}
const MEDIA_OK={};   /* filled in as files prove themselves */
/* Is there a demos folder at all? One probe at start-up answers it. Until it
   does, only the big card asks for a file, so an empty repo costs one request
   per screen rather than one per thumbnail. */
let DEMOS_PRESENT=null;
/* Is there a demos folder with anything in it? Ask for a handful of the most
   common movements in every image format before deciding there is not — a
   folder of webp, or one that simply hasn't got a hip thrust in it yet, is
   still a folder. */
const PROBE_NAMES=["Hip Thrust","Glute Bridge","Romanian Deadlift","Goblet Squat","Push-up","Plank"];
function probeDemos(){
  /* The map already names files we know are there, so there is nothing to
     probe and no 404 to spend. Only an unmapped movement needs the guess. */
  if(Object.keys(EX_IMG).length){ DEMOS_PRESENT=true; return; }
  try{
    const tries=[];
    PROBE_NAMES.forEach(n=>DEMO_EXT.forEach((x,i)=>{ if(i<4) tries.push(demoURL(n,i)); }));
    let left=tries.length, found=false;
    tries.forEach(src=>{
      const img=new Image();
      img.onload=()=>{ if(found) return; found=true; DEMOS_PRESENT=true; try{ refresh(); }catch(e){} };
      img.onerror=()=>{ if(--left<=0 && !found) DEMOS_PRESENT=false; };
      img.src=src;
    });
    if(!tries.length) DEMOS_PRESENT=false;
  }catch(e){ DEMOS_PRESENT=false; }
}
function mediaHTML(name,cls){
  const e=EX(name)||{};
  const small=(cls||"").indexOf("sm")>=0;
  let url=mediaFor(name);
  /* thumbnails wait until we know the folder exists — a mapped photograph
     is known to exist, so it never waits */
  if(small && DEMOS_PRESENT!==true && !((DB.media||{})[name]||exImg(name)||e.gif)) url=null;
  const lab=(e.m||[]).slice(0,2).map(muscleLabel).join(" · ");
  const ph='<div class="media ph '+(cls||"")+'" data-ex="'+esc(name)+'">'+bodyMap(e.m||[])+
    ((!small&&lab)? '<figcaption>'+esc(lab)+'</figcaption>':'')+'</div>';
  if(!url) return ph;
  if(isVideo(url))
    return '<div class="media loading '+(cls||"")+'"><video src="'+esc(url)+'" autoplay muted loop playsinline '+
      'data-ex="'+esc(name)+'" data-try="99" onloadeddata="mediaOK(this)" onerror="mediaFailed(this)" '+
      'aria-label="'+esc(name)+' demonstration"></video></div>';
  /* how we got this url decides what happens if it fails to load */
  const mapped=exImg(name);
  const t = ((DB.media||{})[name] || mapped) ? TRY_FIXED
          : (MEDIA_OK[name]!=null) ? MEDIA_OK[name]
          : (url===e.gif) ? TRY_GIF
          : 0;
  /* a band variant showing the still of the movement it is built on says so */
  const note=(mapped&&mapped.borrowed&&!small)
    ? '<span class="borrowed">'+esc(mapped.borrowed)+' shown — add the band</span>' : '';
  return '<div class="media loading '+(cls||"")+'"><img src="'+esc(url)+'" alt="'+esc(name)+' demonstration"'+
    (small?' loading="lazy"':'')+' data-ex="'+esc(name)+'" data-try="'+t+'" data-t="'+Date.now()+'" '+
    'onload="mediaOK(this)" onerror="mediaFailed(this)" />'+note+'</div>';
}
function mediaOK(img){
  try{
    const box=img.parentNode; box.classList.remove("loading");
    if(img.dataset.ex){
      const t=+img.dataset.try;
      /* only a file from the demos folder proves the folder exists */
      if(t>=0 && t<DEMO_EXT.length){ MEDIA_OK[img.dataset.ex]=t; DEMOS_PRESENT=true; }
    }
    const frame=box.closest(".ec-media"); if(frame) frame.classList.remove("noshot");
  }catch(e){}
}
/* A demonstration that is missing, slow or gone becomes the body map rather
   than a broken image or an empty grey box. */
function mediaFailed(node){
  try{
    const name=node.dataset.ex||"";
    const t=+node.dataset.try;
    /* walk the folder's formats first: jpg, webp, png, gif, mp4 */
    if(t>=0 && t<DEMO_EXT.length-1 && node.tagName==="IMG"){
      node.dataset.try=String(t+1);
      node.dataset.t=String(Date.now());
      node.src=demoURL(name,t+1);
      return;
    }
    /* nothing of hers — fall back to the built-in animation before giving up */
    if(t!==TRY_GIF && node.tagName==="IMG" && builtInGif(name)){
      node.dataset.try=String(TRY_GIF);
      node.dataset.t=String(Date.now());
      node.src=builtInGif(name);
      return;
    }
    const e=EX(name)||{};
    const box=node.parentNode;
    box.classList.remove("loading");
    box.classList.add("ph");
    const frame=box.closest(".ec-media"); if(frame) frame.classList.add("noshot");
    const lab=(e.m||[]).slice(0,2).map(muscleLabel).join(" · ");
    box.innerHTML=bodyMap(e.m||[])+((box.classList.contains("sm")||!lab)?"":'<figcaption>'+esc(lab)+'</figcaption>');
  }catch(err){}
}

/* A demonstration is hosted elsewhere, so it can be slow or simply gone.
   onerror covers a refusal; this covers a request that never answers. */
setInterval(()=>{
  try{
    document.querySelectorAll("img[data-ex][data-t]").forEach(img=>{
      if(img.complete && img.naturalWidth>0) return;
      if(Date.now()-(+img.dataset.t||0) > 6000) mediaFailed(img);
    });
  }catch(e){}
}, 2500);

   version. Anything that other movements point to as "harder", and that has
   no harder version of its own, is the top of its chain. */
const ADVANCED = (()=>{
  const named=new Set();
  EX_NAMES.forEach(n=>{ const h=(EXDB[n]||{}).harder; if(h && h!==n) named.add(h); });
  const out=new Set();
  named.forEach(n=>{ const e=EXDB[n]; if(e && (!e.harder || e.harder===n)) out.add(n); });
  return out;
})();

/* ---------- coach memory ----------
   Everything the engine needs to not repeat itself lives in DB and is
   saved with every other change, so a refresh never loses it. */
function coach(){
  if(!DB.coach) DB.coach={};
  const c=DB.coach;
  c.anchors=c.anchors||{}; c.progress=c.progress||{}; c.feedback=c.feedback||[];
  c.exStats=c.exStats||{}; c.blocked=c.blocked||{}; c.sigs=c.sigs||[];
  c.asked=c.asked||{}; c.nonce=c.nonce||0;
  c.favourites=c.favourites||{}; c.rejected=c.rejected||[];
  return c;
}
