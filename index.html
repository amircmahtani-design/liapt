/* Sessions before a date, newest first. "Prescribed" is what the app put on
   screen; "performed" is what she actually logged work against. */
function priorSessions(dateISO,n){
  const d=dateISO||today();
  return Object.keys(DB.sessions||{}).filter(k=>k<d).sort().reverse()
    .map(k=>DB.sessions[k]).filter(s=>s && !s.rest && !s.deleted && (s.blocks||[]).length)
    .slice(0,n||10);
}
function sessionWasPerformed(s){
  if(!s||!s.state) return false;
  if(s.state.finished) return true;
  return Object.keys(s.state.done||{}).length>0;
}
function performedSessions(dateISO,n){
  return priorSessions(dateISO,60).filter(sessionWasPerformed).slice(0,n||10);
}
function exercisesIn(s){
  const out=[]; (s.blocks||[]).forEach(b=>b.items.forEach(i=>out.push(i.ex))); return out;
}
/* exercise -> the most recent date it was put on screen at all */
function shownMap(dateISO){
  const map={};
  priorSessions(dateISO,20).forEach(s=>{
    exercisesIn(s).forEach(ex=>{ if(!map[ex] || map[ex]<s.date) map[ex]=s.date; });
  });
  return map;
}
/* exercise -> the most recent date it appeared in a performed session */
function usageMap(dateISO){
  const map={};
  performedSessions(dateISO,40).forEach(s=>{
    exercisesIn(s).forEach(ex=>{ if(!map[ex] || map[ex]<s.date) map[ex]=s.date; });
  });
  Object.keys(DB.strength||{}).forEach(ex=>{
    (DB.strength[ex]||[]).forEach(e=>{ if(e.date<dateISO && (!map[ex]||map[ex]<e.date)) map[ex]=e.date; });
  });
  return map;
}

/* ---------- the four-week block ---------- */
function blockStart(){
  const c=coach();
  if(!c.blockStart){
    const first = startedOn() || today();
    c.blockStart = weekStart(first);
  }
  return c.blockStart;
}
function blockWeek(dateISO){
  const weeks = Math.floor(daysBetween(blockStart(), weekStart(dateISO||today()))/7);
  return ((weeks%4)+4)%4 + 1;
}
const BLOCK_NOTE = {
  1:"Week 1 of 4 — settle the technique and set the baseline.",
  2:"Week 2 of 4 — one step up from last week.",
  3:"Week 3 of 4 — the strongest week of the block.",
  4:"Week 4 of 4 — lighter on purpose, so week 1 starts fresh."
};

/* ---------- a stable, seeded shuffle ----------
   Randomness she can reproduce: the same day gives the same session, a
   deliberate rebuild gives a different one. */
function hash32(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h>>>0;
}
function jitter(seed){ return (hash32(seed)%1000)/1000; }

/* ---------- slots ----------
   The weekly templates stay exactly as written — they are the shape of the
   day. Each item becomes a slot: a category, a starting movement and a
   role. Block A's loaded work is anchored and held; the rest rotates. */
function slotsFor(plan,variant){
  const src = plan[variant] || plan.full;
  const bm=buildMode();
  let anchorsLeft = bm.anchors;
  return src.map((b,bi)=>({
    label:b.label, rounds:b.rounds, rest:b.rest, flow:!!b.flow, straight:!!b.straight,
    items: b.items.map((it,ii)=>({
      key: plan.key+"/"+b.label+(ii+1),
      kind: plan.kind,
      circuit: !!b.flow || plan.kind==="hiit" || b.items.length>2,
      seed: it.ex,
      cat: catOf(it.ex),
      pat: (EX(it.ex)||{}).pat,
      loaded: isLoadable(it.ex),
      timed: !!it.time,
      role: ((bi===0 || (bm.blockB && bi===1)) && isLoadable(it.ex) && !b.flow && anchorsLeft-- > 0)
              ? "anchor" : "accessory",
      reps: it.reps!=null? it.reps : null,
      time: it.time||null,
      side: !!it.side
    }))
  }));
}

/* ---------- what today has to work with ---------- */
const ALL_EQUIP = ["bb","db","cable","smith","band","trx","bw","kb","ball","row","bar","bench"];
function equipToday(ci){
  const list = (ci && Array.isArray(ci.equip) && ci.equip.length)? ci.equip : ALL_EQUIP;
  const s=new Set(list); s.add("bw");            /* her body is always available */
  return s;
}
function buildContext(dateISO,ci){
  const date=dateISO||today();
  const prev=priorSessions(date,10);
  const perf=performedSessions(date,10);
  const recent2=new Set(); perf.slice(0,2).forEach(s=>exercisesIn(s).forEach(e=>recent2.add(e)));
  const prevSet=new Set(prev.length? exercisesIn(prev[0]) : []);
  const c=coach();
  const fb=(c.feedback||[]).slice(-1)[0]||null;
  return {
    date,
    week: blockWeek(date),
    neck: ci? (+ci.neck||0) : neckToday(),
    pain: ci? (+ci.pain||0) : 0,
    sore: ci? (+ci.soreness||0) : 0,
    soreArea: (ci&&ci.soreArea)||"none",
    energy: ci? (+ci.energy||6) : 6,
    pelvic: (ci && Array.isArray(ci.pelvic) && ci.pelvic.length)? true : false,
    equip: equipToday(ci),
    blocked: c.blocked||{},
    prefs: DB.exPrefs||{},
    recent2, prevSet,
    weekGaps: weekGaps(date),
    daysLeft: daysLeftThisWeek(date),
    prevExercises: prev.length? exercisesIn(prev[0]) : [],
    usage: usageMap(date),
    shown: shownMap(date),
    lastFeedback: fb,
    history10: perf,
    nonce: c.nonce||0
  };
}

/* ---------- the week, not just the day ----------
   A session that ignores the rest of the week can leave her pulling four
   days running and never pressing. This is what the week has covered so far,
   what is still to come, and what is missing. */
const WEEK_TARGET = { squat:1, hinge:1, lunge:1, glute:2, push:1, pull:2, core:2, conditioning:1 };
function weekDays(dateISO){
  const start=weekStart(dateISO||today());
  return [0,1,2,3,4,5,6].map(i=>addDays(start,i));
}
/* Counted in DAYS, not exercises: one back session covers four pulls, which
   is not the same as pulling twice in a week. */
function weekBalance(dateISO){
  const d=dateISO||today();
  const bal={};
  weekDays(d).filter(k=>k<=d).forEach(k=>{
    const s=(DB.sessions||{})[k];
    if(!s||s.rest||s.deleted) return;
    const seen=new Set(exercisesIn(s).map(catOf));
    seen.forEach(c=>{ bal[c]=(bal[c]||0)+1; });
  });
  return bal;
}
function weekGaps(dateISO){
  const bal=weekBalance(dateISO);
  return Object.keys(WEEK_TARGET).filter(c=>(bal[c]||0) < WEEK_TARGET[c]);
}
/* How many training days are left after this one, so the engine knows
   whether a gap still has somewhere to go. */
function daysLeftThisWeek(dateISO){
  const d=dateISO||today();
  return weekDays(d).filter(k=>k>d && !isRestDay(k)).length;
}
function weekAhead(dateISO){
  const d=dateISO||today();
  return weekDays(d).map(k=>{
    const s=(DB.sessions||{})[k];
    const p=dayPlan(k);
    return { date:uk(k), day:DOW[dowOf(k)], rest:isRestDay(k),
             title:(s&&!s.deleted? s.title : (p? p.title : "Rest")),
             done:!!(s&&s.state&&s.state.finished), past:k<d, today:k===d };
  });
}

/* ---------- candidate filtering ---------- */
function slotCandidates(slot,ctx,taken){
  const focusOK = slot.cat;
  return allNames().filter(nm=>{
    const e=EX(nm); if(!e) return false;
    if(UNAVAILABLE.test(nm)) return false;
    if(taken.has(nm)) return false;
    if(catOf(nm)!==focusOK) return false;
    if(!ctx.equip.has(e.eq||"bw")) return false;
    if(ctx.blocked[nm]) return false;
    if((ctx.prefs[nm]||{}).avoid) return false;
    if(ctx.neck>=5 && ((e.tags||[]).includes("overhead")||(e.tags||[]).includes("neck-sensitive"))) return false;
    if((ctx.pelvic||ctx.pain>=5) && (e.tags||[]).includes("impact")) return false;
    /* a loaded compound is only ever replaced by something else we can load */
    if(slot.loaded && !isLoadable(nm)) return false;
    if(!slot.loaded && slot.timed && !isTimed(nm) && !(e.tags||[]).includes("floor")) return false;
    return true;
  });
}

/* ---------- scoring ----------
   Variety with a reason. Novelty is worth something; never having repeated
   a movement she is progressing on is worth more. */
function scoreCandidate(nm,slot,ctx){
  const e=EX(nm)||{}, seed=EX(slot.seed)||{};
  const c=coach();
  const anchor=c.anchors[slot.key];
  let s=0;
  if(slot.role==="anchor" && anchor && anchor.ex===nm) s+=40;
  if(e.pat===slot.pat) s+=12;
  if(nm===slot.seed) s += slot.role==="anchor"? 22 : 4;
  if(ctx.week===1 && nm===slot.seed) s+=10;      /* week one is the baseline */
  const rot=buildMode().rotate;
  const last=ctx.usage[nm];
  if(!last) s += 8*rot;
  else {
    const ago=daysBetween(last,ctx.date);
    s += Math.min(ago,60)/4*rot;
    if(ago<14) s -= (14-ago)*2.5*rot;            /* seen this fortnight — let it rest */
  }
  const shown=ctx.shown[nm];
  if(shown){
    const sAgo=daysBetween(shown,ctx.date);
    if(sAgo<14) s -= (14-sAgo)*1.5*rot;        /* she has seen it lately, done or not */
  }
  if(ctx.recent2.has(nm)) s-=50;
  if(ctx.prevSet.has(nm)) s-=25;
  /* a movement at the top of its chain is earned, not handed out */
  if(isAdvanced(nm) && !last && ctx.week<3) s-=14;
  if(isAdvanced(nm) && ctx.energy<=4) s-=8;
  if(slot.circuit){
    if(!CIRCUIT_EQ.includes(e.eq||"bw")) s-=16;  /* keep circuits off the rack */
    if((e.tags||[]).includes("impact")) s-=10;   /* low impact, by design */
  }
  const st=(c.exStats||{})[nm]||{};
  s += (st.loved||0)*5 - (st.disliked||0)*6 - Math.max(0,(st.skipped||0)-(st.done||0))*8;
  s -= (st.inDisliked||0)*2;                   /* it was in a session she thumbed down */
  if((ctx.prefs[nm]||{}).love) s+=5;
  /* something she already has numbers on is worth more than a fresh face
     when the point is to get stronger */
  /* Familiarity is worth something — but it saturates, or a movement she has
     done often would keep winning simply because she has done it often. */
  const done=(c.exStats[nm]||{}).done||0;
  if(done) s += Math.min(done,4)*(1.5/Math.max(rot,0.4));
  /* the week is short of this pattern and running out of days to fix it.
     Kept small: it is there to tip a close call toward the missing category,
     not to override how recently she did the movement. */
  if((ctx.weekGaps||[]).includes(catOf(nm))) s += ctx.daysLeft<=1? 8 : 4;
  if((DB.prefs.favourEquipment||[]).includes(e.eq)) s+=4;
  if(hasRealMedia(nm)) s+=3;
  if(ctx.pelvic && (e.tags||[]).includes("pelvic-safe")) s+=4;
  /* week three reaches for the harder version, week four for the kinder one */
  if(ctx.week===3 && seed.harder===nm) s+=6;
  if(ctx.week===4 && seed.easier===nm) s+=6;
  if(ctx.energy<=3 && seed.easier===nm) s+=5;
  if(ctx.energy>=9 && seed.harder===nm) s+=4;
  s += jitter(ctx.date+"|"+slot.key+"|"+nm+"|"+ctx.nonce)*5;
  return s;
}
const NEIGHBOUR = {
  squat:["lunge"], lunge:["squat"], hinge:["glute"], glute:["hinge"],
  core:["mobility"], mobility:["core"], conditioning:["lunge","core"],
  accessory:["push","pull"], push:["accessory"], pull:["accessory"]
};
function pickForSlot(slot,ctx,taken){
  let cands=slotCandidates(slot,ctx,taken);
  /* everything left is something she did in the last two sessions — widen
     into the neighbouring category before repeating herself */
  if(cands.length && cands.every(n=>ctx.recent2.has(n))){
    (NEIGHBOUR[slot.cat]||[]).forEach(alt=>{
      const wider=slotCandidates({...slot,cat:alt},ctx,taken).filter(n=>!ctx.recent2.has(n));
      cands=cands.concat(wider);
    });
  }
  /* still nothing — she may have only her body today, and the slot wanted a
     barbell. Drop the loaded requirement before dropping the movement. */
  if(!cands.length) cands=slotCandidates({...slot,loaded:false,timed:false},ctx,taken);
  if(!cands.length){
    (NEIGHBOUR[slot.cat]||[]).forEach(alt=>{
      cands=cands.concat(slotCandidates({...slot,cat:alt,loaded:false,timed:false},ctx,taken));
    });
  }
  if(!cands.length){
    /* the template movement, but only if she can actually do it today */
    const e=EX(slot.seed);
    if(e && ctx.equip.has(e.eq||"bw") && !ctx.blocked[slot.seed] && !(ctx.prefs[slot.seed]||{}).avoid
       && !taken.has(slot.seed)) return slot.seed;
    return null;   /* the caller drops the slot rather than prescribe the impossible */
  }
  cands.sort((a,b)=>scoreCandidate(b,slot,ctx)-scoreCandidate(a,slot,ctx));
  return cands[0];
}

/* ---------- progression ----------
   One variable at a time, and the variable rotates. Reps until they are
   high, then load and reps back to the floor; a timed movement grows its
   interval. Feedback overrules the schedule. */
const REP_CEIL = 15, REP_FLOOR = 8;
function progressionFor(ex,slot,ctx){
  const base = {reps:slot.reps, time:slot.time, why:null, kind:null};
  if(ctx.week===1) return base;                     /* week one is the baseline */
  const c=coach();
  const fb=ctx.lastFeedback;
  const st=(c.progress||{})[ex]||{};
  const hard = fb && fb.effort==="hard";
  const easy = fb && fb.effort==="easy";

  /* week four is the lighter week: back to the baseline, volume comes off
     in buildSession rather than here */
  if(ctx.week===4) return {...base, why:"lighter week", kind:"deload"};

  const step = (ctx.week===3? 2 : 1) + (easy?1:0) - (hard?1:0);
  if(step<=0) return {...base, why: hard? "you said last session was hard":null, kind:hard?"hold":null};

  if(typeof base.time==="number"){
    const t=clamp(Math.round(base.time + step*5), 15, 120);
    return {...base, time:t, kind:"interval",
      why: t>base.time? ("holding "+t+"s instead of "+base.time+"s") : null};
  }
  if(typeof base.reps==="number"){
    const lastVar=st.lastVar;
    const loaded=isLoadable(ex);
    /* reps have topped out and we can add weight instead — that is the
       one change this week, so reps go back to the bottom of the range */
    if(loaded && base.reps+step > REP_CEIL && lastVar!=="load"){
      return {...base, reps:REP_FLOOR, kind:"load",
        why:"reps are at the top, so the weight goes up and the reps reset"};
    }
    const r=clamp(base.reps+step, REP_FLOOR, REP_CEIL);
    if(r===base.reps) return base;
    return {...base, reps:r, kind:"reps", why:base.reps+" to "+r+" reps"};
  }
  return base;
}
function noteProgress(ex,kind){
  if(!kind || kind==="deload") return;
  const c=coach();
  c.progress[ex]={...(c.progress[ex]||{}), lastVar:kind, at:today()};
}

/* ---------- the day, possibly overridden ----------
   "Choose for me" uses the week. Anything else picks the day whose shape
   fits what she asked for, keeping the day's own warm-up and cool-down. */
const FOCUS_DAY = { glutes:1, upper:2, legs:3, conditioning:4, core:5 };
/* the volume days are reachable on any day, whatever week she is on */
const FOCUS_BB  = { bbGlutes:"bbGlutes", bbBack:"bbBack", bbLegs:"bbLegs",
                    bbArms:"bbArms", bbFull:"bbFull" };
const FOCUS_LABEL = { auto:"Coach picks", glutes:"Glutes", upper:"Upper body",
                      legs:"Legs", core:"Core", mobility:"Mobility", conditioning:"Conditioning",
                      bbGlutes:"Glutes — volume", bbBack:"Back & shoulders — volume",
                      bbLegs:"Quads & hamstrings — volume", bbArms:"Chest, arms & core — volume",
                      bbFull:"Full body — volume" };
const MOBILITY_DAY = {
  key:"mob", tag:"Mobility", title:"Mobility & Breathing", focus:["mobility","deep-core"], kind:"mobility",
  full:[{label:"A",rounds:2,rest:30,flow:true,items:[
          {ex:"Cat-Cow",time:60},{ex:"Open Book",time:45,side:true},
          {ex:"World's Greatest Stretch",time:45,side:true},{ex:"Thread the Needle",time:45,side:true}]},
        {label:"B",rounds:2,rest:30,flow:true,items:[
          {ex:"90/90 Hip Switch",time:45},{ex:"Downward Dog",time:45},{ex:"Glute Stretch",time:45,side:true}]}],
  short:[{label:"A",rounds:1,rest:20,flow:true,items:[
          {ex:"Cat-Cow",time:60},{ex:"Open Book",time:45,side:true},{ex:"Glute Stretch",time:40,side:true}]}]
};
function planForDay(dateISO,ci){
  const base=dayPlan(dateISO);
  const want=(ci&&ci.focus)||"auto";
  if(want==="mobility") return MOBILITY_DAY;
  if(FOCUS_BB[want]) return BB_DAYS[FOCUS_BB[want]]||base;
  if(want!=="auto" && FOCUS_DAY[want]) return WEEK[FOCUS_DAY[want]]||base;
  /* she didn't ask, but she told us what is sore */
  if(base && ci){
    const sore=(ci.soreArea||"none");
    const legDay=(base.focus||[]).some(f=>["glutes","quads","hamstrings"].includes(f));
    if(sore==="legs" && legDay){
      /* alternate, so a sore week is not the same upper session on repeat */
      const prev=priorSessions(dateISO,1)[0];
      return (prev && prev.dayKey==="tue")? MOBILITY_DAY : WEEK[2];
    }
    if(sore==="upper" && (base.focus||[]).some(f=>["back","upper-back","chest","shoulders"].includes(f))) return WEEK[1];
    if(sore==="all" && (+ci.energy||6)<=4) return MOBILITY_DAY;
  }
  return base;
}

/* ---------- warm-up and cool-down, rotated ----------
   The neck work is fixed, because it is the point. The rest moves. */
function rotateList(list,seed,n){
  if(list.length<=n) return list.slice();
  const start=Math.floor(jitter(seed)*list.length);
  const out=[];
  for(let i=0;i<list.length && out.length<n;i++) out.push(list[(start+i)%list.length]);
  return out;
}
function buildCooldownV(focus,dateISO,nonce,blocks){
  const worked=new Set();
  (blocks||[]).forEach(b=>(b.items||[]).forEach(it=>worked.add(it.ex)));
  const usable=n=>!worked.has(n) && movementAllowed(n) && !!EX(n);
  /* stretch what she actually worked, hardest-worked muscle first: each of
     the top three gets its own stretch before anything else is considered */
  const muscles=topMuscles(blocks,4);
  const head=[];
  muscles.slice(0,3).forEach(m=>{
    const pick=(COOLDOWN_BY_MUSCLE[m]||[]).find(n=>!head.includes(n) && usable(n));
    if(pick) head.push(pick);
  });
  const names=[];
  const add=n=>{ if(!names.includes(n) && !head.includes(n) && usable(n)) names.push(n); };
  muscles.forEach(m=>(COOLDOWN_BY_MUSCLE[m]||[]).forEach(add));
  if(!muscles.length) (focus||[]).forEach(f=>(COOLDOWN_BY_FOCUS[f]||[]).forEach(add));
  ["Child's Pose","90/90 Breathing","Thread the Needle","Sphinx Pose","Open Book"].forEach(add);
  if(head.length+names.length<3){
    EX_NAMES.filter(n=>catOf(n)==="mobility" && usable(n) && !names.includes(n) && !head.includes(n))
      .slice(0,3-head.length-names.length).forEach(n=>names.push(n));
  }
  /* the stretch for each worked muscle is held; the tail rotates so the
     cool-down still varies week to week */
  const tail=rotateList(names,(dateISO||"")+"/cool/"+(nonce||0),Math.max(0,4-head.length));
  const picked=[...head,...tail].slice(0,4);
  const secs=(DB.prefs.cooldownSec||40);
  return picked.map(n=>{ const e=EX(n)||{};
    return newItem({ex:n,time:secs,side:(e.tags||[]).includes("unilateral")||/Stretch|Open Book|Thread/.test(n)}); });
}

/* ---------- the signature ----------
   Two sessions are "the same workout" when the same movements appear in the
   same order. That is what may not come round again inside a month. */
function sessionSignature(w){
  return (w.blocks||[]).map(b=>b.label+":"+b.items.map(i=>i.ex).join(">")).join("|");
}
function rememberSignature(w){
  const c=coach();
  c.sigs=(c.sigs||[]).filter(x=>daysBetween(x.date,w.date)<45 && x.date!==w.date);
  c.sigs.push({date:w.date, sig:sessionSignature(w)});
}

/* ---------- validation ----------
   Nothing reaches the screen without passing this, whether the engine or
   the coach proposed it. */
function overlapWithPrevious(w,ctx){
  const names=exercisesIn(w);
  if(!names.length || !ctx.prevExercises.length) return 0;
  const prev=new Set(ctx.prevExercises);
  return names.filter(n=>prev.has(n)).length/names.length;
}
function validateSession(w,ctx,opts){
  const issues=[];
  const c=coach();
  const seen=new Set();
  (w.blocks||[]).forEach(b=>b.items.forEach(it=>{
    const e=EX(it.ex);
    if(!e){ issues.push({code:"unknown",itemId:it.id,msg:it.ex+" is not in the catalogue"}); return; }
    if(seen.has(it.ex)) issues.push({code:"duplicate",itemId:it.id,msg:it.ex+" appears twice"});
    seen.add(it.ex);
    if(ctx.blocked[it.ex]) issues.push({code:"blocked",itemId:it.id,msg:it.ex+" is flagged for pain"});
    if((ctx.prefs[it.ex]||{}).avoid) issues.push({code:"avoided",itemId:it.id,msg:it.ex+" is on her avoid list"});
    if(!ctx.equip.has(e.eq||"bw")) issues.push({code:"equipment",itemId:it.id,msg:it.ex+" needs kit she hasn't got today"});
    if(ctx.neck>=5 && ((e.tags||[]).includes("overhead")||(e.tags||[]).includes("neck-sensitive")))
      issues.push({code:"neck",itemId:it.id,msg:it.ex+" loads the neck"});
    if(ctx.recent2.has(it.ex) && it.role!=="anchor")
      issues.push({code:"recent",itemId:it.id,msg:it.ex+" was in one of the last two sessions"});
  }));
  const ov=overlapWithPrevious(w,ctx);
  if(ov>0.4) issues.push({code:"overlap",msg:Math.round(ov*100)+"% of this session was in the last one"});
  const sig=sessionSignature(w);
  if(isRejected(sig)) issues.push({code:"rejected",msg:"she gave this session a thumbs down"});
  if(!(opts&&opts.replay) && (c.sigs||[]).some(x=>x.sig===sig && x.date!==w.date && daysBetween(x.date,w.date)<30))
    issues.push({code:"repeat",msg:"this exact session ran inside the last 30 days"});
  const mins=estimateMinutes(w);
  if(w.targetMins && Math.abs(mins-w.targetMins) > Math.max(8,w.targetMins*0.25))
    issues.push({code:"duration",msg:mins+" minutes against a target of "+w.targetMins});
  return issues;
}

/* Re-pick whatever failed, a bounded number of times, then accept what is
   left rather than hand her an empty screen. */
function repairSession(w,ctx,opts){
  for(let pass=0; pass<4; pass++){
    const issues=validateSession(w,ctx,opts);
    const fixable=issues.filter(i=>i.itemId);
    const structural=issues.filter(i=>i.code==="overlap"||i.code==="repeat");
    if(!fixable.length && !structural.length) return issues;
    const taken=new Set(exercisesIn(w));
    let changed=false;
    const retry=(it,block)=>{
      const slot=it.slot? {...it.slot} : null;
      if(!slot) return;
      taken.delete(it.ex);
      const banned=new Set([...taken, it.ex]);
      const alt=pickForSlot(slot,ctx,banned);
      if(alt && alt!==it.ex){
        const e=EX(alt)||{};
        it.ex=alt; it.load=e.load||"bw"; it.weight=null;
        const s=suggestLoad(alt); if(s) it.weight=s.kg;
        taken.add(alt); changed=true;
      } else { taken.add(it.ex); }
    };
    fixable.forEach(i=>{
      (w.blocks||[]).forEach(b=>{ const it=b.items.find(x=>x.id===i.itemId); if(it) retry(it,b); });
    });
    if(!changed && structural.length){
      /* the whole shape came round again — rotate the accessories hardest */
      (w.blocks||[]).forEach(b=>b.items.forEach(it=>{ if(it.role!=="anchor") retry(it,b); }));
      /* still the same session: then even the held lifts give way */
      if(!changed) (w.blocks||[]).forEach(b=>b.items.forEach(it=>{
        if(it.role==="anchor"){ it.role="accessory"; retry(it,b); }
      }));
    }
    if(!changed) break;
    w.mins=estimateMinutes(w);
  }
  return validateSession(w,ctx,opts);
}


/* ---------- what she says afterwards ----------
   Three taps at the end of a session, and every one of them changes the
   next one. Nothing here is advice; it is all arithmetic on her own words. */
function blockExercise(ex,why){
  if(!EX(ex)) return false;
  coach().blocked[ex]={why:why||"pain reported", since:today()};
  save(); return true;
}
function unblockExercise(ex){ delete coach().blocked[ex]; save(); }
function blockedList(){ const b=coach().blocked||{}; return Object.keys(b).map(ex=>({ex,...b[ex]})); }
function noteSkipped(ex){ exStat(ex).skipped++; save(); }
function noteDone(ex){ exStat(ex).done++; save(); }

function feedbackFor(date){ return (coach().feedback||[]).find(f=>f.date===date)||null; }
function recordFeedback(w,fb){
  const c=coach();
  const one=v=>v? (Array.isArray(v)?v:[v]).filter(Boolean) : [];
  /* answering again replaces the first answer rather than stacking on it */
  const prev=feedbackFor(w.date);
  if(prev){
    (prev.loved||[]).forEach(ex=>{ const st=c.exStats[ex]; if(st) st.loved=Math.max(0,(st.loved||0)-1); });
    (prev.disliked||[]).forEach(ex=>{ const st=c.exStats[ex]; if(st) st.disliked=Math.max(0,(st.disliked||0)-1); });
    (prev.pain||[]).forEach(ex=>{ if(c.blocked[ex] && c.blocked[ex].from===w.date) delete c.blocked[ex]; });
  }
  const rec={ date:w.date,
              effort: fb.effort!==undefined? fb.effort : ((prev&&prev.effort)||null),
              rating: fb.rating!==undefined? fb.rating : (prev&&prev.rating)||null,
              pain:one(fb.painEx||fb.pain), loved:one(fb.loved), disliked:one(fb.disliked),
              at:Date.now() };
  c.feedback=(c.feedback||[]).filter(f=>f.date!==w.date);
  c.feedback.push(rec);
  if(c.feedback.length>60) c.feedback=c.feedback.slice(-60);
  rec.loved.forEach(ex=>{ if(EX(ex)){ exStat(ex).loved++; DB.exPrefs[ex]={...(DB.exPrefs[ex]||{}),love:true}; } });
  rec.disliked.forEach(ex=>{ if(EX(ex)) exStat(ex).disliked++; });
  rec.pain.forEach(ex=>{ if(blockExercise(ex,"it hurt on "+uk(w.date))) c.blocked[ex].from=w.date; });
  save();
  return rec;
}

/* One short question, once, about the movement she keeps stepping past —
   rather than prescribing it again and again and hoping. */
function skipQuestion(){
  const c=coach();
  const stats=c.exStats||{};
  const ex=Object.keys(stats).find(n=>{
    const st=stats[n];
    return st.skipped>=3 && st.skipped>st.done && !c.asked[n] && EX(n) && !c.blocked[n];
  });
  return ex||null;
}
function answerSkip(ex,answer){
  const c=coach();
  c.asked[ex]=today();
  if(answer==="hurts") blockExercise(ex,"she said it hurts");
  else if(answer==="hate"){ exStat(ex).disliked+=2; }
  else if(answer==="hard"){ const e=EX(ex); if(e&&e.easier&&EX(e.easier)) DB.exPrefs[e.easier]={...(DB.exPrefs[e.easier]||{}),love:true}; exStat(ex).disliked++; }
  save(); closeSheet(); toast("Noted — you'll see less of it");
  if(CUR==="train") renderTrain();
}

/* ---------- thumbs up, thumbs down ----------
   The three-way question at the end is about intensity. This one is about
   whether she wants the session back at all, and it overrules the rotation
   rules in both directions — she asked, so the engine does as it is told.

   Up   : keep this exact session for the rest of the block and run it again
          with more weight each time.
   Down : this combination never gets built again, and the movements that
          were only in it lose a little ground. */
function sessionShape(w){
  return {
    sig: sessionSignature(w),
    title:w.title, tag:w.tag, kind:w.kind, focus:w.focus, dayKey:w.dayKey,
    duration:w.duration, targetMins:w.targetMins, mode:w.mode,
    blocks:(w.blocks||[]).map(b=>({
      label:b.label, rounds:b.rounds, rest:b.rest, flow:!!b.flow, straight:!!b.straight,
      items:b.items.map(i=>({ ex:i.ex, reps:i.reps, time:i.time, side:!!i.side,
                              weight:i.weight, role:i.role, cat:i.cat, slot:i.slot }))
    }))
  };
}
/* The heaviest set she actually completed on a movement, so a repeat steps
   up from what happened rather than from what was written. */
function achievedWeight(ex,dateISO){
  const e=(history(ex)||[]).find(x=>x.date===dateISO);
  if(!e) return null;
  let best=0;
  (e.sets||[]).forEach(st=>{ if((st.w||0)>best) best=st.w||0; });
  return best||null;
}
function loadStep(kg){ return kg<10? 0.5 : kg<30? 1.25 : 2.5; }
function likeSession(w){
  const c=coach();
  const shape=sessionShape(w);
  /* record what she actually lifted, so next week starts from the truth */
  shape.blocks.forEach(b=>b.items.forEach(i=>{
    const got=achievedWeight(i.ex,w.date);
    if(got) i.weight=got;
  }));
  const prev=c.favourites[w.dayKey];
  shape.since = (prev && prev.sig===shape.sig)? prev.since : w.date;
  shape.runs  = (prev && prev.sig===shape.sig)? (prev.runs||1)+1 : 1;
  shape.liked = w.date;
  c.favourites[w.dayKey]=shape;
  c.rejected=(c.rejected||[]).filter(r=>r.sig!==shape.sig);
  save();
  return shape;
}
function dislikeSession(w){
  const c=coach();
  const sig=sessionSignature(w);
  if(!(c.rejected||[]).some(r=>r.sig===sig))
    c.rejected.push({sig, title:w.title, date:w.date});
  if(c.rejected.length>80) c.rejected=c.rejected.slice(-80);
  /* if this was the session she had asked to keep, it is not any more */
  Object.keys(c.favourites||{}).forEach(k=>{ if(c.favourites[k].sig===sig) delete c.favourites[k]; });
  /* a whole session is a weak signal about any one movement, so it nudges
     rather than bans */
  exercisesIn(w).forEach(ex=>{ const st=exStat(ex); st.inDisliked=(st.inDisliked||0)+1; });
  save();
}
function clearRating(w){
  const c=coach();
  const sig=sessionSignature(w);
  c.rejected=(c.rejected||[]).filter(r=>r.sig!==sig);
  Object.keys(c.favourites||{}).forEach(k=>{ if(c.favourites[k].sig===sig) delete c.favourites[k]; });
  save();
}
function isRejected(sig){ return (coach().rejected||[]).some(r=>r.sig===sig); }
/* A favourite is hers for the rest of the four-week block; then the block
   turns over and the rotation takes back the wheel. */
function favouriteFor(dateISO,plan){
  const c=coach();
  const f=c.favourites[plan&&plan.key];
  if(!f) return null;
  if(daysBetween(f.since,dateISO)>=buildMode().holdDays){ delete c.favourites[plan.key]; return null; }
  if(daysBetween(f.liked,dateISO)<1) return null;   /* not on the day she liked it */
  return f;
}
/* The heaviest she has lifted on a movement before a given day. */
function latestWeight(ex,beforeISO){
  const e=lastBefore(ex,beforeISO);
  const t=topSet(e);
  return (t&&t.w)||null;
}
/* Rebuild a liked session, one step heavier everywhere it can be loaded.
   Each repeat steps up from the last time she actually did it, so the weight
   compounds week by week instead of adding the same kilo for ever. */
function replayFavourite(f,dateISO){
  const lifted=[];
  const blocks=f.blocks.map(b=>({
    label:b.label, rounds:b.rounds, rest:b.rest, flow:b.flow, straight:b.straight,
    items:b.items.map(src=>{
      if(!EX(src.ex)) return null;
      const it=newItem({ex:src.ex, reps:src.reps, time:src.time, side:src.side});
      it.slot=src.slot; it.role=src.role; it.cat=src.cat;
      const base = latestWeight(src.ex,dateISO) || achievedWeight(src.ex,f.liked) || src.weight || it.weight;
      if(base && isLoadable(src.ex)){
        it.weight = roundLoad(base + loadStep(base));
        it.progressKind="load";
        it.progressWhy = kgTxt(base)+" to "+kgTxt(it.weight);
        lifted.push({ex:src.ex, from:base, to:it.weight});
      } else if(base){ it.weight=base; }
      return it;
    }).filter(Boolean)
  })).filter(b=>b.items.length);
  return {blocks, lifted};
}

/* ---------- why this workout ----------
   Three short reasons, each from something real. */
function buildWhy(w,ctx,kept,rotated){
  /* In priority order, then the best three. Something true always comes
     first; the filler only appears when there is nothing better to say. */
  const out=[];
  const add=t=>{ if(t && !out.includes(t)) out.push(t); };

  const repeated=(w.issues||[]).filter(i=>i.code==="recent");
  if(repeated.length) add("You've trained this pattern several days running, so "+
    plural(repeated.length,"movement")+" had to come round again — there aren't more to rotate through.");

  if(ctx.soreArea==="legs") add("Your legs are sore, so today leans on the upper body and core.");
  else if(ctx.soreArea==="upper") add("Your upper body is sore, so today is legs and glutes.");
  if(ctx.pain>=5 || ctx.pelvic) add("You reported discomfort, so the pressure and impact work is out.");
  if(ctx.neck>=4) add("The neck was tight at check-in, so the overhead loading is out.");

  if(kept.length){
    const k=kept[0];
    add("Keeping "+k.ex+(k.why? " so you can go "+k.why : " so we can measure the progress")+".");
  }
  if(ctx.lastFeedback && ctx.lastFeedback.effort==="easy") add("Last session felt easy, so the working numbers went up.");
  else if(ctx.lastFeedback && ctx.lastFeedback.effort==="hard") add("Last session felt hard, so nothing new gets added today.");
  else if(ctx.energy<=3) add("You checked in low, so the volume is down and the rests are longer.");

  const balanced=(w.blocks||[]).flatMap(b=>b.items).filter(i=>i.balance);
  if(balanced.length) add("Last day of the week and you hadn't done any "+
    catLabel(balanced[0].cat).toLowerCase()+", so "+balanced[0].ex+" goes in.");
  else {
    const filled=(ctx.weekGaps||[]).filter(g=>
      (w.blocks||[]).some(b=>b.items.some(i=>i.cat===g)));
    if(filled.length) add("Your week was short of "+
      filled.slice(0,2).map(g=>catLabel(g).toLowerCase()).join(" and ")+", so today covers it.");
  }
  add(BLOCK_NOTE[ctx.week]);
  if(rotated.length) add(plural(rotated.length,"accessory movement")+" changed — you did the others this week.");
  if(w.targetMins) add("Built to about "+w.mins+" minutes, which is what you asked for.");
  return out.slice(0,3);
}


/* =====================================================================
   THE ENGINE
   Everything that CHANGES state is decided here, in code. The model is
   asked to judge and to phrase, never to act. That is the one lesson
   the first app paid for.
   ===================================================================== */

/* ---------- performance history ---------- */
function history(ex){ return (DB.strength||{})[ex]||[]; }
function lastEntry(ex){
  const h=history(ex).filter(e=>e.date<today()||true);
  if(!h.length) return null;
  const sorted=[...h].sort((a,b)=>a.date<b.date?1:-1);
  return sorted[0];
}
function lastBefore(ex,dateISO){
  const h=history(ex).filter(e=>e.date<dateISO);
  if(!h.length) return null;
  return [...h].sort((a,b)=>a.date<b.date?1:-1)[0];
}
function topSet(entry){
  if(!entry||!entry.sets||!entry.sets.length) return null;
  return entry.sets.reduce((best,s)=>{
    if(!best) return s;
    if((s.w||0)>(best.w||0)) return s;
    if((s.w||0)===(best.w||0) && (s.r||0)>(best.r||0)) return s;
    return best;
  },null);
}
/* One place that turns a logged set into words. */
function setText(t){
  if(!t) return "—";
  if(t.sec) return t.sec+"s";
  if(t.w) return kgTxt(t.w)+" × "+(t.r||0);
  if(t.r) return t.r+" reps";
  if(t.txt) return t.txt;
  return "done";
}
function lastPerformanceText(ex,dateISO){
  const e=lastBefore(ex,dateISO||today()); if(!e) return "";
  const t=topSet(e); if(!t) return "";
  const txt=setText(t);
  if(txt==="—") return "";
  return "Last time: "+txt+" · "+ukShort(e.date);
}
function bestEver(ex){
  let best=null;
  history(ex).forEach(e=>{ const t=topSet(e); if(!t) return;
    if(!best || (t.w||0)>(best.w||0) || ((t.w||0)===(best.w||0)&&(t.r||0)>(best.r||0))) best={...t,date:e.date}; });
  return best;
}

/* Suggested load. It is a SUGGESTION. Nothing here ever raises the
   prescribed weight on its own — Lia confirms every increase. */
/* ---------- carrying strength across a rotation ----------
   Rotation is worth nothing if every new movement starts from a generic
   table. When she has never done this one, look at what she is lifting on
   its close relatives — the same movement pattern with the same equipment —
   and start there instead, adjusted for one leg or two. */
function relatedLoad(ex,dateISO){
  const e=EX(ex); if(!e||e.load!=="kg") return null;
  const d=dateISO||today();
  let best=null;
  EX_NAMES.forEach(nm=>{
    if(nm===ex) return;
    const c=EXDB[nm];
    /* the same pattern at the same station is comparable; across equipment
       it is not, and guessing there would put a barbell number on a dumbbell */
    if(c.pat!==e.pat || c.eq!==e.eq || c.load!=="kg") return;
    const prev=lastBefore(nm,d); const t=topSet(prev);
    if(!t||!t.w) return;
    if(!best || prev.date>best.date) best={from:nm, kg:t.w, reps:t.r, date:prev.date};
  });
  if(!best) return null;
  /* The number she logs is the weight on the implement, not the total work,
     so a one-arm row and a two-arm row start from the same dumbbell. Carry it
     across unchanged — but a step down if the new movement is the harder
     version of the one she has been doing. */
  /* Her own logged number is already a weight that exists in the room, so it
     carries across untouched. Only a number this code changes gets rounded. */
  let kg=best.kg;
  if((EXDB[best.from]||{}).harder===ex) kg=roundLoad(Math.max(0,kg-loadStep(kg)));
  if(!kg) return null;
  return { kg, from:best.from, date:best.date, estimate:true };
}
function suggestLoad(ex,dateISO){
  const e=EX(ex)||{};
  if(e.load!=="kg") return null;
  const prev=lastBefore(ex,dateISO||today());
  if(!prev){ return relatedLoad(ex,dateISO) || startingLoad(ex); }
  const t=topSet(prev); if(!t||!t.w) return relatedLoad(ex,dateISO) || startingLoad(ex);
  return { kg:t.w, prevReps:t.r, prevRpe:t.rpe, date:prev.date, ready:readyToAdd(ex,t) };
}
function readyToAdd(ex,t){
  /* Earned an increase when the last session hit the top of the rep range
     at an RPE of 7 or under. Shown as a question, never applied. */
  if(!t) return false;
  if((t.rpe||0)>7.5) return false;
  return (t.r||0)>=12 || ((t.rpe||0)>0 && (t.rpe||0)<=6.5 && (t.r||0)>=10);
}
const START_LOAD = {
  "Hip Thrust":20,"Romanian Deadlift":20,"Deadlift":25,"Sumo Deadlift":25,"Barbell Row":15,
  "Barbell Back Squat":20,"Front Squat":15,"Smith Squat":20,"Good Morning":15,"Kas Glute Bridge":20,
  "B-stance Hip Thrust":20,"Goblet Squat":8,"DB Romanian Deadlift":8,"Bulgarian Split Squat":6,
  "Split Squat":6,"Reverse Lunge":6,"Walking Lunge":6,"Curtsy Lunge":6,"Step-up":6,"Lateral Lunge":6,
  "DB Row":8,"Chest-supported DB Row":6,"DB Chest Press":7.5,"DB Floor Press":7.5,"DB Fly":4,
  "DB Shoulder Press":5,"Lateral Raise":3,"Reverse Fly":3,"DB Curl":5,"Hammer Curl":5,
  "Overhead Triceps Extension":6,"Suitcase Carry":10,"Farmer Carry":10,"Kettlebell Swing":12,
  "Landmine Press":10,"Landmine Row":10,"Single-leg Romanian Deadlift":6,"B-stance Romanian Deadlift":8,
  "Seated Cable Row":20,"Lat Pulldown":20,"Cable Kickback":5,"Cable Pull-Through":15,"Face Pull":10,
  "Straight-arm Pulldown":10,"Cable Chest Press":10,"Cable Curl":10,"Triceps Pushdown":10,
  "Cable Lateral Raise":3,"Cable Standing Abduction":5,"Pallof Press":10,"Half-kneeling Pallof Press":7.5,
  "Cable Woodchop":10,"Smith Bench Press":20,"DB Thruster":5,"Heel-elevated Goblet Squat":8
};
/* ---------- where a first weight comes from ----------
   The table above was written for a 65 kg lifter. Everything scales from her
   actual bodyweight, so the first suggestion is hers rather than a stranger's,
   and it moves if she does. Height only makes a small difference, and only on
   the lifts where a longer body genuinely means a longer path under the bar. */
const START_REF_KG = 65;
function bodyWeight(){
  const logged=(DB.weights||[]).slice(-1)[0];
  return (logged&&+logged.kg) || +((DB.profile||{}).weightKg) || START_REF_KG;
}
function leverFactor(ex){
  const e=EX(ex)||{};
  if(!/^(hinge|squat)$/.test(e.pat||"")) return 1;
  const h=+((DB.profile||{}).heightCm)||170;
  /* a taller lifter moves the bar further for the same rep — start a touch
     lighter, and never by more than a tenth either way */
  return clamp(1-(h-170)/100*0.5, 0.9, 1.1);
}
function startingLoad(ex){
  const ref=START_LOAD[ex];
  if(!ref) return null;
  const kg=roundLoad(ref/START_REF_KG*bodyWeight()*leverFactor(ex));
  if(!kg) return null;
  return { kg, estimate:true, fromBody:true };
}

/* ---------- readiness from the morning check-in ---------- */
function checkinOn(dateISO){ return (DB.checkins||{})[dateISO||today()]||null; }
function readiness(ci){
  if(!ci) return 70;
  const sleep=+ci.sleep||5, energy=+ci.energy||5, sore=+ci.soreness||0, stress=+ci.stress||0;
  let s = (sleep*6) + (energy*8) - (sore*3.5) - (stress*2.5);
  if((+ci.neck||0)>=5) s-=10;
  if((+ci.pain||0)>=5) s-=12;
  return clamp(Math.round(s),0,100);
}
function readinessLabel(n){ return n>=78?"Strong":n>=58?"Steady":n>=38?"Low":"Very low"; }

/* ---------- cycle ---------- */
function cycleSorted(){ return [...(DB.cycle.periods||[])].sort((a,b)=>a.start<b.start?1:-1); }
/* A period with no logged end is assumed to run for her average number of
   bleeding days, capped at ten. Without that cap one unfinished entry would
   leave the app thinking she is bleeding for the rest of the year. */
function periodEnd(p){
  if(p.end) return p.end;
  return addDays(p.start, Math.min(9,Math.max(2,(DB.cycle.avgBleed||5)-1)));
}
function currentPeriod(dateISO){
  const d=dateISO||today();
  return cycleSorted().find(p=>p.start<=d && periodEnd(p)>=d) || null;
}
function avgCycleLength(){
  const ps=cycleSorted().map(p=>p.start);
  if(ps.length<2) return DB.cycle.avgLength||28;
  const gaps=[]; for(let i=0;i<ps.length-1 && i<6;i++) gaps.push(daysBetween(ps[i+1],ps[i]));
  const ok=gaps.filter(g=>g>=18&&g<=45);
  if(!ok.length) return DB.cycle.avgLength||28;
  return Math.round(ok.reduce((a,b)=>a+b,0)/ok.length);
}
function cycleInfo(dateISO){
  const d=dateISO||today();
  const last=cycleSorted().find(p=>p.start<=d);
  if(!last) return {known:false,phase:null,day:null,estimate:true};
  const day=daysBetween(last.start,d)+1;
  const len=avgCycleLength();
  const bleeding=!!currentPeriod(d);
  let phase;
  if(bleeding) phase="menstrual";
  else if(day<=Math.round(len*0.46)) phase="follicular";
  else if(day<=Math.round(len*0.54)) phase="ovulatory";
  else phase="luteal";
  return {known:true,phase,day,len,bleeding,estimate:true,nextStart:addDays(last.start,len),
          daysToNext:daysBetween(d,addDays(last.start,len))};
}
const PHASE_LABEL={menstrual:"Period",follicular:"Follicular",ovulatory:"Ovulation window",luteal:"Luteal"};

/* ---------- neck ---------- */
function neckToday(){ const ci=checkinOn(today()); return ci? (+ci.neck||0) : 0; }
function neckTrend(days){
  const out=[]; for(let i=(days||30)-1;i>=0;i--){ const d=addDays(today(),-i); const ci=checkinOn(d);
    out.push({date:d, v: ci? (+ci.neck||0) : null}); }
  return out;
}
