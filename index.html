<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Train" />
<meta name="theme-color" content="#F4F6FA" />
<meta name="description" content="Train — a private personal-training app." />
<title>Train</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
<style>
:root{
  --bg:#F4F6FA; --bg-2:#E9EDF5; --surface:#FFFFFF; --surface-2:#F7F8FA;
  --ink:#14161C; --ink-2:#525A6A; --ink-3:#8A92A2; --ink-4:#AEB5C2;
  --line:#E4E9F2; --line-2:#F0F3F8;
  --blue:#1B62F5; --blue-ink:#1348C9; --blue-soft:#E8F0FF; --blue-line:#C2D6FF;
  --wave-1:#EAF1FF; --wave-2:#DCE8FF;
  --good:#12915C; --good-soft:#E6F5EE;
  --warn:#B4630E; --warn-soft:#FDF1E3;
  --bad:#C03A2F; --bad-soft:#FCEDEB;
  --rose:#A8477A; --rose-soft:#FBEDF4;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:14px; --r:18px; --r-lg:22px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(20,26,45,.05);
  --sh-2:0 1px 2px rgba(20,26,45,.04), 0 10px 26px -14px rgba(20,26,45,.22);
  --sh-3:0 2px 6px rgba(20,26,45,.06), 0 24px 48px -22px rgba(20,26,45,.30);
  --ease:cubic-bezier(.23,1,.32,1);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --font:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:16px;line-height:1.55;overscroll-behavior-y:none;}
body{max-width:1120px;margin:0 auto;min-height:100dvh;position:relative;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{border:none;background:none;cursor:pointer;padding:0;}
a{color:var(--blue);text-underline-offset:2px;}
::-webkit-scrollbar{width:0;height:0;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- layout ---------- */
#app{padding:calc(var(--safe-top) + 14px) 18px calc(112px + var(--safe-bot));}
@media(min-width:900px){ #app{padding-left:40px;padding-right:40px;padding-bottom:64px;} }
.screen{display:none;}
.screen.active{display:block;animation:enter .28s var(--ease);}
@keyframes enter{from{opacity:0;transform:translateY(6px) scale(.995);}to{opacity:1;transform:none;}}
.stack{display:flex;flex-direction:column;gap:var(--s4);}
.stack-lg{display:flex;flex-direction:column;gap:var(--s5);}
.row{display:flex;align-items:center;gap:var(--s3);}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.grow{flex:1 1 auto;min-width:0;}

/* ---------- type ---------- */
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance;}
h1{font-size:clamp(26px,7vw,34px);line-height:1.1;letter-spacing:-.03em;}
h2{font-size:clamp(20px,4.4vw,24px);line-height:1.15;}
h3{font-size:17px;line-height:1.25;}
p{margin:0;text-wrap:pretty;}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.muted{color:var(--ink-2);}
.dim{color:var(--ink-3);}
.small{font-size:13.5px;}
.tiny{font-size:12px;}
.big-num{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px var(--s5);}
.topbar .date{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px;}
.mark{width:40px;height:40px;border-radius:12px;overflow:hidden;box-shadow:var(--sh-1);display:block;}
.mark img{width:100%;height:100%;object-fit:cover;display:block;}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5) var(--s4);box-shadow:var(--sh-2);}
.card.pad-lg{padding:var(--s5);}
.card.tight{padding:var(--s4);}
.card.flat{box-shadow:none;border:1px solid var(--line);}
.hair{height:1px;background:var(--line-2);margin:var(--s4) 0;}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;
  min-height:54px;padding:0 var(--s5);border-radius:var(--r);font-size:16px;font-weight:600;
  background:var(--blue);color:#fff;transition:transform .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
  box-shadow:0 1px 2px rgba(27,59,209,.28), 0 10px 22px -12px rgba(27,59,209,.55);letter-spacing:-.01em;}
.btn:active{transform:scale(.975);}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);border:1px solid var(--line);}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;border:1px solid var(--line);}
.btn.quiet{background:var(--bg-2);color:var(--ink);box-shadow:none;}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 var(--s4);border-radius:var(--r-sm);}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none;}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn svg{width:19px;height:19px;flex:0 0 auto;}
.btn.loading{pointer-events:none;}
.btn.loading .lbl{opacity:.55;}
.btn-row{display:flex;gap:var(--s3);}
.btn-row .btn{flex:1;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  background:var(--bg-2);color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap;}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink);}
.chip.good{background:var(--good-soft);color:var(--good);}
.chip.warn{background:var(--warn-soft);color:var(--warn);}
.chip.bad{background:var(--bad-soft);color:var(--bad);}
.chip.rose{background:var(--rose-soft);color:var(--rose);}
.linkbtn{font-size:14px;font-weight:600;color:var(--blue);padding:8px 2px;}

/* ---------- segmented / sliders ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg-2);
  padding:5px;border-radius:var(--r);}
.seg button{min-height:46px;border-radius:11px;font-size:14.5px;font-weight:600;color:var(--ink-2);
  transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);}
.seg.blue button.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px -8px rgba(27,59,209,.8);}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.scale button{min-height:50px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:15px;
  color:var(--ink-2);transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease);}
.scale button.on{background:var(--blue);color:#fff;}
.scale button:active{transform:scale(.94);}
.ci-item{padding:var(--s4) 0;border-bottom:1px solid var(--line-2);}
.ci-item:last-of-type{border-bottom:none;}
.ci-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s3);gap:var(--s3);}
.ci-head .q{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.ci-head .v{font-size:13px;font-weight:600;color:var(--blue-ink);}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;}
.slider::-webkit-slider-runnable-track{height:10px;border-radius:999px;
  background:linear-gradient(90deg,var(--blue) var(--pct,50%),var(--bg-2) var(--pct,50%));}
.slider::-moz-range-track{height:10px;border-radius:999px;background:var(--bg-2);}
.slider::-moz-range-progress{height:10px;border-radius:999px;background:var(--blue);}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(20,26,45,.2),0 6px 14px -6px rgba(20,26,45,.4);margin-top:-10px;border:1px solid var(--line);}
.slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(20,26,45,.2);}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-4);font-weight:500;margin-top:-4px;}
.txtin{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px var(--s4);font-size:15.5px;transition:border-color .16s var(--ease),background .16s var(--ease);}
.txtin:focus{outline:none;border-color:var(--blue-line);background:var(--surface);}
textarea.txtin{min-height:88px;resize:vertical;line-height:1.5;}
.field{display:block;margin-bottom:var(--s4);}
.field > label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.45;}
.switch{width:50px;height:30px;border-radius:999px;background:var(--bg-2);position:relative;flex:0 0 auto;
  transition:background .2s var(--ease);cursor:pointer;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:transform .2s var(--ease);}
.switch.on{background:var(--blue);}
.switch.on::after{transform:translateX(20px);}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);}
.cal-nav button:active{transform:scale(.94);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-dow span{text-align:center;font-size:11px;font-weight:600;color:var(--ink-4);letter-spacing:.04em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2);
  position:relative;transition:background .16s var(--ease),transform .16s var(--ease);min-height:40px;}
.cal-cell:active{transform:scale(.92);}
.cal-cell.out{color:var(--ink-4);opacity:.5;}
.cal-cell.rest{color:var(--ink-4);}
.cal-cell.today{background:var(--ink);color:#fff;font-weight:600;}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--blue);}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--blue-line);}
.cal-dot.done{background:var(--good);}
.cal-dot.miss{background:var(--bad);}
.cal-dot.plan{background:var(--blue);}
.cal-cell.today .cal-dot{background:#fff;}
.cal-period{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--rose);}
.cal-pr{position:absolute;top:5px;left:6px;font-size:8px;color:var(--warn);font-weight:700;}
.cal-legend{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);margin-top:var(--s4);font-size:11.5px;color:var(--ink-3);}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px;}

/* ---------- media / exercise tiles ---------- */
.media{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--surface-2);}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;}
.media.ph{display:grid;place-items:center;background:linear-gradient(160deg,#EEF1F7,#E4E8F2);}
.media.ph svg{width:56%;height:56%;opacity:.5;}
.media .addmedia{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--ink-2);
  font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;box-shadow:var(--sh-1);}
.media.sm{aspect-ratio:1/1;border-radius:var(--r-sm);width:64px;flex:0 0 64px;}
.media.sm.ph svg{width:64%;height:64%;}

/* inline svg sizing — every icon inherits a size from its component */
.chip svg{width:14px;height:14px;flex:0 0 auto;}
.pick svg{width:20px;height:20px;flex:0 0 auto;color:var(--ink-4);}
.upnext .lab svg{width:15px;height:15px;}
.upnext .nm,.upnext .mt,.pick .nm,.pick .mt{display:block;}
.linkbtn svg{width:15px;height:15px;}
.cue .grow{display:block;}
.media.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
.media.ph{position:relative;}

/* ---------- hero with the soft wave ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,#F7FAFF 46%,var(--wave-1) 100%);
  border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:var(--s5);}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:96px;pointer-events:none;}
.hero .wave svg{width:100%;height:100%;display:block;}
.hero > *{position:relative;}
.hero-row{display:flex;align-items:center;gap:var(--s4);}
.hero-sun{width:44px;height:44px;flex:0 0 44px;}
.hero h2{font-size:21px;letter-spacing:-.025em;}
.hero .sub{font-size:15px;color:var(--ink-2);margin-top:2px;}
.fab{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(19,72,201,.3),0 14px 26px -12px rgba(19,72,201,.7);
  transition:transform .16s var(--ease);}
.fab:active{transform:scale(.94);}
.fab svg{width:22px;height:22px;}

/* ---------- week strip + day tiles ---------- */
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:var(--s4) 0 var(--s5);}
.weekdots .d{text-align:center;}
.weekdots .lb{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:9px;}
.weekdots .dot{width:16px;height:16px;border-radius:50%;margin:0 auto;background:var(--bg-2);
  transition:transform .2s var(--ease);}
.weekdots .dot.plan{background:var(--blue);}
.weekdots .dot.done{background:var(--good);}
.weekdots .dot.miss{background:var(--bad);}
.weekdots .d.today .dot{box-shadow:0 0 0 4px rgba(27,98,245,.16);transform:scale(1.12);}
.daytiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.daytile{background:var(--surface-2);border-radius:var(--r);padding:13px 14px;text-align:left;min-height:70px;
  display:flex;flex-direction:column;justify-content:center;transition:transform .16s var(--ease),background .16s var(--ease);}
.daytile:active{transform:scale(.97);}
.daytile .dy{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
.daytile .ds{font-size:13px;color:var(--ink-3);margin-top:1px;}
.daytile.on{background:var(--blue);}
.daytile.on .dy,.daytile.on .ds{color:#fff;}
.daytile.on .ds{color:rgba(255,255,255,.78);}
.daytile.off .dy,.daytile.off .ds{color:var(--ink-4);}
.daytile.done{background:var(--good-soft);}

/* ---------- the training screen ---------- */
.trainbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:var(--s4);}
.trainbar h2{text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.trainbar .count{text-align:right;font-size:15px;font-weight:600;color:var(--ink-2);}
.trainbar .xbtn{background:transparent;}
.bleed{margin-inline:-18px;}
.ec-media{position:relative;width:100%;aspect-ratio:4/3;max-height:44dvh;background:var(--surface-2);overflow:hidden;}
/* A body map earns less room than a real demonstration. Either way the
   Complete button has to stay above the fold on a phone. */
.ec-media.noshot{aspect-ratio:16/9;max-height:26dvh;}
.ec-media img,.ec-media video{width:100%;height:100%;object-fit:cover;display:block;}
.ec-media .media,.ec-media .media.ph{width:100%;height:100%;aspect-ratio:auto;border-radius:0;}
.ec-media .media.ph{background:linear-gradient(170deg,#F7FAFF 0%,var(--wave-1) 60%,var(--wave-2) 100%);}
.ec-media .media.ph svg{width:46%;height:46%;opacity:.85;}
.ec-media .media.ph figcaption{bottom:18px;font-size:11.5px;color:var(--ink-3);}
.ec-sheet{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-26px;padding:var(--s5) 18px var(--s4);
  position:relative;z-index:2;}
.ec-strip{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);}
.ec-strip .lab{font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.02em;}
.mini{display:flex;align-items:center;gap:2px;}
.mini button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);
  font-size:18px;font-weight:500;background:var(--surface-2);}
.mini button:active{background:var(--bg-2);}
.mini .v{min-width:74px;text-align:center;font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.mini .v small{color:var(--ink-3);font-weight:500;}
.ec-title{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.1;}
.ec-sub{font-size:15.5px;color:var(--ink-2);margin-top:6px;line-height:1.45;}
.ec-prev{font-size:13.5px;color:var(--ink-3);margin-top:8px;}
.restrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:var(--s4);color:var(--ink-2);}
.restrow svg{width:19px;height:19px;color:var(--ink-3);}
.restrow .t{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.restrow button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--blue);}
.quickrow{display:flex;gap:10px;margin-top:var(--s4);}
.quickrow button{flex:1;min-height:46px;border-radius:var(--r-sm);background:var(--surface-2);font-size:14px;
  font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;}
.quickrow button:active{transform:scale(.97);}
.quickrow svg{width:17px;height:17px;}
@media(min-width:900px){
  .bleed{margin-inline:0;}
  .ec-media{border-radius:var(--r-xl) var(--r-xl) 0 0;aspect-ratio:16/9;}
  .ec-sheet{border-radius:0 0 var(--r-xl) var(--r-xl);margin-top:0;box-shadow:var(--sh-2);}
}

/* ---------- workout ---------- */
.wo-hero{background:var(--surface);border-radius:var(--r-xl);padding:var(--s5);box-shadow:var(--sh-2);}
.prog-track{height:6px;border-radius:999px;background:var(--bg-2);overflow:hidden;}
.prog-track span{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .4s var(--ease);}
.blockbar{display:flex;gap:6px;margin-top:var(--s4);}
.blockbar .bb{flex:1;height:5px;border-radius:999px;background:var(--bg-2);overflow:hidden;}
.blockbar .bb span{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .35s var(--ease);}
.exercise-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);overflow:hidden;}
.ec-tag{position:absolute;left:14px;top:14px;display:flex;gap:6px;}
.ec-tag .t{background:rgba(20,22,28,.82);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.04em;
  padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px);}
.ec-body{padding:var(--s5) var(--s4) var(--s4);}
.ec-name{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.12;}
.ec-nums{display:flex;align-items:baseline;gap:var(--s3);margin-top:var(--s3);flex-wrap:wrap;}
.ec-nums .n{font-size:27px;font-weight:600;letter-spacing:-.03em;}
.ec-nums .x{font-size:17px;color:var(--ink-4);font-weight:500;}
.ec-last{font-size:13.5px;color:var(--ink-3);margin-top:6px;}
.cue{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border-radius:var(--r-sm);

.cue.neck{background:var(--blue-soft);color:var(--blue-ink);}

.adj{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:var(--r-sm);padding:5px;}

.stepper .val{flex:1;text-align:center;min-width:0;}
.stepper .val b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;}
.stepper .val small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:-2px;}
.ec-actions{display:flex;gap:var(--s3);margin-top:var(--s4);}
.ec-actions .btn{flex:1;}
.icon-btn{width:54px;min-height:54px;flex:0 0 54px;border-radius:var(--r);background:var(--surface);

.updeck{display:flex;flex-direction:column;gap:var(--s3);}

.upnext.done .nm{color:var(--ink-3);}
.upnext.done .check{background:var(--good);border-color:var(--good);color:#fff;}

/* rest overlay */
.restview{position:fixed;inset:0;z-index:80;background:rgba(241,242,245,.94);backdrop-filter:blur(14px);

.restview .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}

.restview .lab{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}

.scrim{position:fixed;inset:0;z-index:90;background:rgba(20,22,28,.32);opacity:0;pointer-events:none;

.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--surface);visibility:hidden;

.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s5) var(--s3);flex:0 0 auto;gap:var(--s3);}
.sheet-head h3{font-size:18px;letter-spacing:-.02em;}
.sheet-body{padding:0 var(--s5) calc(var(--s5) + var(--safe-bot));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.xbtn{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);}
.pick{display:flex;gap:var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s3);border-radius:var(--r);

.pick:active{transform:scale(.985);}
.pick .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.pick .mt{font-size:12.5px;color:var(--ink-3);margin-top:1px;}
.deflist dt{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:var(--s4);}
.deflist dd{margin:5px 0 0;font-size:15px;color:var(--ink-2);line-height:1.5;}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(5,1fr);

.tabbar button svg{width:24px;height:24px;}

.linechart{width:100%;height:110px;display:block;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}

.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0;}
.pr{background:linear-gradient(150deg,#14161C,#272B36);color:#fff;border-radius:var(--r-lg);padding:var(--s5);
  box-shadow:var(--sh-3);}
.pr .eyebrow{color:rgba(255,255,255,.6);}
.pr .nm{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:7px;}
.pr .v{font-size:16px;color:rgba(255,255,255,.8);margin-top:3px;}
.chatlog{display:flex;flex-direction:column;gap:var(--s3);padding-bottom:var(--s4);}
.msg{max-width:86%;padding:13px 16px;border-radius:18px;font-size:15px;line-height:1.5;}
.msg.coach{background:var(--surface);color:var(--ink);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--sh-1);}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px;}
.msg b{font-weight:600;}
.composer{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-bot));z-index:60;padding:0 18px;
  max-width:1120px;margin:0 auto;display:none;}
.composer.show{display:block;}
.composer .wrap{display:flex;gap:var(--s2);background:var(--surface);border-radius:var(--r);padding:6px;
  box-shadow:var(--sh-2);border:1px solid var(--line);}
.composer input{flex:1;border:none;background:none;padding:0 12px;min-height:46px;outline:none;font-size:15.5px;}
.composer .send{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;}
.listrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:16px 0;
  border-bottom:1px solid var(--line-2);width:100%;text-align:left;}
.listrow:last-child{border-bottom:none;}
.listrow .k{font-size:15px;font-weight:500;}
.listrow .v{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:8px;}
.listrow svg{width:17px;height:17px;color:var(--ink-4);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);}
.photo-grid figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);}
.photo-grid img{width:100%;height:100%;object-fit:cover;}
.photo-grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:10.5px;color:#fff;
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent);font-weight:600;}
@media(min-width:900px){
  .two-col{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s5);align-items:start;}
  .tabbar{border-radius:0;}
  .sheet{max-width:560px;border-radius:26px;bottom:24px;left:50%;right:auto;transform:translate(-50%,calc(100% + 48px));}
  .sheet.show{transform:translate(-50%,0);visibility:visible;}
  .composer{bottom:calc(80px + var(--safe-bot));padding:0 40px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>

const PROFILE_DEFAULT = {

/* ---------- tiny utils ---------- */
function today(){ const d=new Date(); return iso(d); }
function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
/* Day-first everywhere a human sees a date. Sort keys stay ISO and stay hidden. */
function uk(s){ if(!s) return "—"; const d=parseISO(s); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function ukLong(s){ const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function ukShort(s){ const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/864e5); }
function dowOf(s){ return parseISO(s).getDay(); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function el(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function plural(n,w){ return n+" "+w+(n===1?"":"s"); }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
function kgTxt(w){ if(w==null||w==="") return ""; return (Math.round(w*10)/10)+" kg"; }
function roundLoad(w){ const step = w<10 ? 0.5 : (w<30 ? 1.25 : 2.5); return Math.max(0, Math.round(w/step)*step); }

/* ---------- persistence ---------- */
let _idb=null;
function idbOpen(){ return new Promise(res=>{ try{
  const rq=indexedDB.open(IDB_NAME,1);
  rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null);
}catch(e){ res(null); } }); }
async function idbSet(v){ try{ if(!_idb)_idb=await idbOpen(); if(!_idb)return;
  _idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(v,STORE_KEY); }catch(e){} }
async function idbGet(){ try{ if(!_idb)_idb=await idbOpen(); if(!_idb)return null;
  return await new Promise(res=>{ const rq=_idb.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(STORE_KEY);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }); }catch(e){ return null; } }

function mergeDefaults(parsed){
  const d={...structuredClone(DEFAULTS),...(parsed||{})};
  for(const k of Object.keys(DEFAULTS)){
    if(d[k]==null) d[k]=structuredClone(DEFAULTS[k]);
    else if(!Array.isArray(DEFAULTS[k]) && typeof DEFAULTS[k]==="object")
      d[k]={...structuredClone(DEFAULTS[k]),...d[k]};
  }
  d.profile={...structuredClone(PROFILE_DEFAULT),...(parsed&&parsed.profile||{})};
  return d;
}
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return mergeDefaults(JSON.parse(raw)); }catch(e){ console.warn("load",e); }
  return mergeDefaults(null);
}
let _saveT=null, _dirty=false;
function save(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }catch(e){ console.warn("save",e); }
  idbSet(DB); _dirty=true;
  if(_saveT) clearTimeout(_saveT);
  _saveT=setTimeout(()=>{ if(DB.cloud&&DB.cloud.on) cloudPush(true); },2500);
}
let DB = load();

/* ---------- navigation ---------- */
let CUR="home"; const SCROLL={};
function go(name,opts){
  if(name===CUR && !(opts&&opts.force)){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  try{ SCROLL[CUR]=window.scrollY||0; }catch(e){}
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  const t=el("s-"+name); if(t) t.classList.add("active");
  CUR=name;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.s===name));
  el("composer").classList.toggle("show", name==="coach");
  render(name);
  requestAnimationFrame(()=>window.scrollTo({top:(opts&&opts.keepScroll)?(SCROLL[name]||0):0,behavior:"instant"}));
}
function render(name){
  try{
    if(name==="home") renderHome();
    else if(name==="train") renderTrain();
    else if(name==="progress") renderProgress();
    else if(name==="coach") renderChat();
    else if(name==="more") renderMore();
    else if(name==="cycle") renderCycle();
    else if(name==="library") renderLibrary();
    else if(name==="settings") renderSettings();
  }catch(e){ console.error("render "+name,e); toast("Something went wrong drawing that screen"); }
}
function refresh(){ render(CUR); }

let _toastT=null;
function toast(m){
  const t=el("toast"); t.textContent=m; t.classList.add("show");
  if(_toastT) clearTimeout(_toastT);
  _toastT=setTimeout(()=>t.classList.remove("show"),2800);
}

/* ---------- bottom sheet ---------- */
let _sheetOnClose=null;
function openSheet(title,html,onClose){
  el("sheetTitle").textContent=title;
  el("sheetBody").innerHTML=html;
  el("sheet").classList.add("show"); el("scrim").classList.add("show");
  _sheetOnClose=onClose||null;
  el("sheet").querySelectorAll("[data-slider]").forEach(paintSlider);
}
function closeSheet(){
  el("sheet").classList.remove("show"); el("scrim").classList.remove("show");
  const f=_sheetOnClose; _sheetOnClose=null; if(f) try{ f(); }catch(e){}
  /* Empty it once it is off screen: a closed sheet must not leave live
     buttons in the document for a screen reader or a stray tap. */
  setTimeout(()=>{ if(!sheetOpen()){ el("sheetBody").innerHTML=""; el("sheetTitle").textContent=""; } },320);
}
function sheetOpen(){ return el("sheet").classList.contains("show"); }

/* ---------- sound ---------- */
let _audio=null;
function beep(times){
  if(!(DB.prefs&&DB.prefs.sound)) return;
  try{
    if(!_audio){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; _audio=new C(); }
    if(_audio.state==="suspended") _audio.resume();
    const n=times||1;
    for(let i=0;i<n;i++){
      const o=_audio.createOscillator(), g=_audio.createGain();
      o.connect(g); g.connect(_audio.destination); o.type="sine"; o.frequency.value= i===n-1?1046:784;
      const t0=_audio.currentTime+i*0.26;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
      o.start(t0); o.stop(t0+0.34);
    }
  }catch(e){}
}
function unlockAudio(){ try{ if(!_audio){ const C=window.AudioContext||window.webkitAudioContext; if(C) _audio=new C(); }
  if(_audio&&_audio.state==="suspended") _audio.resume(); }catch(e){} }

function paintSlider(s){ const min=+s.min||0,max=+s.max||10; s.style.setProperty("--pct",((s.value-min)/(max-min)*100)+"%"); }

     '<rect x="38" y="25" width="24" height="6" rx="3" fill="'+on("shoulders")+'"/>'+
     '<path d="M37 32 h26 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 z" fill="'+on("chest")+'"/>'+

     '<rect x="66" y="33" width="8" height="20" rx="4" fill="'+on("arms")+'"/>'+

/* ---------- demonstration media ----------
   Photographs and clips live in the repo beside index.html, in a folder
   called demos. The file is named after the exercise, lower case with
   hyphens: "Hip Thrust" -> demos/hip-thrust.jpg.
   Only the names listed in DEMO_FILES are requested, so a phone never fires
   a hundred failed requests looking for files that aren't there. Adding a
   demonstration is two steps: drop the file in demos/, add the line here. */
function slugOf(name){ return String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
const DEMO_FILES = {
  /* "Hip Thrust":"jpg", */
};
function demoFile(name){
  const ext=DEMO_FILES[name];
  return ext? ("demos/"+slugOf(name)+"."+ext) : null;
}
function isVideo(url){ return /\.(mp4|webm|mov)(\?|$)/i.test(String(url||"")); }
function mediaFor(name){
  const o=(DB.media||{})[name]; if(o) return o;   /* one she pasted in herself */
  const f=demoFile(name); if(f) return f;          /* one in the repo */
  const e=EX(name); return (e&&e.gif)||null;       /* the built-in animation */
}
function mediaHTML(name,cls){
  const url=mediaFor(name), e=EX(name)||{};
  if(url && isVideo(url))
    return '<div class="media '+(cls||"")+'"><video src="'+esc(url)+'" autoplay muted loop playsinline '+
      'data-ex="'+esc(name)+'" onerror="mediaFailed(this)" aria-label="'+esc(name)+' demonstration"></video></div>';
  if(url) return '<div class="media '+(cls||"")+'"><img src="'+esc(url)+'" alt="'+esc(name)+' demonstration"'+
    ((cls||"").indexOf("sm")>=0?' loading="lazy"':'')+' data-ex="'+esc(name)+'" data-t="'+Date.now()+'" onerror="mediaFailed(this)" /></div>';
  const lab=(e.m||[]).slice(0,2).map(muscleLabel).join(" · ");
  return '<div class="media ph '+(cls||"")+'" data-ex="'+esc(name)+'">'+bodyMap(e.m||[])+
    ((cls||"").indexOf("sm")<0 && lab? '<figcaption>'+esc(lab)+'</figcaption>':'')+'</div>';
}
/* A demo that 404s becomes the body map rather than a broken image. */
function mediaFailed(img){
  try{
    const name=img.dataset.ex||"", e=EX(name)||{};
    const box=img.parentNode;
    box.classList.add("ph");
    const frame=box.closest(".ec-media"); if(frame) frame.classList.add("noshot");
    const lab=(e.m||[]).slice(0,2).map(muscleLabel).join(" · ");
    box.innerHTML=bodyMap(e.m||[])+(box.classList.contains("sm")||!lab?"":'<figcaption>'+esc(lab)+'</figcaption>');
  }catch(err){}
}

/* A demonstration is hosted elsewhere, so it can be slow or simply gone.
   onerror covers a refusal; this covers a request that never answers. */
setInterval(()=>{
  try{
    document.querySelectorAll("img[data-ex][data-t]").forEach(img=>{
      if(img.complete && img.naturalWidth>0) return;
      if(Date.now()-(+img.dataset.t||0) > 7000) mediaFailed(img);
    });
  }catch(e){}
}, 2500);

/* =====================================================================
   THE ENGINE
   Everything that CHANGES state is decided here, in code. The model is
   asked to judge and to phrase, never to act. That is the one lesson
   the first app paid for.
   ===================================================================== */

/* ---------- performance history ---------- */
function history(ex){ return (DB.strength||{})[ex]||[]; }
function lastEntry(ex){
  const h=history(ex).filter(e=>e.date<today()||true);
  if(!h.length) return null;
  const sorted=[...h].sort((a,b)=>a.date<b.date?1:-1);
  return sorted[0];
}
function lastBefore(ex,dateISO){
  const h=history(ex).filter(e=>e.date<dateISO);
  if(!h.length) return null;
  return [...h].sort((a,b)=>a.date<b.date?1:-1)[0];
}
function topSet(entry){
  if(!entry||!entry.sets||!entry.sets.length) return null;
  return entry.sets.reduce((best,s)=>{
    if(!best) return s;
    if((s.w||0)>(best.w||0)) return s;

  const ok=gaps.filter(g=>g>=18&&g<=45);

  const day=daysBetween(last.start,d)+1;

/* ---------- the adjustment engine ----------

   asked afterwards only to write the sentence Lia reads. */
function applyCheckin(w,ci){
  const ch=[];

  const neck=+ci.neck||0, pain=+ci.pain||0, energy=+ci.energy||5, sleep=+ci.sleep||5,
        sore=+ci.soreness||0, stress=+ci.stress||0;
  const r=readiness(ci);
  const cyc=cycleInfo(w.date);
  const pelvic = Array.isArray(ci.pelvic)? ci.pelvic : [];

  /* 1. time budget */
  if(ci.time==="short" && w.mode!=="short"){
    const nw=buildSession(w.date,"short");
    w.blocks=nw.blocks; w.mode="short"; w.prep=nw.prep; w.cooldown=nw.cooldown;
    ch.push("Short session — two blocks instead of three.");
  }

  /* 2. neck */
  if(neck>=4){
    let swapped=0;
    w.blocks.forEach(b=>b.items.forEach(it=>{
      const alt=NECK_SWAPS[it.ex];
      const risky = alt && (hasTag(it.ex,"overhead") || hasTag(it.ex,"neck-sensitive") || neck>=6);
      if(risky && EX(alt)){ swapItem(w,it.id,alt,"neck"); swapped++; }
    }));
    if(swapped) ch.push(neck>=6
      ? "Neck is loud today — overhead and neck-loading work is out, "+plural(swapped,"movement")+" swapped for supported versions."
      : "Overhead loading removed, "+plural(swapped,"movement")+" swapped for neck-friendlier options.");
    const extra=PREP_NECK_EXTRA.filter(p=>!w.prep.some(o=>o.ex===p.ex)).map(newItem);
    if(extra.length){ w.prep.splice(2,0,...extra); ch.push("Extra neck and thoracic preparation added."); }
  }
  if(neck>=8){
    w.blocks.forEach(b=>{ b.rounds=Math.max(2,(b.rounds||3)-1); b.rest=(b.rest||60)+15; });
    ch.push("Rounds reduced and rest extended while the neck settles.");
  }

  /* 3. pain and pelvic symptoms */
  if(pain>=5 || pelvic.length){
    let n=0;
    w.blocks.forEach(b=>b.items.forEach(it=>{
      const alt=PELVIC_SWAPS[it.ex];
      if(alt && EX(alt)){ swapItem(w,it.id,alt,"pelvic"); n++; }
    }));
    if(n) ch.push("Pressure and impact reduced — "+plural(n,"movement")+" changed for pelvic-safe versions.");
    if(!w.prep.some(p=>p.ex==="Connection Breath")) w.prep.unshift(newItem({ex:"Connection Breath",time:60}));
  }

  /* 4. readiness → volume */
  if(r<40){
    w.blocks.forEach(b=>{ if(!b.flow) b.rounds=Math.max(2,(b.rounds||3)-1); b.rest=(b.rest||60)+15; });
    ch.push("A round off each block and longer rests — the tank is low today.");
  } else if(r<58){
    const last=w.blocks.filter(b=>!b.flow).slice(-1)[0];
    if(last){ last.rounds=Math.max(2,(last.rounds||3)-1); ch.push("One round off the last block."); }
  } else if(r>=85 && w.mode==="full" && sore<4 && neck<4){
    ch.push("Everything green — this is a day to push the loads.");
  }

  /* 5. soreness in a trained area */
  if(sore>=7){
    w.blocks.forEach(b=>{ b.rest=(b.rest||60)+10; });
    ch.push("Rests extended for the soreness.");
  }

  /* 6. cycle — one input among several, never the whole story */
  if(DB.prefs.cycleOn && cyc.known){
    const sym=(ci.cycleSymptoms||[]);
    const heavy = sym.includes("cramps") || sym.includes("heavy") || (ci.cramps||0)>=5;
    if(cyc.bleeding && heavy && r<70){

      ch.push("Cramps reported and energy is down — volume trimmed, mobility kept.");
    } else if(cyc.phase==="luteal" && r<50){
      ch.push("Luteal phase and a low check-in — the loads stay where they were last week.");
    }
  }

  /* 7. recompute the clock */
  w.mins=estimateMinutes(w);
  w.adjustments=ch;
  w.checkinApplied=ci.id||true;
  w.edited=true;
  return ch;
}

function replacementsFor(w,itemId,n){

    if(nm===it.ex||inSession.has(nm)) return false;
    const c=EX(nm); if(!c) return false;

    const c=EX(nm); let s=0;

    if(c.pat===pat) s+=3;

  prior.forEach(e=>(e.sets||[]).forEach(s=>{
    if((s.w||0)>bestW){ bestW=s.w||0; bestRepsAtW=s.r||0; }
    else if((s.w||0)===bestW && (s.r||0)>bestRepsAtW) bestRepsAtW=s.r||0;
    if((s.sec||0)>bestSec) bestSec=s.sec||0;

  else if(set.w && set.w===bestW && (set.r||0)>bestRepsAtW && bestRepsAtW>0) pr={kind:"reps",value:kgTxt(set.w)+" × "+set.r};
  else if(set.sec && set.sec>bestSec && bestSec>0) pr={kind:"time",value:set.sec+"s"};
  if(pr){
    pr.ex=ex; pr.date=date;

          prs:(DB.prs||[]).filter(p=>p.date.slice(0,7)===first.slice(0,7))};
}

/* =====================================================================
   THE COACH
   Structured output only. The model returns a small validated object;
   the interface renders it. Anything that changes the workout is
   executed by the engine after the arguments have been checked against
   the catalogue. Without an API key the app still works — every screen
   below has a deterministic fallback.
   ===================================================================== */
function aiReady(){ return !!(DB.ai && DB.ai.key); }

const COACH_SYSTEM = `You are Lia's personal trainer inside an app called Train.

Manner: military. Direct, firm, brief, decisive, accountability-first. No warmth for its own sake, no motivational speeches, no quotations, no praise for showing up, no emojis, no exclamation marks. Short declarative sentences.

You hold her to the work, never to her worth. Dry, cutting humour about missed sessions is right. Comment on behaviour and effort only. Never remark on her body, weight, eating, motherhood, health status, or personal worth. Never use insults such as lazy, weak, pathetic, useless.

You never diagnose and never promise to fix pain. If she reports severe, worsening, persistent or radiating symptoms, numbness, weakness, dizziness, or a new injury, you tell her to stop the session and get it assessed properly.

Nutrition is not part of this app. If she raises food, say it is handled elsewhere and move on.

Keep every response under 45 words unless she explicitly asks you to explain something.`;

function coachContext(){
  const d=today(), ci=checkinOn(d), w=sessionFor(d,false), cyc=cycleInfo(d);
  const wk=weekStats();
  const recent=Object.keys(DB.sessions||{}).sort().slice(-8).map(k=>{
    const s=DB.sessions[k];
    return {date:uk(k),title:s.title,done:!!(s.state&&s.state.finished),mode:s.mode};
  });
  const necks=neckTrend(10).filter(x=>x.v!=null).map(x=>x.v);
  return {
    profile:{name:DB.profile.name,age:DB.profile.age,experience:DB.profile.experience,
             goals:DB.profile.goals,avoid:DB.profile.avoid,equipment:DB.profile.equipment,
             cSection:DB.profile.csection},
    today:{date:uk(d), day:DOW_FULL[dowOf(d)], rest:isRestDay(d),
           workout: w? {title:w.title,mode:w.mode,minutes:w.mins,
             blocks:(w.blocks||[]).map(b=>({label:b.label,rounds:b.rounds,
               items:b.items.map(i=>i.ex+(i.side?" (each side)":"")+" "+(i.time? i.time+"s" : i.reps+" reps"))})),
             adjustments:w.adjustments||[], finished:!!(w.state&&w.state.finished)} : null},
    checkin: ci? {sleep:ci.sleep,energy:ci.energy,soreness:ci.soreness,stress:ci.stress,
                  neck:ci.neck,pain:ci.pain,time:ci.time,note:ci.note,readiness:readiness(ci)} : null,
    cycle: (DB.prefs.cycleOn && cyc.known)? {phase:PHASE_LABEL[cyc.phase],dayOfCycle:cyc.day,estimate:true} : null,
    week:{planned:wk.planned,completed:wk.done,missed:wk.missed,streak:DB.streak||0},
    neckLast10:necks,
    recentSessions:recent,
    records:(DB.prs||[]).slice(-5)
  };
}

async function aiJSON(system,user,schema,name,maxTokens){
  if(!aiReady()) return null;
  let ctl=null,timer=null;
  try{
    ctl=new AbortController(); timer=setTimeout(()=>{try{ctl.abort();}catch(e){}},45000);
    const body={ model: DB.ai.model||"gpt-4o-mini",
      messages:[{role:"system",content:system},{role:"user",content:typeof user==="string"?user:JSON.stringify(user)}],
      response_format:{type:"json_schema",json_schema:{name:name||"reply",strict:true,schema}} };
    if(/^gpt-5|^o\d/i.test(body.model)){ body.max_completion_tokens=(maxTokens||400)+1200; }
    else { body.max_tokens=maxTokens||400; body.temperature=0.85; }
    const res=await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DB.ai.key},
      body:JSON.stringify(body)});
    if(!res.ok){
      let m=""; try{ m=((await res.json()).error||{}).message||""; }catch(e){}
      console.warn("AI",res.status,m);
      toast(res.status===401?"API key rejected — check Settings":"Coach unavailable ("+res.status+")");
      return null;
    }
    const j=await res.json();
    const txt=(((j.choices||[])[0]||{}).message||{}).content||"";
    return JSON.parse(txt);
  }catch(e){
    if(e&&e.name==="AbortError") toast("Coach timed out");
    else console.warn("AI",e);
    return null;
  } finally { if(timer) clearTimeout(timer); }
}

const FALLBACK_OPENERS=["Read and applied.","Logged.","Check-in processed.","Noted.","Understood."];
function fallbackAnalysis(ci,w,changes){
  const r=readiness(ci);
  const seed=(parseISO(w.date).getDate()+ (ci.energy||0))%FALLBACK_OPENERS.length;
  let head = r>=78?"Green light":r>=58?"Steady day":r>=38?"Manage it":"Recovery bias";
  if((+ci.neck||0)>=6) head="Neck first";
  if(ci.time==="short") head="Short session";
  const bits=[];
  if(changes.length) bits.push(changes.join(" "));
  else bits.push("No changes needed — today's session stands as written.");
  bits.push(w.mins+" minutes.");
  return {headline:head, summary:FALLBACK_OPENERS[seed]+" "+bits.join(" ")};
}
async function analyseDay(ci,w,changes){

    {task:"Summarise this morning check-in and the changes already made to today's workout. Do not propose further changes. State what changed and why in one or two sentences.",

/* ---------- chat ---------- */
const ACTION_LABELS={short_session:"switched to the short session",full_session:"restored the full session",
  rest_today:"marked today as rest",rebuild:"rebuilt today's session",replace:"replaced a movement"};
function runCoachAction(a){
  if(!a||a.kind==="none") return null;
  const d=today();
  let w=sessionFor(d,true);
  /* Never rewrite a session she is standing in the middle of, or one she
     has already finished. A command either happens or it doesn't. */
  if(w && w.state && (w.state.finished || w.state.startedAt) && a.kind!=="replace"){
    return null;
  }
  if(a.kind==="short_session"){ regenerate(d,"short"); return "Short session set."; }
  if(a.kind==="full_session"){ regenerate(d,"full"); return "Full session restored."; }
  if(a.kind==="rest_today"){ DB.sessions[d]=restSession(d); save(); return "Today is a rest day."; }
  if(a.kind==="rebuild"){ regenerate(d,w.mode||"full"); return "Session rebuilt."; }
  if(a.kind==="replace"){
    if(!a.exercise||!a.replacement) return null;
    if(!EX(a.replacement)||UNAVAILABLE.test(a.replacement)) return null;
    const f=(w.blocks||[]).flatMap(b=>b.items).find(i=>i.ex.toLowerCase()===String(a.exercise).toLowerCase());
    if(!f) return null;
    swapItem(w,f.id,a.replacement,"coach");
    save();
    return a.exercise+" → "+a.replacement+".";
  }
  return null;
}
async function coachReply(text){
  const ctx=coachContext();
  const hist=(DB.chat||[]).slice(-8).map(m=>({role:m.who==="me"?"user":"assistant",text:m.text}));
  const ai=await aiJSON(COACH_SYSTEM+`

You may change today's session by returning an action. Allowed kinds: none, short_session, full_session, rest_today, rebuild, replace. For "replace" you must give the exact exercise name from the current session and an exact replacement name from this list: `+allNames().join(", ")+`. If you are not certain, use kind "none" and say what you would do. Never claim to have changed something unless you returned the action for it.`,
    {question:text, recentMessages:hist, context:ctx},
    S_CHAT,"coach_reply",420);
  if(!ai){
    return {message: fallbackChat(text), action:null, applied:null};
  }
  const applied=runCoachAction(ai.action);
  return {message:ai.message, action:ai.action, applied};
}
function fallbackChat(text){
  const t=String(text||"").toLowerCase();
  const d=today(), ci=checkinOn(d), w=sessionFor(d,false);
  const live=!!(w&&w.state&&(w.state.startedAt||w.state.finished));
  const later=/tomorrow|next week|monday|tuesday|wednesday|thursday|friday|later/.test(t);
  if(later) return "I only run today. Tell me again in the morning and I'll build it then.";
  if(/short|quick|20 ?min|no time/.test(t)){
    if(live) return "Today's session is already under way. Not rewriting it mid-set.";
    regenerate(d,"short"); return "Short session set. Two blocks. Start now."; }
  if(/rest|skip|can'?t train|day off/.test(t)){
    if(live) return "You already started. Finish what's on the screen or end it properly.";
    DB.sessions[d]=restSession(d); save(); return "Marked as rest. Tomorrow is not negotiable."; }
  if(/what.*today|plan|session/.test(t) && w) return w.title+". "+w.mins+" minutes. "+(w.blocks||[]).length+" blocks. Open Train.";
  if(/neck/.test(t)) return "Log it in the check-in with a number. That is what changes the session.";
  if(/food|eat|calorie|protein|diet/.test(t)) return "Not this app. Training only.";
  if(!ci) return pickLine("nocheckin");
  return "No API key, so I'm running on rails. Add one in Settings and I'll answer properly.";
}

async function buildReview(monthISO){
  const st=monthStats(monthISO);
  const strength=strengthDeltas(st.month);
  const meas=measureDeltas(st.month);
  const ai=await aiJSON(COACH_SYSTEM,
    {task:"Write a short monthly review. Headline of three or four words. Summary of two sentences maximum. Two or three focus points for next month, each under eight words.",
     stats:st,strengthChanges:strength,measurementChanges:meas},
    S_REVIEW,"monthly_review",420);
  const fallback={
    headline: st.done>=st.planned*0.8? "Week after week" : st.done>=st.planned*0.5? "Half the work" : "Below the line",
    summary: st.done+" of "+st.planned+" sessions completed"+(st.missed?", "+st.missed+" missed":"")+"."+
      (strength.length? " Strongest movement: "+strength[0].ex+" up "+strength[0].delta+"." : ""),
    focus: [ st.missed>2? "Protect the five weekdays" : "Hold the consistency",
             "Add load where reps hit twelve",
             st.neckAvg!=null&&st.neckAvg>=4? "Keep the neck prep every session" : "Progress the pelvic work" ]
  };
  const out=ai||fallback;
  const rec={id:uid(),month:st.month,created:Date.now(),stats:st,strength,measures:meas,...out};
  DB.reviews=(DB.reviews||[]).filter(r=>r.month!==st.month);
  DB.reviews.push(rec); save();
  return rec;
}
function strengthDeltas(monthPrefix){
  const out=[];
  Object.keys(DB.strength||{}).forEach(ex=>{
    const inM=history(ex).filter(e=>e.date.slice(0,7)===monthPrefix);
    const before=history(ex).filter(e=>e.date.slice(0,7)<monthPrefix);
    if(!inM.length||!before.length) return;
    const a=Math.max(...before.map(e=>(topSet(e)||{}).w||0));
    const b=Math.max(...inM.map(e=>(topSet(e)||{}).w||0));
    if(a>0&&b>a) out.push({ex,from:a,to:b,delta:"+"+kgTxt(b-a)});
  });
  return out.sort((x,y)=>parseFloat(y.delta)-parseFloat(x.delta)).slice(0,5);
}
function measureDeltas(monthPrefix){
  const ms=(DB.measures||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(ms.length<2) return [];
  const last=ms[ms.length-1], first=ms.find(m=>m.date.slice(0,7)>=monthPrefix)||ms[0];
  const keys=["waist","hips","thigh","glutes","chest","arm"];
  return keys.filter(k=>last[k]!=null&&first[k]!=null&&last[k]!==first[k])
    .map(k=>({what:k,from:first[k],to:last[k],delta:(last[k]-first[k]>0?"+":"")+(Math.round((last[k]-first[k])*10)/10)+" cm"}));
}

/* =====================================================================
   CLOUD MIRROR
   Same Firebase project as Amir's app, different collection and a
   different document. Neither app can read the other's training.
   If the project's rules don't yet carry a liapt block, the first write
   fails with permission-denied and we fall back to a document inside the
   existing collection — same isolation, no console visit required.
   ===================================================================== */
let _fb=null, _fbReady=false, _fbErr=null, _pushing=false;
function cloudDocPath(){ return (DB.cloud.collection||FB_COLLECTION)+"/"+(DB.cloud.syncId||FB_SYNC_DEFAULT); }
function cloudDoc(){ return _fb.firestore().doc(cloudDocPath()); }

async function cloudInit(){
  if(_fbReady) return true;
  if(typeof firebase==="undefined"){ _fbErr="Firebase SDK didn't load"; return false; }
  try{
    _fb=firebase;
    if(!_fb.apps.length) _fb.initializeApp(FB_CONFIG);
    await _fb.auth().signInAnonymously();
    _fbReady=true; _fbErr=null;
    return true;
  }catch(e){ _fbErr=(e&&e.message)||"sign-in failed"; console.warn("cloud",e); return false; }
}
function cloudPayload(){
  const d=JSON.parse(JSON.stringify(DB));
  if(!DB.cloud.syncKeys) d.ai={...d.ai,key:""};
  let s=JSON.stringify(d);
  if(s.length>780000){
    /* Progress photographs are the only thing big enough to burst a document.
       They stay on the device and the rest still mirrors. */
    d.photos=(d.photos||[]).map(p=>({...p,data:null,localOnly:true}));
    d._photosLocal=true;
  }
  return d;
}
async function cloudPush(quiet){
  if(!DB.cloud.on || _pushing) return false;
  _pushing=true;
  try{
    if(!await cloudInit()){ if(!quiet) toast("Cloud: "+(_fbErr||"unavailable")); return false; }
    const payload={ updated:Date.now(), v:VERSION, data:cloudPayload() };
    try{
      await cloudDoc().set(payload);
    }catch(e){
      if(String(e&&e.code)==="permission-denied" && DB.cloud.collection!==FB_COLLECTION_FALLBACK){
        DB.cloud.collection=FB_COLLECTION_FALLBACK;
        DB.cloud.syncId=(DB.cloud.syncId||FB_SYNC_DEFAULT).startsWith("lia-")?DB.cloud.syncId:"lia-"+DB.cloud.syncId;
        await cloudDoc().set(payload);
      } else throw e;
    }
    DB.cloud.last=Date.now();
    try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }catch(e){}
    if(!quiet) toast("Backed up");
    return true;
  }catch(e){
    console.warn("push",e);
    if(!quiet) toast("Backup failed: "+((e&&e.message)||"unknown").slice(0,60));
    return false;
  } finally { _pushing=false; }
}
async function cloudPull(quiet){
  if(!DB.cloud.on) return false;
  try{
    if(!await cloudInit()){ if(!quiet) toast("Cloud: "+(_fbErr||"unavailable")); return false; }
    let snap;
    try{ snap=await cloudDoc().get(); }
    catch(e){
      if(String(e&&e.code)==="permission-denied" && DB.cloud.collection!==FB_COLLECTION_FALLBACK){
        DB.cloud.collection=FB_COLLECTION_FALLBACK; snap=await cloudDoc().get();
      } else throw e;
    }
    if(!snap.exists){ if(!quiet) toast("Nothing in the cloud yet"); return false; }
    const v=snap.data();
    if(!v||!v.data){ if(!quiet) toast("Backup looks empty"); return false; }
    const keepKey=DB.ai.key, keepCloud={...DB.cloud};
    const keepPhotos=(DB.photos||[]).filter(p=>p.data);
    const merged=mergeDefaults(v.data);
    merged.cloud={...keepCloud};
    if(!merged.ai.key) merged.ai.key=keepKey;
    if(v.data._photosLocal||merged.photos.some(p=>p.localOnly)){
      const byId={}; keepPhotos.forEach(p=>byId[p.id]=p);
      merged.photos=merged.photos.map(p=>byId[p.id]||p).filter(p=>p.data);
    }
    Object.keys(DB).forEach(k=>{ delete DB[k]; });
    Object.assign(DB,merged);
    save();
    if(!quiet) toast("Restored from cloud");
    refresh();
    return true;
  }catch(e){ console.warn("pull",e); if(!quiet) toast("Restore failed"); return false; }
}
async function cloudStatus(){
  const ok=await cloudInit();
  if(!ok) return {ok:false,msg:_fbErr||"not connected"};
  try{
    const snap=await cloudDoc().get();
    if(!snap.exists) return {ok:true,msg:"Connected. No backup written yet."};
    const v=snap.data();
    const size=JSON.stringify(v).length;
    return {ok:true,msg:"Connected to "+cloudDocPath()+". Last backup "+uk(iso(new Date(v.updated)))+
      " at "+new Date(v.updated).toTimeString().slice(0,5)+" · "+Math.round(size/1024)+" KB."};
  }catch(e){
    return {ok:false,msg:String(e&&e.code)==="permission-denied"
      ? "Permission denied. Paste the updated Firestore rules (see the setup notes) or leave sync off."
      : ((e&&e.message)||"failed")};
  }
}

function exportBackup(){

  a.download="train-backup-"+uk(today()).replace(/\//g,"-")+".json";

function importBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const parsed=JSON.parse(r.result);
    if(!parsed||typeof parsed!=="object") throw new Error("not a backup");
    const merged=mergeDefaults(parsed);
    Object.keys(DB).forEach(k=>{ delete DB[k]; });
    Object.assign(DB,merged); save(); refresh(); toast("Backup restored");
  }catch(e){ toast("That file isn't a Train backup"); } };
  r.readAsText(f);
  input.value="";
}

/* The red-flag check. Never a diagnosis, always a stop. */
function redFlag(c){
  const t=(c.note||"").toLowerCase();
  const words=/numb|tingl|pins and needles|shooting|radiat|down my arm|weak(ness)?|dizzy|dizziness|faint|black ?out|fever|blood|can'?t move|can'?t turn/;
  if((+c.neck||0)>=9) return "Neck at "+c.neck+" out of ten.";
  if((+c.pain||0)>=9) return "Pain at "+c.pain+" out of ten.";
  if(words.test(t)) return "What you've described in the note.";
  if((c.pelvic||[]).includes("Leaking")||(c.pelvic||[]).includes("Heaviness")) return null;

}

let _analysing=false;
async function runAnalysis(){
  if(_analysing) return;
  const c=ciDraft();
  const btn=el("analyseBtn");
  if(btn){ btn.classList.add("loading"); btn.innerHTML='<span class="spin"></span><span class="lbl">Reading it</span>'; }
  _analysing=true;
  try{
    c.analysed=true; c.at=Date.now();
    DB.checkins[c.date]=JSON.parse(JSON.stringify(c));
    let w=sessionFor(c.date,true);
    if(!w.rest){
      if(w.state && w.state.startedAt) { /* mid-session: don't rewrite under her */ }
      else { w=regenerate(c.date, c.time==="short"?"short":"full"); }
    }
    let changes=[];
    if(!w.rest){ changes=applyCheckin(w,c); }
    const flag=redFlag(c);
    const a= w.rest
      ? {headline:"Rest day", summary:"Logged. No session today — that is the programme, not a gap."}
      : await analyseDay(c,w,changes);
    w.analysis={...a, changes, flag, at:Date.now()};
    DB.sessions[c.date]=w;
    pushCoach(a.summary + (flag? " Stop and get that looked at properly before the next session." : ""));
    save();
  }catch(e){ console.error(e); toast("Couldn't finish the analysis — the check-in is saved"); }
  _analysing=false;
  renderHome();
}

    ? mini(it.id,"weight",(it.weight||0)+' <small>kg</small>')
    : '<button class="chip" onclick="makeWeighted(\''+it.id+'\')">+ kg</button>';
  return '<div class="bleed"><div class="ec-media'+(mediaFor(it.ex)?'':' noshot')+'">'+mediaHTML(it.ex)+'</div>'+

      (showAsk? loadAskHTML(it,sug):'')+

          ICO.play+'<span class="lbl">Start '+it.time+'s</span></button>':'')+

        ICO.check+'<span class="lbl">Complete</span></button>'+
      '<div class="restrow">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.4 1.6M9.5 2.5h5"/></svg>'+
        '<span class="t">Rest <span class="num">'+fmtClock(b.rest||DB.prefs.rest)+'</span></span>'+
        '<button onclick="startRest('+(b.rest||DB.prefs.rest)+',\'Rest\',\''+esc(it.ex).replace(/'/g,"\\'")+'\')" aria-label="Start the rest timer now">'+ICO.play+'</button>'+
      '</div>'+
      '<div class="quickrow">'+
        '<button onclick="openReplace(\''+it.id+'\')">'+ICO.swap+'Swap</button>'+
        '<button onclick="howTo(\''+it.id+'\')">'+ICO.info+'How?</button>'+
        '<button onclick="skipItem()">'+ICO.chev+'Skip</button>'+

}
function mini(id,key,html){
  const step = key==="weight"? null : (key==="time"?5:1);
  return '<span class="mini">'+
    '<button onclick="bumpItem(\''+id+'\',\''+key+'\',-1)" aria-label="less">−</button>'+
    '<span class="v" id="st-'+key+'-'+id+'">'+html+'</span>'+
    '<button onclick="bumpItem(\''+id+'\',\''+key+'\',1)" aria-label="more">+</button></span>';
}
function roundDots(w,b){
  let out="";
  for(let r=1;r<=b.rounds;r++){
    const full=b.items.every(it=>(w.state.done||{})[w.state.b+"-"+r+"-"+it.id]);
    out+='<i class="'+(full||r<w.state.r?"on":"")+'"></i>';
  }
  return out;
}
/* Some movements are logged as reps by default but she may hold a plate or
   a bell. One tap turns any of them into a weighted exercise. */
function makeWeighted(id){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  it.forceKg=true; it.load="kg";
  if(it.weight==null) it.weight=(startingLoad(it.ex)||{}).kg||5;
  save(); renderTrain(); toast("Log it in kilograms");
}
function bumpItem(id,dir,mult){
  const key=dir, d=(typeof mult==="number"? mult : 1);
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  if(key==="weight"){
    const v=it.weight||0;
    const step=v<10?0.5:(v<30?1.25:2.5);
    it.weight=Math.max(0,roundLoad(v+step*d));
    it.askedLoad=true;
  }
  else if(key==="time"){ it.time=Math.max(5,(it.time||30)+5*d); }
  else { it.reps=Math.max(1,(it.reps||10)+1*d); }
  save();
  const n=el("st-"+key+"-"+id);
  if(n) n.innerHTML = key==="weight"? ((it.weight||0)+' <small>kg</small>')
      : (key==="time"? (it.time+'<small>s</small>') : (it.reps+' <small>reps</small>'));
  else renderTrain();
}
function loadAskHTML(it,sug){
  return '<div class="cue" style="background:var(--blue-soft);color:var(--blue-ink);align-items:center">'+ICO.spark+
    '<span class="grow"><b>Last time: '+kgTxt(sug.kg)+' × '+sug.prevReps+'.</b> Ready to increase?</span>'+
    '<span class="row" style="gap:8px;flex:0 0 auto">'+
      '<button class="chip" onclick="answerLoad(\''+it.id+'\',0)">Keep</button>'+
      '<button class="chip blue" onclick="answerLoad(\''+it.id+'\',1)">Increase</button>'+
    '</span></div>';
}
function answerLoad(id,up){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  it.askedLoad=true;
  if(up){
    const step=(it.weight||0)<10?0.5:((it.weight||0)<30?1.25:2.5);
    it.weight=roundLoad((it.weight||0)+step);
    toast("Up to "+kgTxt(it.weight)+". Own it.");
  }
  save(); renderTrain();
}

/* ---------- timed work ---------- */
function runWorkTimer(id){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  unlockAudio();
  if(WORK_TIMER){ clearInterval(WORK_TIMER); WORK_TIMER=null; el("wtBtn").innerHTML=ICO.play+'<span class="lbl">Start '+it.time+'s</span>'; return; }
  WORK_END=Date.now()+it.time*1000;
  const btn=el("wtBtn");
  WORK_TIMER=setInterval(()=>{
    const left=(WORK_END-Date.now())/1000;
    if(btn) btn.innerHTML=ICO.pause+'<span class="lbl num">'+fmtClock(Math.max(0,left))+'</span>';
    if(left<=0.2){ clearInterval(WORK_TIMER); WORK_TIMER=null; beep(2); completeItem(id); }
  },200);
}

/* ---------- completion and flow ---------- */
function completeItem(id){
  const w=W(); const b=curBlock(w); if(!b) return;
  const f=findItem(w,id); if(!f) return;
  const it=f.item, e=EX(it.ex)||{};
  if(WORK_TIMER){ clearInterval(WORK_TIMER); WORK_TIMER=null; }
  const payload={};
  if(itemLoad(it)==="kg"&&it.weight) payload.w=it.weight;
  if(it.time) payload.sec=it.time; else if(typeof it.reps==="number") payload.r=it.reps;
  const pr=logSet(w,id,payload);
  w.state.done=w.state.done||{};
  w.state.done[doneKey(w,it)]={at:Date.now(),...payload};
  if(pr) celebratePR(pr);
  advance(w,b);
}
function advance(w,b){
  const lastIdx=b.items.length-1;
  if(w.state.i<lastIdx){
    w.state.i++;
    save(); renderTrain();
    const nx=curItem(w);
    if(b.flow) return;
    return;
  }
  /* end of a round */
  if(w.state.r<b.rounds){
    const nextName=b.items[0].ex;
    w.state.i=0; w.state.r++;
    save(); renderTrain();
    startRest(b.rest||DB.prefs.rest,"Rest · "+b.label+" round "+w.state.r,nextName,()=>renderTrain());
    return;
  }
  /* end of a block */
  if(w.state.b<(w.blocks.length-1)){
    const nb=w.blocks[w.state.b+1];
    w.state.b++; w.state.r=1; w.state.i=0;
    save(); renderTrain();
    startRest((b.rest||60)+15,"Block "+b.label+" done",nb.items[0].ex,()=>{ renderTrain(); toTop(); });
    return;
  }
  /* cooldown */
  w.state.phase=(w.cooldown&&w.cooldown.length)?"cool":"done";
  if(w.state.phase==="done") finishSession();
  else { save(); renderTrain(); toTop(); }
}
function skipItem(){
  const w=W(), b=curBlock(w); if(!b) return;
  const it=curItem(w); if(!it) return;
  w.state.done=w.state.done||{};
  w.state.done[doneKey(w,it)]={skipped:true,at:Date.now()};
  advance(w,b);
  toast("Skipped");
}
function prevItem(){
  const w=W();
  if(w.state.i>0){ w.state.i--; }
  else if(w.state.r>1){ w.state.r--; w.state.i=(curBlock(w).items.length-1); }
  else if(w.state.b>0){ w.state.b--; w.state.r=curBlock(w).rounds; w.state.i=curBlock(w).items.length-1; }
  save(); renderTrain();
}
function togglePrep(id){
  const w=W();
  w.state.prepDone=w.state.prepDone||{};
  if(w.state.prepDone[id]) delete w.state.prepDone[id]; else w.state.prepDone[id]=true;
  save();
  if((w.prep||[]).every(p=>w.state.prepDone[p.id])){
    w.state.phase="work"; save(); toast("Warm-up done. Superset A."); toTop();
  }
  renderTrain();
}
function toggleCool(id){
  const w=W();
  w.state.coolDone=w.state.coolDone||{};
  if(w.state.coolDone[id]) delete w.state.coolDone[id]; else w.state.coolDone[id]=true;
  save(); renderTrain();
}
function finishSession(){
  const w=W();
  completeSession(w);
  const line=pickLine("done",parseISO(w.date).getDate());
  pushCoach(line);
  renderTrain();
  beep(3);
}

/* One filter used by the swap sheet and by the library screen. */
function groupedNames(){
  const g={};

  return g;

function filterNames(opts){
  const o=opts||{};
  const g=groupedNames();
  let list = o.grp? (g[o.grp]||[]) : allNames();

  if(q) list=allNames().filter(n=>n.toLowerCase().includes(q) ||
    ((EX(n)||{}).m||[]).some(m=>muscleLabel(m).toLowerCase().includes(q)));
  if(o.eq) list=list.filter(n=>(EX(n)||{}).eq===o.eq);
  if(o.exclude) list=list.filter(n=>!o.exclude.has(n));
  return list;

function savePain(){
  const v=+el("pnScale").value;
  const where=[...document.querySelectorAll("#pnWhere .chip.blue")].map(b=>b.dataset.w);
  const note=(el("pnNote").value||"").trim();
  const d=today();
  const ci=checkinOn(d)||{id:uid(),date:d,sleep:5,energy:5,soreness:0,stress:0,neck:0,pain:0,time:"full",pelvic:[],cycleSymptoms:[]};
  ci.pain=Math.max(ci.pain||0,v);
  if(where.includes("Neck")) ci.neck=Math.max(ci.neck||0,v);
  ci.painReports=(ci.painReports||[]).concat([{at:Date.now(),v,where,note}]);
  if(where.some(x=>/Abdomen|Pelvic/.test(x))) ci.pelvic=[...new Set([...(ci.pelvic||[]),"Abdominal discomfort"])];
  DB.checkins[d]=ci;
  const w=W();
  const changes=applyCheckin(w,ci);
  save(); closeSheet(); renderTrain();
  const severe = v>=8 || /numb|tingl|shoot|radiat|weak|dizz/i.test(note);
  if(severe){
    openSheet("Stop the session",
      '<div class="cue" style="background:var(--bad-soft);color:var(--bad)">'+ICO.pain+
      '<span>That is not something to train through. Stop now and get it assessed by a doctor or physiotherapist before the next session.</span></div>'+
      '<button class="btn" style="margin-top:18px" onclick="closeSheet();endWorkout()"><span class="lbl">End the session</span></button>');
  } else {
    toast(changes.length? "Session adjusted" : "Logged");
    pushCoach(changes.length? "Adjusted: "+changes[0] : "Logged. Report it again if it gets worse.");
  }
}

function renderTrain(){
  const d=today();
  let w=(DB.sessions||{})[d];
  if(!w) w=sessionFor(d,true);
  const wrap=el("trainWrap");

  if(w.rest || w.deleted){
    wrap.innerHTML=backBarTrain(w)+
      '<div class="card pad-lg"><div class="eyebrow">'+DOW_FULL[dowOf(d)]+'</div>'+
      '<h2 style="margin-top:6px">'+(w.deleted?"No session":"Rest day")+'</h2>'+
      '<p class="muted" style="margin-top:10px">'+(w.deleted
        ? "You cleared today. Build it back whenever you want."
        : "Saturdays and Sundays are scheduled recovery. Nothing to do.")+'</p>'+
      '<div class="btn-row" style="margin-top:18px">'+
        '<button class="btn sec" onclick="startMobility()"><span class="lbl">Mobility flow</span></button>'+
        (w.deleted?'<button class="btn" onclick="rebuildWorkout()"><span class="lbl">Rebuild today</span></button>':'')+
      '</div></div>';
    return;
  }
  const st=w.state;
  if(st.finished){ wrap.innerHTML=finishedHTML(w); return; }
  if(!st.startedAt){ wrap.innerHTML=readyHTML(w); return; }
  if(st.phase==="prep"){ wrap.innerHTML=sessionBarHTML(w)+prepHTML(w); return; }
  if(st.phase==="cool"){ wrap.innerHTML=sessionBarHTML(w)+coolHTML(w); return; }
  const b=curBlock(w), it=curItem(w);
  if(!b||!it){ wrap.innerHTML=finishedHTML(w); return; }
  wrap.innerHTML=sessionBarHTML(w)+exerciseCardHTML(w,b,it)+upNextHTML(w,b);
  sessionTick();
}

/* =====================================================================
   PROGRESS — pictures and numbers, not paragraphs. Weight is present
   but small: the goal is shape and strength at the same bodyweight.

function sparkline(values,w,h){
  if(!values.length) return "";
  const W=w||120,H=h||34;
  const min=Math.min(...values), max=Math.max(...values), span=(max-min)||1;
  const pts=values.map((v,i)=>[(i/(values.length-1||1))*W, H-((v-min)/span)*(H-6)-3]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="#2B54F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function lineChart(series,label){
  const pts=series.filter(p=>p.v!=null);
  if(pts.length<2) return '<div class="empty"><p>Not enough logged yet.</p></div>';
  const W=320,H=110,P=8;
  const vals=pts.map(p=>p.v);
  const min=0, max=Math.max(10,Math.max(...vals));
  const x=i=>P+(i/(series.length-1))*(W-P*2);
  const y=v=>H-P-((v-min)/(max-min))*(H-P*2);
  let d="",area="";
  pts.forEach((p,i)=>{ const idx=series.indexOf(p); d+=(i?"L":"M")+x(idx).toFixed(1)+" "+y(p.v).toFixed(1)+" "; });
  area=d+"L"+x(series.indexOf(pts[pts.length-1])).toFixed(1)+" "+(H-P)+" L"+x(series.indexOf(pts[0])).toFixed(1)+" "+(H-P)+" Z";
  return '<svg class="linechart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(label||"trend")+'">'+
    '<path d="'+area+'" fill="rgba(43,84,242,.10)"/>'+
    '<path d="'+d+'" fill="none" stroke="#2B54F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.slice(-1).map(p=>'<circle cx="'+x(series.indexOf(p)).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.5" fill="#2B54F2"/>').join("")+
    '</svg>';
}
const KEY_LIFTS=["Hip Thrust","Romanian Deadlift","Deadlift","Goblet Squat","Seated Cable Row","Lat Pulldown",
  "Bulgarian Split Squat","DB Chest Press","Push-up","Chest-supported DB Row"];
function strengthRows(){
  const lifts=[...new Set([...KEY_LIFTS,...Object.keys(DB.strength||{})])]
    .filter(ex=>history(ex).length)
    .map(ex=>{
      const h=[...history(ex)].sort((a,b)=>a.date<b.date?-1:1);
      const series=h.map(e=>{ const t=topSet(e)||{}; return t.w||t.sec||t.r||0; });
      const best=bestEver(ex);
      const first=series[0]||0, lastV=series[series.length-1]||0;
      return {ex,series,best,delta:lastV-first,sessions:h.length};
    })
    .sort((a,b)=>b.sessions-a.sessions).slice(0,8);
  if(!lifts.length) return '<div class="empty">'+ICO.spark+'<p>Nothing logged yet. Finish a session and it fills in.</p></div>';
  return lifts.map(l=>'<div class="listrow"><span class="grow"><span class="k">'+esc(l.ex)+'</span>'+
    '<div class="tiny dim num" style="margin-top:2px">'+(l.best? (l.best.sec? l.best.sec+"s best" : kgTxt(l.best.w)+" × "+l.best.r) : "—")+
    ' · '+plural(l.sessions,"session")+'</div></span>'+
    '<span class="v">'+sparkline(l.series,86,30)+(l.delta>0?'<span class="chip good">+'+(Math.round(l.delta*10)/10)+'</span>':'')+'</span></div>').join("");
}

function addPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",0.72);
      DB.photos=(DB.photos||[]).concat([{id:uid(),date:today(),pose:window._pose||"Front",data}]);
      save(); closeSheet(); renderProgress(); toast("Saved to this device");
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
  input.value="";
}

/* =====================================================================
   COACH — typing only. Short, strict, and it can change today's session.
   ===================================================================== */
function pushCoach(text){
  if(!text) return;
  const last=(DB.chat||[]).slice(-1)[0];
  if(last && last.who==="coach" && last.text===text) return;   /* never repeat itself */
  DB.chat=(DB.chat||[]).concat([{who:"coach",text,at:Date.now()}]);
  if(DB.chat.length>200) DB.chat=DB.chat.slice(-200);
  save();
  if(CUR==="coach") renderChat();
}
function pushMe(text){
  DB.chat=(DB.chat||[]).concat([{who:"me",text,at:Date.now()}]); save();
}
let _sending=false;
async function sendChat(){
  const input=el("chatIn");
  const text=(input.value||"").trim();
  if(!text||_sending) return;
  input.value="";
  pushMe(text); renderChat();
  _sending=true;
  DB.chat.push({who:"coach",text:"…",typing:true}); renderChat();
  try{
    const r=await coachReply(text);
    DB.chat=DB.chat.filter(m=>!m.typing);
    pushCoach(r.message + (r.applied? " ("+r.applied+")" : ""));
    if(r.applied){ toast(r.applied); if(CUR==="train") renderTrain(); }
  }catch(e){
    DB.chat=DB.chat.filter(m=>!m.typing);
    pushCoach("Connection failed. Try again.");
  }
  _sending=false;
  renderChat();
}
function clearChat(){
  DB.chat=[]; save(); renderChat(); toast("Cleared");
}
function renderChat(){
  const log=el("chatLog");
  const d=today(), ci=checkinOn(d), w=(DB.sessions||{})[d];
  el("coachSub").textContent = w? (w.rest?"Rest day":w.title) : DOW_FULL[dowOf(d)];
  if(!(DB.chat||[]).length){
    const line = isRestDay(d)? pickLine("rest") : (!ci? pickLine("nocheckin") : pickLine("ready"));
    DB.chat=[{who:"coach",text:line,at:Date.now()}]; save();
  }
  log.innerHTML=(DB.chat||[]).map(m=>'<div class="msg '+(m.who==="me"?"me":"coach")+'">'+
    (m.typing? '<span class="spin dark"></span>' : esc(m.text).replace(/\n/g,"<br>"))+'</div>').join("")+
    (aiReady()?'':'<div class="msg coach" style="background:var(--warn-soft);color:var(--warn)">'+
      'No API key. I can still run the session, but I can\'t talk properly. '+
      '<button class="linkbtn" onclick="go(\'settings\')" style="color:inherit;text-decoration:underline">Add one</button></div>');
  requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}));
}
/* The daily nudge. Written once a day, never on every render. */
function dailyNudge(){
  const d=today();
  if(DB.lastNudge===d) return;
  DB.lastNudge=d;
  const y=addDays(d,-1);
  const yRest=isRestDay(y), yS=(DB.sessions||{})[y];
  const missed=!yRest && (!yS || !(yS.state&&yS.state.finished));
  if(isRestDay(d)) pushCoach(pickLine("rest",parseISO(d).getDate()));
  else if(missed) pushCoach(pickLine("missed",parseISO(d).getDate()));
  else if(!checkinOn(d)) pushCoach(pickLine("nocheckin",parseISO(d).getDate()));
  save();
}

function saveProfile(){
  const p=DB.profile;
  ["name","goalDate","equipment","csection"].forEach(k=>{ const e=el("pf-"+k); if(e) p[k]=e.value.trim(); });
  ["age","heightCm","weightKg","targetKg","sessionMins","shortMins"].forEach(k=>{
    const e=el("pf-"+k); if(!e) return; const v=parseFloat((e.value||"").replace(",","."));
    if(!isNaN(v)) p[k]=v;
  });
  const g=el("pf-goals"); if(g) p.goals=g.value.split("\n").map(s=>s.trim()).filter(Boolean);
  save(); closeSheet(); refresh(); toast("Saved");
}

function togglePref(k,elm){ DB.prefs[k]=!DB.prefs[k]; elm.classList.toggle("on",DB.prefs[k]); save(); }
function toggleCloudOn(elm){ DB.cloud.on=!DB.cloud.on; elm.classList.toggle("on",DB.cloud.on); save(); if(DB.cloud.on) cloudPush(false); }
function saveAI(){
  DB.ai.key=(el("setKey").value||"").trim();
  DB.ai.model=el("setModel").value;
  save(); toast(DB.ai.key?"Saved":"Key cleared");
}
async function testAI(){
  const m=el("aiMsg"); m.textContent="Testing…";
  DB.ai.key=(el("setKey").value||"").trim(); DB.ai.model=el("setModel").value; save();
  const r=await aiJSON("Reply with the single word ready.","test",S_MESSAGE,"t",40);
  m.textContent = r? "Connected. The coach is live." : "No reply — check the key and the model.";
}
function saveCloudSettings(){
  DB.cloud.syncId=(el("setSync").value||"").trim()||FB_SYNC_DEFAULT;
  save(); cloudPush(false); renderSettings();
}
async function showCloudStatus(){
  const m=el("cloudMsg"); m.textContent="Checking…";
  const s=await cloudStatus(); m.textContent=s.msg;
}
function confirmReset(){
  openSheet("Erase everything",
    '<p class="muted">Every check-in, session, record, measurement, photograph and cycle entry on this device. It cannot be undone. Export a backup first if you are not certain.</p>'+
    '<button class="btn danger" style="margin-top:18px" onclick="doReset()"><span class="lbl">Erase it all</span></button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()"><span class="lbl">Keep my data</span></button>');
}
function doReset(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  idbSet(null);
  const fresh=mergeDefaults(null);
  Object.keys(DB).forEach(k=>delete DB[k]);
  Object.assign(DB,fresh);
  CI_DRAFT=null; save(); closeSheet(); go("home"); toast("Erased");
}

/* =====================================================================
   BOOT
   ===================================================================== */
function migrate(){
  /* Make sure today's session exists and matches the programme, without
     ever rewriting one that is already under way. */
  const d=today();
  if(!DB.sessions) DB.sessions={};
  const w=DB.sessions[d];
  if(!w){ DB.sessions[d]=buildSession(d); }
  else if(!w.rest && !w.deleted && !w.state.startedAt && !w.edited && !w.analysis){
    DB.sessions[d]=buildSession(d,w.mode||"full");
  }
  /* Yesterday's unfinished session stops being "live". */
  Object.keys(DB.sessions).forEach(k=>{
    if(k<d){ const s=DB.sessions[k]; if(s&&s.state&&s.state.startedAt&&!s.state.finished){ s.state.paused=true; } }
  });
  /* Trim the store so it never outgrows a Firestore document. */
  const keys=Object.keys(DB.sessions).sort();
  if(keys.length>200) keys.slice(0,keys.length-200).forEach(k=>delete DB.sessions[k]);
  updateStreak(d);
  save();
}
function boot(){
  try{ migrate(); }catch(e){ console.error("migrate",e); }
  try{ dailyNudge(); }catch(e){ console.error("nudge",e); }
  go("home",{force:true});
  if(DB.cloud && DB.cloud.on){ setTimeout(()=>{ cloudPush(true); },4000); }
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){
      if(today()!==(DB._lastDay||today())){ DB._lastDay=today(); migrate(); }
      if(CUR==="train") renderTrain();
    }
  });
  DB._lastDay=today();
  window.addEventListener("error",e=>{ console.error("uncaught",e.message); });
}
document.addEventListener("DOMContentLoaded",boot);
if(document.readyState!=="loading") boot();

</script>
