/* =====================================================================
   TRAIN — the live session.
   One obvious action on screen, everything else one tap away.
   Every timer is a timestamp so a locked phone, a backgrounded tab and a
   page refresh all produce the same number.
   ===================================================================== */
let TICK=null;

function W(){ return sessionFor(today(),true); }
function curBlock(w){ return (w.blocks||[])[w.state.b]||null; }
function curItem(w){ const b=curBlock(w); return b? b.items[w.state.i]||null : null; }
function doneKey(w,item){ return w.state.b+"-"+w.state.r+"-"+item.id; }
function isDone(w,item){ return !!(w.state.done||{})[doneKey(w,item)]; }
function itemLoad(it){ return it.forceKg? "kg" : ((EX(it.ex)||{}).load||"bw"); }
function toTop(){ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){} }
function blockKind(b){ return b.flow? "Flow" : (b.items.length<2? "Straight sets" : (b.items.length>2?"Circuit":"Superset")); }

/* ---------- the one ticker ---------- */
function startTicking(){
  if(TICK) clearInterval(TICK);
  TICK=setInterval(tick,250);
  tick();
}
function stopTicking(){ if(TICK){ clearInterval(TICK); TICK=null; } holdScreen(false); }
function tick(){
  const w=(DB.sessions||{})[today()];
  if(!w||!w.state){ return; }
  const c=el("sessClock");
  if(c) c.textContent=fmtClock(sessionElapsed(w)/1000);
  paintRest(w);
  paintWork(w);
  maybeAutoStart(w);
}

/* ---------- pause and resume ---------- */
function togglePause(){
  const w=W();
  const c=w.state.clock;
  if(!c.startedAt) return;
  unlockAudio();
  if(c.pausedAt){
    /* resume: give every running countdown back exactly what it had */
    c.pausedMs=(c.pausedMs||0)+(Date.now()-c.pausedAt);
    c.pausedAt=null;
    if(w.state.rest && w.state.rest.left!=null){
      w.state.rest.endsAt=Date.now()+w.state.rest.left*1000; w.state.rest.left=null;
    }
    if(w.state.work && w.state.work.left!=null){
      w.state.work.endsAt=Date.now()+w.state.work.left*1000; w.state.work.left=null;
    }
    if(w.state.lead && w.state.lead.left!=null){
      w.state.lead.endsAt=Date.now()+w.state.lead.left*1000; w.state.lead.left=null;
    }
  } else {
    c.pausedAt=Date.now();
    if(w.state.rest) w.state.rest.left=Math.max(0,(w.state.rest.endsAt-Date.now())/1000);
    if(w.state.work) w.state.work.left=Math.max(0,(w.state.work.endsAt-Date.now())/1000);
    if(w.state.lead) w.state.lead.left=Math.max(0,(w.state.lead.endsAt-Date.now())/1000);
  }
  save(); renderTrain();
}
function pauseBtnHTML(){
  const w=W(), p=isPaused(w);
  return '<button class="pausebtn'+(p?" on":"")+'" onclick="togglePause()">'+
    (p?ICO.play:ICO.pause)+'<span>'+(p?"Resume":"Pause")+'</span></button>';
}

/* ---------- rest ---------- */
function beginRest(kind,seconds,nextName,label){
  const w=W();
  clearCue("rest"); clearCue("work"); clearCue("lead");
  w.state.lead=null;
  if(!seconds){ w.state.rest=null; save(); renderTrain(); return; }
  w.state.rest={ kind, total:seconds, endsAt:Date.now()+seconds*1000,
                 left: isPaused(w)? seconds : null, next:nextName||"", label:label||"Rest" };
  save(); renderTrain();
}
function restLeft(w){
  const r=w.state.rest; if(!r) return 0;
  if(r.left!=null) return r.left;
  return Math.max(0,(r.endsAt-Date.now())/1000);
}
function bumpRest(d){
  const w=W(), r=w.state.rest; if(!r) return;
  if(r.left!=null) r.left=Math.max(0,r.left+d);
  else r.endsAt=Math.max(Date.now(),r.endsAt+d*1000);
  r.total=Math.max(r.total,restLeft(w));
  /* a change she makes on the clock is a change she meant */
  if(r.kind&&DB.prefs.rest[r.kind]!=null) DB.prefs.rest[r.kind]=Math.max(0,Math.round(DB.prefs.rest[r.kind]+d));
  save(); paintRest(w);
}
function endRest(){
  const w=W();
  w.state.rest=null; clearCue("rest"); save(); renderTrain();
}
function paintRest(w){
  const ov=el("restOverlay");
  if(!w.state.rest){ if(ov.classList.contains("show")) ov.classList.remove("show"); return; }
  if(!ov.classList.contains("show")) ov.classList.add("show");
  const left=restLeft(w), r=w.state.rest;
  el("restNum").textContent=fmtClock(Math.max(0,left));
  el("restLab").textContent=r.label||"Rest";
  el("restNext").textContent=r.next||"—";
  const arc=el("restArc"), C=339.3;
  arc.style.strokeDashoffset=String(C*(1-clamp(left/(r.total||1),0,1)));
  const pb=el("restPause");
  if(pb) pb.innerHTML=(isPaused(w)?ICO.play:ICO.pause)+'<span>'+(isPaused(w)?"Resume":"Pause")+'</span>';
  if(!isPaused(w)) cueCountdown("rest",left);
  if(left<=0.2 && !isPaused(w)){
    clearCue("rest");
    alertDone();
    if(r.next) say("Next. "+r.next);
    endRest();
  }
}
function alertDone(){ cueDone(); }

/* ---------- timed exercises ---------- */
/* ---------- the working timer ----------
   It counts her in, runs itself, calls the side change, and moves on. The
   only reason to look at the phone is to see the picture. */
const LEAD_SECS = 5;
function startWork(id,opts){
  const w=W(), f=findItem(w,id); if(!f) return;
  unlockAudio();
  /* tapping a running timer stops it, and stops it starting itself again */
  if(!(opts&&opts.auto) && (w.state.work||w.state.lead) &&
     ((w.state.work&&w.state.work.itemId===id)||(w.state.lead&&w.state.lead.itemId===id))){
    w.state.work=null; w.state.lead=null;
    f.item.noAuto=true;
    clearCue("work"); clearCue("lead");
    save(); renderTrain(); return;
  }
  const secs=f.item.time||30;
  w.state.lead=null; clearCue("lead"); clearCue("work");
  w.state.work={ itemId:id, total:secs, side:1, endsAt:Date.now()+secs*1000, left:isPaused(w)?secs:null };
  if(!(opts&&opts.quiet)) cueGo();
  save(); renderTrain();
}
/* A short count-in so she is not caught halfway into position. */
function leadIn(id){
  const w=W(), f=findItem(w,id); if(!f) return;
  w.state.lead={ itemId:id, total:LEAD_SECS, endsAt:Date.now()+LEAD_SECS*1000,
                 left:isPaused(w)?LEAD_SECS:null };
  clearCue("lead");
  save();
}
function leadLeft(w){
  const k=w.state.lead; if(!k) return 0;
  if(k.left!=null) return k.left;
  return Math.max(0,(k.endsAt-Date.now())/1000);
}
function workLeft(w){
  const k=w.state.work; if(!k) return 0;
  if(k.left!=null) return k.left;
  return Math.max(0,(k.endsAt-Date.now())/1000);
}
/* Start the clock for a timed movement the moment it comes up, unless she
   has turned that off or stopped this one by hand. */
function maybeAutoStart(w){
  if(DB.prefs.autoTimer===false) return;
  if(w.state.phase!=="work" || w.state.rest || isPaused(w)) return;
  if(w.state.work || w.state.lead) return;
  const it=curItem(w);
  if(!it || !it.time || it.noAuto || isDone(w,it)) return;
  leadIn(it.id);
}
function paintWork(w){
  const b=el("workBtn"); if(!b) return;
  const it=curItem(w);
  if(!it){ return; }
  /* counting her in */
  if(w.state.lead && w.state.lead.itemId===it.id){
    const l=leadLeft(w);
    b.classList.add("running");
    b.innerHTML='<span class="lbl">Get ready · '+Math.max(0,Math.ceil(l))+'</span>';
    if(!isPaused(w)) cueCountdown("lead",l);
    if(l<=0.15 && !isPaused(w)){
      w.state.lead=null; clearCue("lead");
      startWork(it.id,{auto:true});
    }
    return;
  }
  const k=w.state.work;
  if(!k || k.itemId!==it.id){
    b.classList.remove("running");
    b.innerHTML=ICO.play+'<span class="lbl">Start '+(it.time||0)+'s</span>';
    return;
  }
  const left=workLeft(w);
  b.classList.add("running");
  const sideTag = it.side? ('<small>'+(k.side===2?"second side":"first side")+'</small>') : '';
  b.innerHTML=(isPaused(w)?ICO.play:ICO.pause)+'<span class="lbl num">'+fmtClock(left)+'</span>'+sideTag;
  if(!isPaused(w)) cueCountdown("work",left);
  if(left<=0.2 && !isPaused(w)){
    /* "each side" means two goes at it, with a call in between */
    if(it.side && k.side===1){
      clearCue("work");
      w.state.work={ itemId:it.id, total:k.total, side:2,
                     endsAt:Date.now()+k.total*1000, left:null };
      cueSwap(); say("Swap sides");
      save(); renderTrain(); return;
    }
    w.state.work=null; clearCue("work");
    alertDone();
    completeItem(it.id);
  }
}

/* ---------- starting and finishing ---------- */
function startWorkout(){
  const w=W(); unlockAudio(); holdScreen(true);
  w.state.clock.startedAt=w.state.clock.startedAt||Date.now();
  w.state.clock.pausedAt=null;
  w.state.phase=(w.prep&&w.prep.length)?"prep":"work";
  save(); renderTrain(); startTicking(); toTop();
}
function skipPrep(){ const w=W(); w.state.phase="work"; save(); renderTrain(); toTop(); }
function finishSession(){
  const w=W();
  holdScreen(false);
  completeSession(w);
  pushCoach(pickLine("done",parseISO(w.date).getDate()));
  stopTicking(); renderTrain(); beep(3); toTop();
}
function endWorkout(){ finishSession(); }
let UNDO=null;
function snapshotFor(date){
  const d=date||today();
  return { date:d, label:"",
    session: DB.sessions[d]? JSON.parse(JSON.stringify(DB.sessions[d])) : null,
    strength: JSON.parse(JSON.stringify(DB.strength||{})),
    prs: JSON.parse(JSON.stringify(DB.prs||[])),
    streak: DB.streak||0 };
}
function undoLast(){
  if(!UNDO){ toast("Nothing to undo"); return; }
  const u=UNDO; UNDO=null;
  if(u.session) DB.sessions[u.date]=u.session; else delete DB.sessions[u.date];
  DB.strength=u.strength; DB.prs=u.prs; DB.streak=u.streak;
  save(); refresh(); toast("Put back");
}

/* ---------- stop, discard, delete ----------
   Three different things, so the sheet says which is which. */
function stopSheet(){
  const w=W();
  const live=!!(w.state.clock&&w.state.clock.startedAt);
  const fin=!!w.state.finished;
  const lg=loggedOn(w.date);
  const what = lg.sets? plural(lg.sets,"set")+" across "+plural(lg.exercises,"exercise")+
      (lg.prs? " and "+plural(lg.prs,"record"):"") : "nothing yet";
  let body='<p class="muted" style="margin-bottom:18px">Logged today: <b>'+what+'</b>.</p>';
  if(live && !fin){
    body+='<button class="btn sec" onclick="closeSheet();endWorkout()"><span class="lbl">Stop and keep what I did</span></button>'+
      '<p class="tiny dim" style="margin:8px 2px 18px">Saves the sets you completed and closes the session.</p>';
  }
  body+='<button class="btn danger" onclick="closeSheet();confirmDiscard()"><span class="lbl">'+
      (fin?"I didn\'t actually do this":"Stop and throw it away")+'</span></button>'+
    '<p class="tiny dim" style="margin:8px 2px 18px">Removes every set logged today from your history, '+
      'takes back any record claimed today, and puts a fresh session in its place. Your check-in is kept.</p>'+
    '<button class="btn ghost" onclick="closeSheet();confirmClear()"><span class="lbl">Clear today entirely</span></button>'+
    '<p class="tiny dim" style="margin:8px 2px 0">No session at all today. You can rebuild it whenever you want.</p>';
  openSheet(fin?"This session":"Stop the workout", body);
}
function confirmDiscard(){
  const lg=loggedOn(today());
  openSheet("Throw it away?",
    '<p class="muted">'+(lg.sets? plural(lg.sets,"set")+" will be removed from your history"+
      (lg.prs? " along with "+plural(lg.prs,"record") : "")+"." : "Nothing was logged, so there is nothing to remove.")+
    ' A fresh '+esc((DB.sessions[today()]||{}).title||"session")+' takes its place.</p>'+
    '<button class="btn danger" style="margin-top:20px" onclick="doDiscard(true)"><span class="lbl">Yes, it never happened</span></button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()"><span class="lbl">Keep it</span></button>');
}
function confirmClear(){
  openSheet("Clear today?",
    '<p class="muted">Today becomes an empty day — no session, and anything logged today is removed. '+
    'Rebuild it from the Train screen whenever you want.</p>'+
    '<button class="btn danger" style="margin-top:20px" onclick="doDiscard(false)"><span class="lbl">Clear the day</span></button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()"><span class="lbl">Keep it</span></button>');
}
function doDiscard(keepPlan){
  const d=today();
  UNDO=snapshotFor(d); UNDO.label="discard";
  stopTicking();
  discardSession(d,keepPlan);
  closeSheet(); renderTrain(); toTop();
  toast(keepPlan? "Discarded — fresh session ready" : "Today cleared");
  pushCoach(keepPlan? "Wiped. That one doesn't count. Start it properly."
                    : "Today cleared. Nothing logged.");
}
/* Cancel, from inside a running workout. Deliberately one tap to reach and
   one confirmation to commit, because it removes sets that were logged. */
function cancelWorkout(){
  const w=W();
  const lg=loggedOn(w.date);
  openSheet("Cancel this workout?",
    '<p class="muted">'+(lg.sets
      ? plural(lg.sets,"set")+" logged today will be removed from your history"+
        (lg.prs? " along with "+plural(lg.prs,"record") : "")+"."
      : "Nothing has been logged yet, so nothing is lost.")+
    ' A fresh '+esc(w.title||"session")+' takes its place, ready when you are.</p>'+
    '<button class="btn danger" style="margin-top:20px" onclick="doDiscard(true)">'+
      '<span class="lbl">Yes, cancel the workout</span></button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">'+
      '<span class="lbl">Keep training</span></button>'+
    '<p class="tiny dim" style="margin:14px 2px 0">You can undo this straight afterwards.</p>');
}
function deleteWorkout(){ stopSheet(); }

/* Any day, not just today — from the calendar or from history. */
function confirmDiscardDay(date){
  if(date===today()){ closeSheet(); stopSheet(); return; }
  const lg=loggedOn(date);
  const s=(DB.sessions||{})[date]||{};
  openSheet("Delete "+ukLong(date)+"?",
    '<p class="muted">'+esc(s.title||"That session")+' will be removed'+
      (lg.sets? ", along with "+plural(lg.sets,"set")+" logged that day"+
        (lg.prs? " and "+plural(lg.prs,"record") : "")+"." : ".")+'</p>'+
    '<button class="btn danger" style="margin-top:20px" onclick="doDiscardDay(\''+date+'\')"><span class="lbl">Delete it</span></button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()"><span class="lbl">Keep it</span></button>');
}
function doDiscardDay(date){
  UNDO=snapshotFor(date); UNDO.label="deleted "+uk(date);
  discardSession(date,true);
  closeSheet(); refresh();
  toast(uk(date)+" deleted");
}

/* ---------- why this workout ----------
   Three reasons at most, every one of them from something she actually did.
   If the engine cannot say why, it says so rather than inventing a reason. */
function whySheet(date){
  const w=sessionFor(date||today(),true);
  if(!w || w.rest){ openSheet("Why this workout?","<p class=\"muted\">Today is a scheduled rest day.</p>"); return; }
  const why=(w.why||[]);
  const anchors=(w.blocks||[]).flatMap(b=>b.items).filter(i=>i.role==="anchor");
  openSheet("Why this workout?",
    (why.length
      ? '<ol class="whylist">'+why.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol>'
      : '<p class="muted">This one came straight from the programme — nothing in your check-in changed it.</p>')+
    '<div class="hair"></div>'+
    '<div class="listrow"><span class="k">Block week</span><span class="v num">'+(w.blockWeek||1)+' of 4</span></div>'+
    '<div class="listrow"><span class="k">Length</span><span class="v num">'+w.mins+' min</span></div>'+
    (anchors.length? '<div class="listrow stacked"><span class="k">Held for progress</span>'+
      '<span class="v">'+esc(anchors.map(a=>a.ex).join(", "))+'</span></div>':'')+
    ((w.adjustments||[]).length? '<div class="eyebrow" style="margin:18px 0 8px">From your check-in</div>'+
      (w.adjustments||[]).map(a=>'<p class="muted small" style="margin-bottom:6px">'+esc(a)+'</p>').join(""):'')+
    '<button class="btn ghost sm" style="margin-top:18px" onclick="closeSheet();rebuildWorkout()">'+
      '<span class="lbl">Build me a different one</span></button>');

function rebuildWorkout(){
  const d=today();
  const prev=DB.sessions[d];
  UNDO=snapshotFor(d); UNDO.label="rebuild";
  coach().nonce=(coach().nonce||0)+1;   /* ask again and you get a different answer */
  /* asking for a different one on a day she had asked to keep is her changing
     her mind — the favourite steps aside rather than rebuilding itself */
  let dropped=false;
  if(prev && prev.replay && prev.dayKey){ delete coach().favourites[prev.dayKey]; dropped=true; }
  regenerate(d,(prev&&prev.duration)||DB.prefs.lastDuration||"full");
  const ci=checkinOn(d);
  if(ci&&ci.analysed) applyCheckin(DB.sessions[d],ci);
  save(); renderTrain();
  toast(dropped? "Something different — that one won't repeat now" : "Rebuilt");
}

/* ---------- flow ---------- */
function completeItem(id){
  const w=W(); const b=curBlock(w); if(!b) return;
  const f=findItem(w,id); if(!f) return;
  const it=f.item;
  if(w.state.work && w.state.work.itemId===id) w.state.work=null;
  const payload={};
  if(itemLoad(it)==="kg"&&it.weight) payload.w=it.weight;
  if(it.time) payload.sec=it.time;
  else if(typeof it.reps==="number") payload.r=it.reps;
  else if(it.reps) payload.txt=String(it.reps);     /* "20 steps" and the like */
  const pr=logSet(w,id,payload);
  w.state.done=w.state.done||{};
  w.state.done[doneKey(w,it)]={at:Date.now(),...payload};
  if(pr) celebratePR(pr);
  advance(w,b);
}
function advance(w,b){
  const lastIdx=b.items.length-1;
  if(w.state.i<lastIdx){
    const next=b.items[w.state.i+1];
    w.state.i++;
    const change=restFor(w,b,"superset",b.items[w.state.i-1]);
    save();
    if(change>0) beginRest("superset",change,next.ex,"Changeover");
    else { renderTrain(); toTop(); }
    return;
  }
  if(w.state.r<b.rounds){
    w.state.i=0; w.state.r++;
    save();
    beginRest("round",restFor(w,b,"round"),b.items[0].ex,"Rest · round "+w.state.r+" of "+b.rounds);
    return;
  }
  if(w.state.b<(w.blocks.length-1)){
    const nb=w.blocks[w.state.b+1];
    w.state.b++; w.state.r=1; w.state.i=0;
    save();
    beginRest("block",restFor(w,b,"block"),nb.items[0].ex,"Block "+b.label+" done");
    toTop();
    return;
  }
  w.state.phase=(w.cooldown&&w.cooldown.length)?"cool":"done";
  if(w.state.phase==="done") finishSession();
  else { save(); renderTrain(); toTop(); }
}
function skipItem(){
  const w=W(), b=curBlock(w); if(!b) return;
  const it=curItem(w); if(!it) return;
  w.state.lead=null; clearCue("lead"); clearCue("work");
  w.state.done=w.state.done||{};
  w.state.done[doneKey(w,it)]={skipped:true,at:Date.now()};
  w.state.work=null;
  advance(w,b);
  toast("Skipped");
}
function prevItem(){
  const w=W();
  w.state.rest=null; w.state.work=null;
  if(w.state.phase==="cool"){ w.state.phase="work"; save(); renderTrain(); return; }
  if(w.state.i>0){ w.state.i--; }
  else if(w.state.r>1){ w.state.r--; w.state.i=(curBlock(w).items.length-1); }
  else if(w.state.b>0){ w.state.b--; w.state.r=curBlock(w).rounds; w.state.i=curBlock(w).items.length-1; }
  else if(w.prep&&w.prep.length){ w.state.phase="prep"; }
  save(); renderTrain(); toTop();
}
function togglePrep(id){
  const w=W();
  w.state.prepDone=w.state.prepDone||{};
  if(w.state.prepDone[id]) delete w.state.prepDone[id]; else w.state.prepDone[id]=true;
  save();
  if((w.prep||[]).every(p=>w.state.prepDone[p.id])){
    w.state.phase="work"; save(); toast("Warm-up done. Block A."); toTop();
  }
  renderTrain();
}
function toggleCool(id){
  const w=W();
  w.state.coolDone=w.state.coolDone||{};
  if(w.state.coolDone[id]) delete w.state.coolDone[id]; else w.state.coolDone[id]=true;
  save(); renderTrain();
}

/* ---------- editing the prescription ---------- */
let EDIT_OPEN=null;
function toggleEdit(id){ EDIT_OPEN = (EDIT_OPEN===id)? null : id; renderTrain(); }
function bumpItem(id,key,dir){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item, d=(typeof dir==="number"?dir:1);
  if(key==="weight"){
    const v=it.weight||0, step=v<10?0.5:(v<30?1.25:2.5);
    it.weight=Math.max(0,roundLoad(v+step*d)); it.askedLoad=true;
  }
  else if(key==="time"){ it.time=Math.max(5,(it.time||30)+5*d); }
  else { it.reps=Math.max(1,(it.reps||10)+1*d); }
  w.edited=true; save();
  const n=el("mv-"+key+"-"+id);
  if(n) n.innerHTML = key==="weight"? ((it.weight||0)+' <small>kg</small>')
      : (key==="time"? (it.time+' <small>s</small>') : (it.reps+' <small>reps</small>'));
  const t=el("st-"+key+"-"+id);
  if(t) t.innerHTML = key==="weight"? ((it.weight||0)+' <small>kg</small>')
      : (key==="time"? (it.time+' <small>s</small>') : (it.reps+' <small>reps</small>'));
  if(!n&&!t) renderTrain();
}
function makeWeighted(id){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  it.forceKg=true; it.load="kg";
  if(it.weight==null) it.weight=(startingLoad(it.ex)||{}).kg||5;
  w.edited=true; save(); renderTrain(); toast("Now logged in kilograms");
}
function answerLoad(id,up,target){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  it.askedLoad=true;
  if(up){
    it.weight = (target && target>0)? target : roundLoad((it.weight||0)+loadStep(it.weight||0));
    toast("Up to "+kgTxt(it.weight)+". Own it.");
  }
  save(); renderTrain();
}
function toggleTiming(id){
  const w=W(), f=findItem(w,id); if(!f) return;
  const it=f.item;
  if(it.time){ it.reps=12; it.time=null; }

/* ---------- the screen ---------- */
function renderTrain(){
  const d=today();
  let w=(DB.sessions||{})[d];
  if(!w) w=sessionFor(d,true);
  const wrap=el("trainWrap");

  if(w.rest || w.deleted){
    stopTicking();
    wrap.innerHTML=trainHead(w.deleted?"No session":"Rest day", DOW_FULL[dowOf(d)]+" · "+uk(d))+
      '<div class="card pad-lg"><h2>'+(w.deleted?"You cleared today":"Rest day")+'</h2>'+
      '<p class="muted" style="margin-top:10px">'+(w.deleted
        ? "Build it back whenever you want."
        : "Saturdays and Sundays are scheduled recovery. Nothing to do.")+'</p>'+
      '<div class="btn-row" style="margin-top:18px">'+
        '<button class="btn sec" onclick="startMobility()"><span class="lbl">Mobility flow</span></button>'+
        (w.deleted?'<button class="btn" onclick="rebuildWorkout()"><span class="lbl">Rebuild today</span></button>':'')+
      '</div>'+(UNDO?'<button class="btn ghost sm" style="margin-top:10px" onclick="undoLast()"><span class="lbl">Undo</span></button>':'')+'</div>';
    return;
  }
  if(w.state.finished){ stopTicking(); wrap.innerHTML=finishedHTML(w); return; }
  if(w.state.phase==="ready" || !w.state.clock.startedAt){ stopTicking(); wrap.innerHTML=readyHTML(w); return; }

  const b=curBlock(w), it=curItem(w);
  let body;
  if(w.state.phase==="prep") body=prepHTML(w);
  else if(w.state.phase==="cool") body=coolHTML(w);
  else if(!b||!it){ wrap.innerHTML=finishedHTML(w); return; }
  else body=exerciseHTML(w,b,it)+upNextHTML(w,b);

  wrap.innerHTML=liveHead(w)+sessionStrip(w)+body;
  startTicking();
  preloadNext(w,b);
}

/* Only ever two images in flight: the one on screen and the one after it. */
let _preloaded={};
function preloadNext(w,b){
  try{
    if(w.state.phase!=="work"||!b) return;
    let next=b.items[w.state.i+1];
    if(!next){
      const nb=(w.blocks||[])[w.state.b+1];
      next=(w.state.r<b.rounds)? b.items[0] : (nb? nb.items[0] : null);
    }
    if(!next) return;
    const url=mediaFor(next.ex);
    if(!url||_preloaded[url]) return;
    _preloaded[url]=1;
    const img=new Image(); img.decoding="async"; img.src=url;
  }catch(e){}
}
function trainHead(title,sub){

    '<span class="lbl">'+EFFORT_LABEL[k]+'</span></button>';

    body+='<div class="hair"></div><div class="eyebrow">How did that feel?</div>'+

function fbRate(k){
  const w=W(); const cur=feedbackFor(w.date)||{};

/* ---------- swap ---------- */
function swapSections(w,id){
  const f=findAnyItem(w,id); if(!f) return [];
  const it=f.item, e=EX(it.ex)||{};
  const all=replacementsFor(w,id,40);
  const byName=n=>all.find(o=>o.name===n);
  const used=new Set(), out=[];
  const take=(title,list,fallbackWhy)=>{
    const o=list.filter(x=>x && EX(x.name||x) && !used.has(x.name||x))[0];
    if(!o) return;
    const name=o.name||o;
    used.add(name);
    out.push({title, items:[{name, why:(o.why)||fallbackWhy}]});
  };
  /* the three she actually wants: kinder, the same, or with other kit */
  take("Easier",
    [e.easier&&{name:e.easier,why:"a kinder version of the same movement"},
     ...all.filter(o=>(EX(o.name)||{}).easier===it.ex).map(o=>({...o,why:"a step below"}))],
    "a step below");
  take("Same level",
    all.filter(o=>(EX(o.name)||{}).pat===e.pat),
    "same pattern, same muscle");
  take("Different kit",
    all.filter(o=>(EX(o.name)||{}).eq!==e.eq),
    "same job, other equipment");
  /* and the rest, for when none of those is right */
  const more=all.filter(o=>!used.has(o.name)).slice(0,3);
  if(e.harder && EX(e.harder) && !used.has(e.harder)){
    out.push({title:"Harder", items:[{name:e.harder, why:"a step up when you are ready"}]});
    used.add(e.harder);
  }
  if(more.length) out.push({title:"Others that fit", items:more.filter(o=>!used.has(o.name)).slice(0,3)});
  return out;
}
function openReplace(id){
  const w=W(), f=findAnyItem(w,id); if(!f) return;

      s.items.map(o=>pickRow(o.name,o.why,"doReplace('"+id+"','"+esc(o.name).replace(/'/g,"\\'")+"')")).join("")).join("")+
    '<button class="btn sec" style="margin-top:14px" onclick="openBrowse(\''+id+'\')">'+ICO.search+

let BROWSE_FOR=null, BROWSE_GRP=null, BROWSE_Q="", BROWSE_EQ=null;
function groupedNames(){
  const g={};
  allNames().forEach(n=>{ const e=EX(n); if(!e) return; const k=(e.m||["mobility"])[0]; (g[k]=g[k]||[]).push(n); });
  return g;
}
function filterNames(opts){
  const o=opts||{};
  const g=groupedNames();
  let list = o.grp? (g[o.grp]||[]) : allNames();
  const q=(o.q||"").trim().toLowerCase();
  if(q) list=allNames().filter(n=>n.toLowerCase().includes(q) ||
    ((EX(n)||{}).m||[]).some(m=>muscleLabel(m).toLowerCase().includes(q)) ||
    (EQUIP_LABEL[(EX(n)||{}).eq]||"").toLowerCase().includes(q));
  if(o.eq) list=list.filter(n=>(EX(n)||{}).eq===o.eq);
  if(o.exclude) list=list.filter(n=>!o.exclude.has(n));
  return list;
}

function savePain(){
  const v=+el("pnScale").value;
  const where=[...document.querySelectorAll("#pnWhere .chip.blue")].map(b=>b.dataset.w);
  const note=(el("pnNote").value||"").trim();
  const d=today();
  const ci=checkinOn(d)||{id:uid(),date:d,sleep:5,energy:5,soreness:0,stress:0,neck:0,pain:0,time:"full",pelvic:[],cycleSymptoms:[]};
  ci.pain=Math.max(ci.pain||0,v);
  if(where.includes("Neck")) ci.neck=Math.max(ci.neck||0,v);
  ci.painReports=(ci.painReports||[]).concat([{at:Date.now(),v,where,note}]);
  if(where.some(x=>/Abdomen|Pelvic/.test(x))) ci.pelvic=[...new Set([...(ci.pelvic||[]),"Abdominal discomfort"])];
  DB.checkins[d]=ci;
  const w=W();
  const changes=applyCheckin(w,ci);
  save(); closeSheet(); renderTrain();
  const severe = v>=8 || /numb|tingl|shoot|radiat|weak|dizz/i.test(note);
  if(severe){
    openSheet("Stop the session",
      '<div class="cue" style="background:var(--bad-soft);color:var(--bad)">'+ICO.pain+
      '<span>That is not something to train through. Stop now and get it assessed by a doctor or physiotherapist before the next session.</span></div>'+
      '<button class="btn" style="margin-top:18px" onclick="closeSheet();endWorkout()"><span class="lbl">End the session</span></button>');
  } else {
    toast(changes.length? "Session adjusted" : "Logged");
    pushCoach(changes.length? "Adjusted: "+changes[0] : "Logged. Report it again if it gets worse.");
  }
}

/* =====================================================================
   PROGRESS — pictures and numbers, not paragraphs. Weight is present
   but small: the goal is shape and strength at the same bodyweight.
   ===================================================================== */
function sparkline(values,w,h){
  if(!values.length) return "";
  const W=w||120,H=h||34;
  const min=Math.min(...values), max=Math.max(...values), span=(max-min)||1;
  const pts=values.map((v,i)=>[(i/(values.length-1||1))*W, H-((v-min)/span)*(H-6)-3]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="#2B54F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function lineChart(series,label){
  const pts=series.filter(p=>p.v!=null);
  if(pts.length<2) return '<div class="empty"><p>Not enough logged yet.</p></div>';
  const W=320,H=110,P=8;
  const vals=pts.map(p=>p.v);
  const min=0, max=Math.max(10,Math.max(...vals));
  const x=i=>P+(i/(series.length-1))*(W-P*2);
  const y=v=>H-P-((v-min)/(max-min))*(H-P*2);
  let d="",area="";
  pts.forEach((p,i)=>{ const idx=series.indexOf(p); d+=(i?"L":"M")+x(idx).toFixed(1)+" "+y(p.v).toFixed(1)+" "; });
  area=d+"L"+x(series.indexOf(pts[pts.length-1])).toFixed(1)+" "+(H-P)+" L"+x(series.indexOf(pts[0])).toFixed(1)+" "+(H-P)+" Z";
  return '<svg class="linechart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(label||"trend")+'">'+
    '<path d="'+area+'" fill="rgba(43,84,242,.10)"/>'+
    '<path d="'+d+'" fill="none" stroke="#2B54F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.slice(-1).map(p=>'<circle cx="'+x(series.indexOf(p)).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.5" fill="#2B54F2"/>').join("")+
    '</svg>';
}
const KEY_LIFTS=["Hip Thrust","Romanian Deadlift","Deadlift","Goblet Squat","Seated Cable Row","Lat Pulldown",
  "Bulgarian Split Squat","DB Chest Press","Push-up","Chest-supported DB Row"];
/* ---------- am I getting stronger ----------
   The lifts the programme is holding still on purpose, and what has happened
   to them since it started holding them. This is the answer to the only
   question that matters when the sessions keep changing. */
function buildingRows(){
  const c=coach();
  const keys=Object.keys(c.anchors||{});
  if(!keys.length) return '<p class="muted small">Nothing held yet — finish a session and the main lifts settle in.</p>';
  const seen=new Set();
  const rows=keys.map(k=>c.anchors[k]).filter(a=>{
    if(!a||!a.ex||seen.has(a.ex)) return false; seen.add(a.ex); return true;
  }).map(a=>{
    const h=[...history(a.ex)].filter(e=>e.date>=a.since).sort((x,y)=>x.date<y.date?-1:1);
    const first=topSet(h[0]), last=topSet(h[h.length-1]);
    const fw=(first&&first.w)||0, lw=(last&&last.w)||0;
    const fr=(first&&first.r)||0, lr=(last&&last.r)||0;
    let delta="", cls="";
    if(fw&&lw&&lw>fw){ delta="+"+kgTxt(lw-fw); cls="good"; }
    else if(fw&&lw&&lw===fw&&lr>fr){ delta="+"+(lr-fr)+" reps"; cls="good"; }
    else if(h.length<2) delta="baseline";
    else delta="holding";
    return {ex:a.ex, since:a.since, sessions:h.length, now:last, delta, cls};
  });
  return rows.map(r=>'<div class="listrow"><span class="grow"><span class="k">'+esc(r.ex)+'</span>'+
    '<div class="tiny dim num" style="margin-top:2px">'+
      (r.now? esc(setText(r.now)) : "not logged yet")+' · held since '+ukShort(r.since)+'</div></span>'+
    '<span class="v"><span class="chip '+r.cls+'">'+esc(r.delta)+'</span></span></div>').join("");
}
function strengthRows(){
  const lifts=[...new Set([...KEY_LIFTS,...Object.keys(DB.strength||{})])]
    .filter(ex=>history(ex).length)
    .map(ex=>{
      const h=[...history(ex)].sort((a,b)=>a.date<b.date?-1:1);
      const series=h.map(e=>{ const t=topSet(e)||{}; return t.w||t.sec||t.r||0; });
      const best=bestEver(ex);
      const first=series[0]||0, lastV=series[series.length-1]||0;
      return {ex,series,best,delta:lastV-first,sessions:h.length};
    })
    .sort((a,b)=>b.sessions-a.sessions).slice(0,8);
  if(!lifts.length) return '<div class="empty">'+ICO.spark+'<p>Nothing logged yet. Finish a session and it fills in.</p></div>';
  return lifts.map(l=>'<div class="listrow"><span class="grow"><span class="k">'+esc(l.ex)+'</span>'+
    '<div class="tiny dim num" style="margin-top:2px">'+(l.best? (l.best.sec? l.best.sec+"s best" : setText(l.best)) : "—")+
    ' · '+plural(l.sessions,"session")+'</div></span>'+
    '<span class="v">'+sparkline(l.series,86,30)+(l.delta>0?'<span class="chip good">+'+(Math.round(l.delta*10)/10)+'</span>':'')+'</span></div>').join("");
}

    return x && !x.rest && !x.deleted && (x.blocks||[]).length && x.state &&

  }).sort().reverse().slice(0,n||6);
  if(!keys.length) return '<p class="muted small">Nothing logged yet. Finish a session and it appears here.</p>';
  return keys.map(k=>{
    const x=DB.sessions[k];
    const {done,total}=sessionSetsDone(x);
    const mins=Math.max(1,Math.round((x.elapsedMs||0)/60000));
    const r=ratingFor(k);
    const d=daysBetween(k,today());
    const when = d===0? "Today" : d===1? "Yesterday" : d<7? DOW_FULL[dowOf(k)] : ukShort(k);
    return '<button class="listrow" onclick="openDay(\''+k+'\')">'+
      '<span class="grow"><span class="k">'+esc(x.title)+'</span>'+
      '<div class="tiny dim num" style="margin-top:2px">'+esc(when)+' · '+done+' of '+total+' sets'+
        (x.elapsedMs? ' · '+mins+' min':'')+'</div></span>'+
      '<span class="v">'+
        (r==="up"? '<span class="chip good">'+ICO.thumbUp+'</span>' :
         r==="down"? '<span class="chip bad">'+ICO.thumbDown+'</span>' :
         x.state.finished? '<span class="chip good">'+ICO.check+'</span>' : '<span class="chip">part</span>')+
        ICO.chev+'</span></button>';
  }).join("");
}
/* The lifts that are due a step up, said the way a trainer would say it. */
function nudgeRows(){
  const notes=[];
  const seen=new Set();
  Object.keys(DB.strength||{}).forEach(ex=>{
    if(seen.has(ex)||!EX(ex)) return; seen.add(ex);
    const prev=lastBefore(ex,today());
    if(!prev || daysBetween(prev.date,today())>21) return;
    const n=progressNote(ex);
    if(n && n.up) notes.push({ex, n, date:prev.date});
  });
  notes.sort((a,b)=>a.date<b.date?1:-1);
  if(!notes.length) return '';
  return '<div class="card"><div class="eyebrow" style="margin-bottom:10px">Ready to go up</div>'+
    notes.slice(0,3).map(x=>'<div class="listrow stacked"><span class="k">'+esc(x.ex)+'</span>'+
      '<span class="v">'+esc(x.n.text)+'</span></div>').join("")+'</div>';
}

function addPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",0.72);
      DB.photos=(DB.photos||[]).concat([{id:uid(),date:today(),pose:window._pose||"Front",data}]);
      save(); closeSheet(); renderProgress(); toast("Saved to this device");
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
  input.value="";
}

/* =====================================================================
   COACH — typing only. Short, strict, and it can change today's session.
   ===================================================================== */
function pushCoach(text){
  if(!text) return;
  const last=(DB.chat||[]).slice(-1)[0];
  if(last && last.who==="coach" && last.text===text) return;   /* never repeat itself */
  DB.chat=(DB.chat||[]).concat([{who:"coach",text,at:Date.now()}]);
  if(DB.chat.length>200) DB.chat=DB.chat.slice(-200);
  save();
  if(CUR==="coach") renderChat();
}
function pushMe(text){
  DB.chat=(DB.chat||[]).concat([{who:"me",text,at:Date.now()}]); save();
}
let _sending=false;
async function sendChat(){
  const input=el("chatIn");
  const text=(input.value||"").trim();
  if(!text||_sending) return;
  input.value="";
  pushMe(text); renderChat();
  _sending=true;
  DB.chat.push({who:"coach",text:"…",typing:true}); renderChat();
  try{
    const r=await coachReply(text);
    DB.chat=DB.chat.filter(m=>!m.typing);
    pushCoach(r.message + (r.applied? " ("+r.applied+")" : ""));
    if(r.applied){ toast(r.applied); if(CUR==="train") renderTrain(); }
  }catch(e){
    DB.chat=DB.chat.filter(m=>!m.typing);
    pushCoach("Connection failed. Try again.");
  }
  _sending=false;
  renderChat();
}
function clearChat(){
  DB.chat=[]; save(); renderChat(); toast("Cleared");
}
function renderChat(){
  const log=el("chatLog");
  const d=today(), ci=checkinOn(d), w=(DB.sessions||{})[d];
  el("coachSub").textContent = w? (w.rest?"Rest day":w.title) : DOW_FULL[dowOf(d)];
  if(!(DB.chat||[]).length){
    const line = isRestDay(d)? pickLine("rest") : (!ci? pickLine("nocheckin") : pickLine("ready"));
    DB.chat=[{who:"coach",text:line,at:Date.now()}]; save();
  }
  log.innerHTML=(DB.chat||[]).map(m=>'<div class="msg '+(m.who==="me"?"me":"coach")+'">'+
    (m.typing? '<span class="spin dark"></span>' : esc(m.text).replace(/\n/g,"<br>"))+'</div>').join("")+
    (aiReady()?'':'<div class="msg coach" style="background:var(--warn-soft);color:var(--warn)">'+
      'No API key. I can still run the session, but I can\'t talk properly. '+
      '<button class="linkbtn" onclick="go(\'settings\')" style="color:inherit;text-decoration:underline">Add one</button></div>');
  requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}));
}
/* The daily nudge. Written once a day, never on every render. */
function dailyNudge(){
  const d=today();
  if(DB.lastNudge===d) return;
  DB.lastNudge=d;
  const y=addDays(d,-1);
  const yRest=isRestDay(y), yS=(DB.sessions||{})[y];
  const missed=!yRest && (!yS || !(yS.state&&yS.state.finished));
  if(isRestDay(d)) pushCoach(pickLine("rest",parseISO(d).getDate()));
  else if(missed) pushCoach(pickLine("missed",parseISO(d).getDate()));
  else if(!checkinOn(d)) pushCoach(pickLine("nocheckin",parseISO(d).getDate()));
  save();
}

/* ---------- which movements still need a picture ----------
   Asked for on purpose, never on a page load: it walks the whole catalogue
   against the demos folder and says exactly which filenames are missing. */
let _mediaScan=false;
function probeOne(name){
  return new Promise(res=>{
    let i=0;
    const next=()=>{
      if(i>=4) return res(false);
      const img=new Image();
      img.onload=()=>{ MEDIA_OK[name]=i; DEMOS_PRESENT=true; res(true); };
      img.onerror=()=>{ i++; next(); };
      img.src=demoURL(name,i);
    };
    next();
  });
}
async function checkMedia(){
  if(_mediaScan) return;
  _mediaScan=true;
  const names=EX_NAMES.slice();
  const msg=el("mediaMsg");
  const paint=t=>{ if(el("mediaMsg")) el("mediaMsg").textContent=t; };
  paint("Checking "+names.length+" movements…");
  const have=[], missing=[];
  for(let i=0;i<names.length;i+=8){
    const batch=names.slice(i,i+8);
    const got=await Promise.all(batch.map(probeOne));
    batch.forEach((n,j)=>(got[j]?have:missing).push(n));
    paint("Checking… "+Math.min(i+8,names.length)+" of "+names.length);
  }
  _mediaScan=false;
  DB.mediaScan={at:Date.now(), have:have.length, total:names.length};
  save();
  paint(have.length+" of "+names.length+" have a picture.");
  openSheet("Demonstration pictures",
    '<p class="muted"><b>'+have.length+'</b> of '+names.length+' movements have a picture in the demos folder. '+
    (missing.length? 'The rest fall back to the built-in animation or a labelled body map — nothing breaks.' : 'Every one of them is covered.')+'</p>'+
    (missing.length? '<div class="eyebrow" style="margin:18px 0 8px">Still missing ('+missing.length+')</div>'+
      '<p class="tiny dim" style="margin-bottom:10px">Filenames, ready for the folder. Any of jpg, webp, png, gif or mp4.</p>'+
      '<textarea class="txtin" rows="8" readonly style="font-size:12px">'+
        esc(missing.map(n=>slugOf(n)+".jpg").join("\n"))+'</textarea>' : '')+
    '<button class="btn sec" style="margin-top:14px" onclick="closeSheet();refresh()"><span class="lbl">Done</span></button>');
  refresh();
}

        '<div class="hint">Use the same word on every device. Your data lives at '+esc(cloudDocPath())+
        ' — separate from any other app in the project.</div></div>'+
      '<button class="btn sec" onclick="saveCloudSettings()"><span class="lbl">Save and connect</span></button>'+
      '<div class="btn-row" style="margin-top:10px">'+
        '<button class="btn ghost sm" onclick="cloudPush(false)"><span class="lbl">Back up now</span></button>'+
        '<button class="btn ghost sm" onclick="cloudPull(false)"><span class="lbl">Restore</span></button></div>'+
      '<button class="btn ghost sm" style="margin-top:10px" onclick="showCloudStatus()"><span class="lbl">Check the connection</span></button>'+
      '<div class="hint" id="cloudMsg" style="margin-top:10px">'+(DB.cloud.last?"Last backup "+uk(iso(new Date(DB.cloud.last))):"")+'</div>'+
    '</div>'+
    '<div class="card"><div class="eyebrow" style="margin-bottom:14px">Your data</div>'+
      '<button class="btn sec" onclick="exportBackup()"><span class="lbl">Export a backup file</span></button>'+
      '<label class="btn sec" style="margin-top:10px;cursor:pointer"><span class="lbl">Restore from a file</span>'+
        '<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)" /></label>'+
      '<button class="btn danger" style="margin-top:10px" onclick="confirmReset()"><span class="lbl">Erase everything</span></button>'+
      '<p class="tiny dim" style="margin-top:12px">Cycle records, photographs, measurements, pain reports and check-ins are private health information. They stay on this device and in your own cloud document, readable only by a signed-in session of this app. Photographs are never uploaded.</p>'+
    '</div>'+
    '<p class="tiny dim" style="text-align:center">Train '+VERSION+'</p>'+
  '</div>';
}
function togglePref(k,elm){ DB.prefs[k]=!DB.prefs[k]; elm.classList.toggle("on",DB.prefs[k]); save(); }
function toggleCloudOn(elm){ DB.cloud.on=!DB.cloud.on; elm.classList.toggle("on",DB.cloud.on); save(); if(DB.cloud.on) cloudPush(false); }

async function showCloudStatus(){

function confirmReset(){
  openSheet("Erase everything",
    '<p class="muted">Every check-in, session, record, measurement, photograph and cycle entry on this device. It cannot be undone. Export a backup first if you are not certain.</p>'+
    '<button class="btn danger" style="margin-top:18px" onclick="doReset()"><span class="lbl">Erase it all</span></button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()"><span class="lbl">Keep my data</span></button>');
}
function doReset(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  idbSet(null);
  const fresh=mergeDefaults(null);
  Object.keys(DB).forEach(k=>delete DB[k]);
  Object.assign(DB,fresh);
  CI_DRAFT=null; save(); closeSheet(); go("home"); toast("Erased");
}

function durationPrefsSheet(){
  const d=(DB.prefs.durations)||{quick:20,standard:40,full:60};
  const row=(k,lab)=>'<div class="ci-item"><div class="ci-head"><span class="q">'+lab+'</span>'+
    '<span class="v num" id="dp-'+k+'">'+d[k]+' min</span></div>'+
    '<input class="slider" data-slider type="range" min="10" max="90" step="5" value="'+d[k]+'" '+
    'oninput="el(\'dp-'+k+'\').textContent=this.value+\' min\';paintSlider(this)" '+
    'onchange="DB.prefs.durations.'+k+'=+this.value;save()" /></div>';
  openSheet("Session lengths", row("quick","Quick")+row("standard","Standard")+row("full","Full")+
    '<p class="muted small">These are the three buttons on the workout screen.</p>');
}
/* ---------- history ---------- */
function openHistory(){
  const keys=Object.keys(DB.sessions||{}).filter(k=>{
    const s=DB.sessions[k]; return s && !s.rest && !s.deleted && s.state;
  }).sort().reverse().slice(0,60);
  if(!keys.length){ openSheet("Workout history",'<div class="empty"><p>Nothing completed yet.</p></div>'); return; }
  openSheet("Workout history", keys.map(k=>{
    const s=DB.sessions[k];
    const done=!!(s.state&&s.state.finished);
    const {done:dn,total}=sessionSetsDone(s);
    return '<button class="pick plain" onclick="closeSheet();openDay(\''+k+'\')">'+
      '<span class="grow"><span class="nm">'+esc(s.title)+'</span>'+
      '<span class="mt num">'+uk(k)+' · '+dn+'/'+total+' sets'+(done?' · completed':'')+'</span></span>'+
      (done?'<span class="chip good">'+ICO.check+'</span>':'<span class="chip">part</span>')+'</button>';
  }).join(""));
}

/* =====================================================================
   BOOT
   ===================================================================== */
function migrate(){
  /* Make sure today's session exists and matches the programme, without
     ever rewriting one that is already under way. */
  const d=today();
  if(!DB.sessions) DB.sessions={};
  const w=DB.sessions[d];
  if(!w){ DB.sessions[d]=buildSession(d, DB.prefs.lastDuration||"full"); }
  else if(!w.rest && !w.deleted && !w.edited && !w.analysis &&
          !(w.state&&w.state.clock&&w.state.clock.startedAt)){
    DB.sessions[d]=buildSession(d, w.duration||DB.prefs.lastDuration||"full");
  }
  /* Yesterday's unfinished session stops being live, and is kept as history. */
  Object.keys(DB.sessions).forEach(k=>{
    const s=DB.sessions[k];
    if(!s||!s.state) return;
    if(!s.state.clock) s.state.clock={startedAt:null,pausedMs:0,pausedAt:null};
    if(k<d && s.state.clock.startedAt && !s.state.finished && !s.state.clock.pausedAt){
      s.state.clock.pausedAt=Date.now(); s.state.rest=null; s.state.work=null;
    }
  });
  /* Today's session, restored. A countdown that ran out while the app was
     closed is finished, not resumed; a paused one keeps its exact remainder. */
  const t=DB.sessions[d];
  if(t&&t.state){
    if(!t.state.clock) t.state.clock={startedAt:null,pausedMs:0,pausedAt:null};
    if(t.state.rest && t.state.rest.left==null && t.state.rest.endsAt<=Date.now()) t.state.rest=null;
    if(t.state.work && t.state.work.left==null && t.state.work.endsAt<=Date.now()) t.state.work=null;
    /* a count-in that ran out while the app was closed just starts again */
    if(t.state.lead && (t.state.lead.left==null && t.state.lead.endsAt<=Date.now())) t.state.lead=null;
    if(!t.state.phase) t.state.phase = t.state.clock.startedAt? "work":"ready";
  }
  /* Trim the store so it never outgrows a Firestore document. */
  const keys=Object.keys(DB.sessions).sort();
  if(keys.length>200) keys.slice(0,keys.length-200).forEach(k=>delete DB.sessions[k]);
  updateStreak(d);
  save();
}
function boot(){
  try{ migrate(); }catch(e){ console.error("migrate",e); }
  try{ dailyNudge(); }catch(e){ console.error("nudge",e); }
  try{ probeDemos(); }catch(e){}
  go("home",{force:true});
  if(DB.cloud && DB.cloud.on){ setTimeout(()=>{ cloudPush(true); },4000); }
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){
      if(today()!==(DB._lastDay||today())){ DB._lastDay=today(); migrate(); }
      if(CUR==="train") renderTrain();
      else if(CUR==="home") renderHome();
    }
  });
  DB._lastDay=today();
  window.addEventListener("error",e=>{ console.error("uncaught",e.message); });
}
document.addEventListener("DOMContentLoaded",boot);
if(document.readyState!=="loading") boot();

</script>
